name: Bug report
description: Behaviour differs from the documentation or the specification.
title: "<Area>: <Clear Problem Name>"
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Three one-sentence bullets in plain English, no ids. For a bug, what the fix restores and what a demo of the fix shows. Specification ids go in Expected behaviour and Technical reference.
      value: |
        - **What we're building:** 
        - **Why it matters:** 
        - **What the demo shows:** 
    validations: { required: true }
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [process-engine, rule-engine, cockpit, cross-cutting, examples, docs]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "rule-engine 0.1.0, Java 21, Spring Boot 4.1.2, PostgreSQL 16"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour and its source
      description: Quote the wiki page or specification id that defines the correct behaviour.
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A rule set or process definition plus the inputs, or a link to a small repository.
      render: yaml
    validations: { required: true }
  - type: textarea
    id: technical-reference
    attributes:
      label: Technical reference
      description: "Ids this touches, with links: feature ids, specification ids (RLE-, PRE-, CKP-), requirement ids (TR-), decisions, ADRs. Optional for outside contributors; maintainers complete it."
