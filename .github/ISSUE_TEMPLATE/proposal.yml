name: Design proposal
description: A design or API change that needs discussion before implementation. Accepted proposals become ADRs.
title: "Proposal: <Clear Change Name>"
labels: ["type:proposal", "status:needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Three one-sentence bullets in plain English, no ids or jargon. Feature ids, specification ids and requirement ids go in Proposed behaviour (acceptance criteria) and Technical reference.
      value: |
        - **What we're building:** 
        - **Why it matters:** 
        - **What the demo shows:** 
    validations: { required: true }
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
    validations: { required: true }
  - type: textarea
    id: design
    attributes:
      label: Detailed design
      description: API, storage, compatibility, security considerations.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations: { required: true }
  - type: textarea
    id: technical-reference
    attributes:
      label: Technical reference
      description: "Ids this touches, with links: feature ids, specification ids (RLE-, PRE-, CKP-), requirement ids (TR-), decisions, ADRs. Optional for outside contributors; maintainers complete it."
