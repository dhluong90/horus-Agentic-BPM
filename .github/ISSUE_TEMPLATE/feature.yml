name: Feature request
description: Propose a capability for the Process Engine, Rule Engine or Cockpit.
title: "<Area>: <Clear Feature Name>"
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Three one-sentence bullets in plain English, no ids or jargon. Feature ids, specification ids and requirement ids go in Proposed behaviour (acceptance criteria) and Technical reference.
      value: |
        - **What we're building:** 
        - **Why it matters:** 
        - **What the demo shows:** 
    validations: { required: true }
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [process-engine, rule-engine, cockpit, cross-cutting, examples, docs]
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current design does not allow it.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the behaviour, ideally as Given / When / Then with a concrete example. Reference wiki pages where relevant.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: technical-reference
    attributes:
      label: Technical reference
      description: "Ids this touches, with links: feature ids, specification ids (RLE-, PRE-, CKP-), requirement ids (TR-), decisions, ADRs. Optional for outside contributors; maintainers complete it."
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays within the project's scope (embeddable library, deterministic evaluation, no arbitrary code execution)
          required: true
