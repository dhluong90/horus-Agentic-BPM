name: Publish wiki
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/wiki; then
            echo "::warning::Wiki not initialised. Create the first page once in the GitHub UI, then re-run this workflow."; exit 0; fi
          rsync -a --delete --exclude .git wiki/ /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; else
            git commit -m "docs(wiki): sync from ${GITHUB_SHA::7}"; git push; fi
