name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned by commit SHA; the comment names the release. Update both together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-coverage:
    # TR-QA-01: every specification id in scope has a test named by it. Reads sources only; no build.
    name: Spec-to-test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tests of the gate
        run: python3 tools/test_spec_coverage.py -v

      - name: Spec-to-test gate
        run: python3 tools/spec-coverage.py

  verify:
    # Java 21 baseline on the Spring Boot 4.x version set in pom.xml (ADR-0011).
    # Further legs (Java 25, Spring Boot 3.5.x, PostgreSQL 14 and 17) join this matrix in a later change.
    name: Build and test (Java ${{ matrix.java }}, Spring Boot 4.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, unit and ArchUnit tests, Testcontainers integration tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14
