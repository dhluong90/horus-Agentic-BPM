name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A release tag runs the full matrix, so no release is cut from a commit only one leg has seen.
    tags: ["v*"]
  workflow_dispatch:
  # Nightly, so a vulnerability published against a merged dependency fails main within a day.
  # GitHub notifies the workflow's owner when a scheduled run fails.
  schedule:
    - cron: "0 2 * * *"

# Actions are pinned by commit SHA; the comment names the release. Update both together.
permissions:
  contents: read

# PostgreSQL images of the verify matrix, pinned by digest (PD-100). Testcontainers 2 refuses a tag and a
# digest together, so each value is postgres@sha256:<digest> and the comment names the tag and version the
# digest resolved to. Update digest and comment together; tools/check-image-pins.py refuses an unpinned image.
env:
  POSTGRES_14_IMAGE: postgres@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20 # 14-alpine, 14.25
  POSTGRES_16_IMAGE: postgres@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d # 16-alpine, 16.16, rebuilt 22 Nov 2026
  POSTGRES_18_IMAGE: postgres@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71 # 18-alpine, 18.7, rebuilt 21 Nov 2026

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Decision 3a: a pull request that changes only site/**, wiki/**, docs/** or a root-level *.md skips the Java and
    # cockpit jobs below; the docs-site and wiki workflows and the light jobs here still run. Every other
    # event (push to main, tag, nightly, manual) runs everything. A skipped job counts as passed for a
    # required check. The rule is in tools/ci-code-changed.sh.
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The merge commit of a pull request and its first parent (the base tip).
          fetch-depth: 2

      - name: Tests of the filter
        run: tools/test-ci-code-changed.sh

      - name: Does the change touch anything but documentation?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Event $EVENT: everything runs."
            exit 0
          fi
          # Fail closed: anything but an explicit "false" runs every job.
          result="$(tools/ci-code-changed.sh HEAD^1 HEAD || echo true)"
          [ "$result" = false ] || result=true
          echo "code=$result" >> "$GITHUB_OUTPUT"
          echo "Docs-only change: $([ "$result" = false ] && echo yes || echo no)"

  spec-coverage:
    # TR-QA-01: every specification id in scope has a test named by it. Reads sources only; no build.
    name: Spec-to-test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tests of the gate
        run: python3 tools/test_spec_coverage.py -v

      - name: Spec-to-test gate
        run: python3 tools/spec-coverage.py

      - name: Tests of the Maven retry script (stub mvn, no network)
        run: tools/test-mvn-retry.sh

      - name: Tests of the image pin check and of the weekly test-image rescan
        run: |
          python3 tools/test_check_image_pins.py -v
          python3 tools/test_rescan_test_images.py -v

      # PD-100: every container image in tests, workflows, POMs and tool scripts is pinned by digest.
      - name: Container images pinned by digest
        run: python3 tools/check-image-pins.py

  verify:
    # TR-EMB-02: the supported matrix (ADR-0011). Each Java version runs on both Spring Boot lines and
    # each Spring Boot line on PostgreSQL 14, 16 and 18, pairwise; Spring Boot 4.0.x has one leg while it
    # is in open-source support. A pull request and a push to main run one leg (Java 21, Spring Boot 4.x,
    # PostgreSQL 18); the nightly run, a manual run and a release tag run all seven (lean mode, PD-151).
    # The 3.5.x legs test the jars built on the 4.x baseline, as an adopter receives them: the same
    # compiled tests run on a Spring Boot 3.5 runtime classpath (-Dspring-boot.line=3.5, pom.xml).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.boot }}, PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # ADR-0011 tests every 4.x minor in open-source support. Remove the 4.0.x leg, and the
      # spring-boot-4.0 profile in pom.xml, after Spring Boot 4.0 leaves it on 2026-12-31.
      matrix:
        include: >-
          ${{ fromJSON(
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
          && '[{"java":"21","boot":"4.x","postgres":"18"},{"java":"21","boot":"3.5.x","postgres":"14"},{"java":"25","boot":"4.x","postgres":"14"},{"java":"25","boot":"3.5.x","postgres":"18"},{"java":"21","boot":"4.0.x","postgres":"16"},{"java":"25","boot":"4.x","postgres":"16"},{"java":"21","boot":"3.5.x","postgres":"16"}]'
          || '[{"java":"21","boot":"4.x","postgres":"18"}]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The digest-pinned image of this leg's PostgreSQL version, pulled here so the log shows the digest.
      - name: PostgreSQL ${{ matrix.postgres }} image, pinned by digest
        env:
          PINNED: ${{ env[format('POSTGRES_{0}_IMAGE', matrix.postgres)] }}
          VERSION: ${{ matrix.postgres }}
        run: |
          if [ -z "$PINNED" ]; then
            echo "::error title=PostgreSQL image not pinned::No POSTGRES_${VERSION}_IMAGE in the env of ci.yml. Add postgres@sha256:<digest> for PostgreSQL ${VERSION}."
            exit 1
          fi
          docker pull "$PINNED"
          echo "POSTGRES_IMAGE=$PINNED" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Maven repository cache (#171). Exact key: this leg's Spring Boot line and every pom.xml. When the
      # POMs changed, restore-keys fall back to the newest cache of the same line, then of any line; a
      # pull request can restore caches saved on main, so a branch never starts from an empty repository.
      # The last prefix reads the caches setup-java saved on main before this change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Written as setup-java writes it (os.homedir() on the hosted runner), so the caches setup-java
          # saved on main have the same cache version and match the last restore key.
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-boot-${{ matrix.boot }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-boot-${{ matrix.boot }}-
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-x64-maven-

      # A restored cache can hold *.lastUpdated markers of a download that failed in an earlier run; Maven
      # then reports the artifact "(absent)" without asking Central again (#171). Ask again.
      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true

      # The cockpit starter packages cockpit/web/dist; every leg builds the starter, and the example host's cockpit test needs it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Build the cockpit bundle
        working-directory: cockpit/web
        run: |
          npm ci
          npm run build

      - name: Build, unit and ArchUnit tests, Testcontainers integration tests (Spring Boot 4.x)
        if: matrix.boot == '4.x'
        run: tools/mvn-retry.sh -B -ntp verify -Dbpm.test.postgres.image="$POSTGRES_IMAGE"

      - name: Build the engine on the Spring Boot 4.x baseline, tests compiled but not run
        if: matrix.boot != '4.x'
        run: tools/mvn-retry.sh -B -ntp install -DskipTests

      # The dependency bans and convergence rules, evaluated against this line's dependency tree.
      - name: Enforcer rules on the Spring Boot ${{ matrix.boot }} dependency tree
        if: matrix.boot != '4.x'
        run: |
          tools/mvn-retry.sh -B -ntp -Dspring-boot.line="$LINE" -pl "!bpm-bom" enforcer:enforce@enforce-build-baseline
          tools/mvn-retry.sh -B -ntp -Dspring-boot.line="$LINE" -pl rule-engine/rule-engine-core,rule-engine/rule-engine-postgres \
            enforcer:enforce@enforce-no-network-client
          tools/mvn-retry.sh -B -ntp -Dspring-boot.line="$LINE" -pl rule-engine/rule-engine-core \
            enforcer:enforce@enforce-framework-free-core
        env:
          LINE: ${{ matrix.boot == '3.5.x' && '3.5' || '4.0' }}

      - name: Run the same tests on Spring Boot ${{ matrix.boot }}
        if: matrix.boot != '4.x'
        run: >-
          tools/mvn-retry.sh -B -ntp -Dspring-boot.line="$LINE" -Dbpm.test.postgres.image="$POSTGRES_IMAGE"
          surefire:test failsafe:integration-test failsafe:verify
        env:
          LINE: ${{ matrix.boot == '3.5.x' && '3.5' || '4.0' }}

      - name: Jackson 3 resolves beside the host's own Jackson 2 (TR-EMB-07, PD-071)
        if: matrix.boot == '3.5.x'
        run: |
          tools/mvn-retry.sh -B -ntp -q -Dspring-boot.line=3.5 -pl examples/rule-engine-only \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -Dincludes=com.fasterxml.jackson.core,tools.jackson.core -DoutputFile=target/jackson-tree.txt
          python3 tools/check-jackson-coexistence.py examples/rule-engine-only/target/jackson-tree.txt \
            "$(tools/mvn-retry.sh -B -ntp -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)"

      - name: Jackson 3 resolves beside the host's own Jackson 2 in the process host (TR-EMB-07, PRE-045)
        if: matrix.boot == '3.5.x'
        run: |
          tools/mvn-retry.sh -B -ntp -q -Dspring-boot.line=3.5 -pl examples/rule-and-process \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -Dincludes=com.fasterxml.jackson.core,tools.jackson.core -DoutputFile=target/jackson-tree.txt
          python3 tools/check-jackson-coexistence.py examples/rule-and-process/target/jackson-tree.txt \
            "$(tools/mvn-retry.sh -B -ntp -q help:evaluate -Dexpression=settings.localRepository -DforceStdout | tail -n 1)"

      - name: Name Maven Central downloads that failed
        if: failure()
        run: |
          failed="$(find ~/.m2/repository -name '*.lastUpdated' 2>/dev/null | sed -E 's#.*/\.m2/repository/##; s#\.lastUpdated$##' | sort)"
          if [[ -n "$failed" ]]; then
            echo "::error title=Maven Central download failed::These artifacts could not be downloaded from Maven Central after retries (#171): $(echo $failed | tr '\n' ' ')"
            printf '%s\n' "$failed"
          else
            echo "No failed Maven Central download recorded; the failure has another cause."
          fi
          # Never save a remembered failure into the cache.
          find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-${{ matrix.java }}-boot-${{ matrix.boot }}-pg-${{ matrix.postgres }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            examples/rule-engine-only/target/jackson-tree.txt
          if-no-files-found: ignore
          retention-days: 14

  throughput-report:
    # PRE-087 (TR-PERF-04): the step throughput of one replica on PostgreSQL with history on, against the target of
    # 1,000 transitions per second. Reported and never a gate (PD-026): a result below the target, or more than 20 %
    # below the previous report, is a warning in the job summary, and the job passes. Runs nightly and on manual dispatch.
    name: Throughput report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: PostgreSQL image, pinned by digest
        run: |
          docker pull "$POSTGRES_18_IMAGE"
          echo "POSTGRES_IMAGE=$POSTGRES_18_IMAGE" >> "$GITHUB_ENV"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-throughput-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-boot-4.x-
            maven-${{ runner.os }}-

      # The report of the previous run on main, for the comparison. A miss is fine: there is nothing to compare with.
      - name: Restore the previous report
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: throughput-previous
          key: throughput-previous-${{ github.run_id }}
          restore-keys: |
            throughput-previous-

      - name: Run the load test (1 minute warm-up, 5 minutes measured)
        run: |
          previous=""
          if [ -f throughput-previous/throughput-report.json ]; then previous="$PWD/throughput-previous/throughput-report.json"; fi
          tools/mvn-retry.sh -B -ntp verify -pl process-engine/process-engine-postgres -am \
            -Dbpm.test.postgres.image="$POSTGRES_IMAGE" \
            -Dit.test=ThroughputReportIT -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dhorus.throughput.warmup=PT1M -Dhorus.throughput.measure=PT5M -Dhorus.throughput.previous="$previous"

      - name: Job summary
        if: always()
        run: |
          report=process-engine/process-engine-postgres/target/throughput-report
          if [ -f "$report/throughput-report.md" ]; then cat "$report/throughput-report.md" >> "$GITHUB_STEP_SUMMARY"; fi
          mkdir -p throughput-previous
          if [ -f "$report/throughput-report.json" ]; then cp "$report/throughput-report.json" throughput-previous/; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: throughput-report
          path: process-engine/process-engine-postgres/target/throughput-report/
          if-no-files-found: warn
          retention-days: 90

  feel-differential-nightly:
    # RLE-021 (TR-STD-02): the differential property test against the reference FEEL implementation at
    # 100,000 tries per property. Every pull request runs the same test at 1,000 tries in the verify job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: FEEL differential test, 100,000 tries per property
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-boot-4.x-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-boot-4.x-
            maven-${{ runner.os }}-

      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true

      # A failure prints the seed and the try; replay it with -Dbpm.property.seed and -Dbpm.property.try.
      - name: Differential property test, 100,000 tries per property
        run: >-
          tools/mvn-retry.sh -B -ntp -pl rule-engine/rule-engine-core -am test
          -Dtest=FeelDifferentialTest -Dsurefire.failIfNoSpecifiedTests=false
          -Dbpm.property.tries=100000

      # The full report lists 500,000 tries; keep only the summary and any failure.
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feel-differential-nightly
          path: rule-engine/rule-engine-core/target/surefire-reports/*FeelDifferentialTest.txt
          if-no-files-found: ignore
          retention-days: 14

  dependency-gates:
    # TR-SEC-06, TR-LIC-01 and TR-LIC-02: policy checks, licence gate, SBOMs, licence notices in jars
    # and vulnerability scans. Tests run in the verify job; this job builds without them so both
    # finish in parallel. Maven runs with --strict-checksums and download retries (.mvn/maven.config).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Dependency licences, SBOM and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRYPE_VERSION: "0.122.1"
      # SHA-256 of grype_0.122.1_linux_amd64.tar.gz, from the signed checksum file of that release.
      GRYPE_SHA256: "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # Maven repository cache (#171), as in the verify job: exact key, then the newest cache of this job,
      # then of any job, including those saved on main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Written as setup-java writes it (os.homedir() on the hosted runner), so the caches setup-java
          # saved on main have the same cache version and match the last restore key.
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-gates-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-gates-
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-x64-maven-

      # A restored cache can hold *.lastUpdated markers of a download that failed in an earlier run; Maven
      # then reports the artifact "(absent)" without asking Central again (#171). Ask again.
      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true

      - name: Gate settings only in the root POM; Grype config lint
        run: |
          python3 tools/check-dependency-policy.py poms
          python3 tools/check-dependency-policy.py grype-config

      # The cockpit starter packages cockpit/web/dist, so the gates see the jar as it ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Build the cockpit bundle
        working-directory: cockpit/web
        run: |
          npm ci
          npm run build

      - name: Licence gate (TR-LIC-01) and CycloneDX SBOMs (TR-SEC-06)
        run: tools/mvn-retry.sh -B -ntp verify -DskipTests

      # PD-098: the reference FEEL engine and its runtime are allowed in test scope only, at the versions in
      # tools/licence-policy/test-oracle-allow-list.txt. The licence gate above skips test scope, so this
      # compares the resolved feel-engine subtree with the file: a changed version, an unlisted artifact or
      # a listed one no longer resolved fails, naming the artifact.
      - name: Test-scope FEEL oracle matches its allow-list file (TR-LIC-01)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 tools/test_check_test_oracle.py -v
          tools/mvn-retry.sh -B -ntp -q dependency:tree -Dscope=test -pl rule-engine/rule-engine-core \
            -DoutputFile="$RUNNER_TEMP/oracle-tree.txt"
          python3 tools/check-test-oracle.py tree "$RUNNER_TEMP/oracle-tree.txt"

      - name: Licence files and manifest entries in every engine jar (TR-LIC-02)
        if: ${{ !cancelled() && hashFiles('target/bom.json') != '' }}
        run: python3 tools/check-dependency-policy.py jar-notices

      - name: Add annotation processors to the build SBOM
        if: ${{ !cancelled() && hashFiles('target/bom-build.json') != '' }}
        run: |
          tools/mvn-retry.sh -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.6.0:effective-pom -Doutput=target/effective-pom.xml
          python3 tools/check-dependency-policy.py add-processors

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !cancelled() && hashFiles('target/bom.json') != '' }}

      - name: Install Grype (signature and pinned checksum verified)
        if: ${{ !cancelled() && hashFiles('target/bom.json') != '' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          sums="grype_${GRYPE_VERSION}_checksums.txt"
          curl -sSfL -O "$base/$tarball" -O "$base/$sums" -O "$base/$sums.sigstore.json"
          cosign verify-blob "$sums" --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"

      - name: Canary, the scan must fail on a known critical advisory (TR-SEC-06)
        if: ${{ !cancelled() && env.GRYPE != '' }}
        run: tools/scan-dependencies.sh --canary

      - name: Vulnerability gate, shipped modules, fails on high or critical (TR-SEC-06)
        if: ${{ !cancelled() && env.GRYPE != '' }}
        run: tools/scan-dependencies.sh

      - name: Vulnerability gate, build and test classpath, fails on critical (TR-SEC-06)
        if: ${{ !cancelled() && env.GRYPE != '' }}
        run: tools/scan-dependencies.sh --build

      - name: Name Maven Central downloads that failed
        if: failure()
        run: |
          failed="$(find ~/.m2/repository -name '*.lastUpdated' 2>/dev/null | sed -E 's#.*/\.m2/repository/##; s#\.lastUpdated$##' | sort)"
          if [[ -n "$failed" ]]; then
            echo "::error title=Maven Central download failed::These artifacts could not be downloaded from Maven Central after retries (#171): $(echo $failed | tr '\n' ' ')"
            printf '%s\n' "$failed"
          else
            echo "No failed Maven Central download recorded; the failure has another cause."
          fi
          # Never save a remembered failure into the cache.
          find ~/.m2/repository -name '*.lastUpdated' -delete 2>/dev/null || true

      - name: Upload SBOMs and scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
            target/bom-build.json
            target/grype-*.json
            **/target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: warn
          retention-days: 90

  pooler:
    # TR-OPS-05: the engine's tests tagged "pooler" run through PgBouncer in transaction mode (pinned in the root
    # POM): the full rule set lifecycle with every statement checked for session state, partition maintenance from
    # two replicas at once, and two example hosts whose caches refresh by the epoch check alone.
    name: Rule Engine behind PgBouncer (transaction mode)
    # Nightly and on manual dispatch only (lean mode, PD-151).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-boot-4.x-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-boot-4.x-
            maven-${{ runner.os }}-

      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true

      # The cockpit bundle is not needed: only the tests tagged "pooler" run, and none of them serves the cockpit.
      - name: Tests through PgBouncer in transaction mode, PostgreSQL 16
        run: >-
          tools/mvn-retry.sh -B -ntp verify -Dcockpit.bundle.skip=true -Dgroups=pooler
          -pl rule-engine/rule-engine-postgres,examples/rule-engine-only -am
          -Dbpm.test.postgres.image="$POSTGRES_16_IMAGE"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-pooler
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  benchmark:
    # TR-PERF-01 and TR-PERF-02 every night: JMH (examples/rule-engine-benchmarks, never published) on the
    # hosted runner, JDK 21. tools/benchmark-report.py writes the report to the job summary and fails when the p99
    # of one evaluation of the 200-row first table reaches 100 us; the 1,000-row compile time is reported only.
    # The JSON result is kept 90 days, so the trend can be read from the artifacts.
    name: Rule Engine benchmarks (JMH)
    # Nightly and on manual dispatch only (lean mode, PD-151).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-boot-4.x-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-boot-4.x-
            maven-${{ runner.os }}-

      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true

      - name: Tests of the report script
        run: python3 tools/test_benchmark_report.py -v

      - name: Build the benchmarks
        run: |
          tools/mvn-retry.sh -B -ntp install -pl examples/rule-engine-benchmarks -am -Dcockpit.bundle.skip=true
          tools/mvn-retry.sh -B -ntp -q -pl examples/rule-engine-benchmarks \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
            -Dmdep.includeScope=runtime -Dmdep.outputFile=target/classpath.txt

      - name: Run JMH
        working-directory: examples/rule-engine-benchmarks
        run: java -cp "target/classes:$(cat target/classpath.txt)" org.openjdk.jmh.Main -rf json -rff target/jmh-result.json

      - name: Report and budget (TR-PERF-01 gating, TR-PERF-02 reported)
        run: |
          status=0
          python3 tools/benchmark-report.py examples/rule-engine-benchmarks/target/jmh-result.json \
            --out examples/rule-engine-benchmarks/target/benchmark-report.md || status=$?
          cat examples/rule-engine-benchmarks/target/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rule-engine-benchmarks
          path: |
            examples/rule-engine-benchmarks/target/jmh-result.json
            examples/rule-engine-benchmarks/target/benchmark-report.md
          if-no-files-found: warn
          retention-days: 90

  cockpit:
    # The cockpit web application on every pull request: licences of shipped packages, generated schemas,
    # lint, types and Vitest. The Playwright UI suite is the separate cockpit-ui job below.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cockpit (lint, typecheck, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cockpit/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # npm install scripts run in this job; keep the token out of .git/config.
          persist-credentials: false

      # The exact Node of the release bundle build (tools/release/build-cockpit.sh), so the tests run on it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/release/node-version
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Licences of shipped packages (TR-LIC-01)
        run: npm run licences

      - name: Generated schemas match cockpit/api/schema
        run: npm run schemas:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

  cockpit-ui:
    # Playwright on the Chromium of the Playwright image against the production build. A pull request runs the
    # smoke subset (1440x900, light theme, English: about 390 of the 1,970 checks, 2 minutes locally); main, the
    # nightly run and a manual start run the full suite (every state at two sizes, two themes, two languages, with
    # axe). The specs and visual baselines are in cockpit/web/e2e.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cockpit UI (Playwright)
    runs-on: ubuntu-latest
    # The full suite (about 1,970 checks) takes 17 to 20 minutes on a hosted runner; 45 leaves room without
    # hiding a hung run. The pull request smoke subset takes a few minutes.
    timeout-minutes: 45
    # Chromium and the system libraries it needs come with Playwright's own image, pinned by digest, so
    # no apt download is on this job's critical path (an Ubuntu mirror outage failed every run). The tag
    # is the @playwright/test version in cockpit/web/package-lock.json; the first step below reads the tag
    # from this file and checks it. Update the tag and the digest together with the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    defaults:
      run:
        working-directory: cockpit/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/release/node-version
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: The Playwright image matches the lockfile
        run: |
          image="$(sed -nE 's#^ +image: mcr\.microsoft\.com/playwright:v([0-9]+\.[0-9]+\.[0-9]+)-.*#\1#p' ../../.github/workflows/ci.yml | head -1)"
          locked="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ -z "$image" ] || [ "$locked" != "$image" ]; then
            echo "::error title=Playwright image out of date::package-lock.json has @playwright/test $locked, the job image in ci.yml is '${image}'. Update the image tag and digest in ci.yml."
            exit 1
          fi
          echo "@playwright/test $locked, image $image, Node $(node --version): browsers come from the image."

      - name: Install
        run: npm ci

      # The BPMN MIWG reference models (miwg-render.spec.ts): pinned, checksum-checked, build-time data only.
      - name: Fetch the BPMN MIWG suite
        run: ../../tools/conformance/fetch.sh miwg ../../target/conformance/suites

      - name: Playwright smoke (pull request, 1440x900, light, English)
        if: github.event_name == 'pull_request'
        # One worker per vCPU; Playwright's default is half of them. Names carry their size, theme and language.
        run: npm run e2e -- --workers=100% --grep-invert "_(1440x1200|dark|vi)(_|$)"

      - name: Playwright full (production build, 1440x900 and 1440x1200, light and dark, English and Vietnamese)
        if: github.event_name != 'pull_request'
        run: npm run e2e -- --workers=100%

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cockpit-playwright
          path: |
            cockpit/web/playwright-report/
            cockpit/web/e2e/screenshots/
            cockpit/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  cockpit-visual:
    # Visual regression (#587): the main cockpit screens at 1440x900, light theme, English, compared with the reviewed
    # images in cockpit/web/e2e/visual-baselines (at most 0.05 % of the pixels may differ). The images are drawn in this
    # same Playwright image, so a failure is a change to the screen. To accept a reviewed change, run
    # `npm run e2e:visual:update` in cockpit/web (it uses this image through Docker) and commit the images.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Cockpit visual regression
    runs-on: ubuntu-latest
    # Twelve screens take under a minute; 15 leaves room for the image pull and the build without hiding a hung run.
    timeout-minutes: 15
    # Chromium and the system libraries it needs come with Playwright's own image, pinned by digest, so
    # no apt download is on this job's critical path (an Ubuntu mirror outage failed every run). The tag
    # is the @playwright/test version in cockpit/web/package-lock.json; the first step below reads the tag
    # from this file and checks it. Update the tag and the digest together with the lockfile.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    defaults:
      run:
        working-directory: cockpit/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/release/node-version
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: The Playwright image matches the lockfile
        run: |
          image="$(sed -nE 's#^ +image: mcr\.microsoft\.com/playwright:v([0-9]+\.[0-9]+\.[0-9]+)-.*#\1#p' ../../.github/workflows/ci.yml | head -1)"
          locked="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ -z "$image" ] || [ "$locked" != "$image" ]; then
            echo "::error title=Playwright image out of date::package-lock.json has @playwright/test $locked, the job image in ci.yml is '${image}'. Update the image tag and digest in ci.yml."
            exit 1
          fi
          echo "@playwright/test $locked, image $image, Node $(node --version): browsers come from the image."

      - name: Install
        run: npm ci

      - name: Compare the screens with their images
        env:
          COCKPIT_VISUAL: "1"
        run: npx playwright test --workers=100%

      - name: Upload the actual, expected and difference images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cockpit-visual-diff
          path: cockpit/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  migration-order:
    # #296: the engines run Flyway with out-of-order migrations off, so an engine migration numbered at or
    # below the highest on main, a reused or retired number, or an edited released migration would stop
    # an adopter's host from starting. Reads git history only; no build.
    name: Migration order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history, so the merge base of the change and main is known.
          fetch-depth: 0

      - name: Tests of the check (fixture repositories)
        run: python3 tools/test_check_migration_order.py -v

      # A pull request is compared with main as fetched now, not as it was when the branch started. A push
      # to main is compared with the commit before the push, which catches a pull request that sat green
      # while another migration merged. Any other run compares main with itself.
      - name: Engine migrations in order
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=origin/main
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            base="$BEFORE"
          fi
          echo "Comparing HEAD with $base"
          python3 tools/check-migration-order.py --base "$base" --head HEAD

  nightly-report:
    # A red night opens, or updates, one type:bug issue that names every failed job and leg, and links the
    # run. Every job's result is also in the run summary. Only the scheduled run files issues.
    name: Nightly report
    if: always() && github.event_name == 'schedule'
    needs: [spec-coverage, verify, throughput-report, feel-differential-nightly, dependency-gates, pooler, benchmark, cockpit, migration-order]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Run summary and issue
        run: |
          gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "Nightly report") | "\(.conclusion)\t\(.name)"' > jobs.tsv
          {
            echo "### Nightly results"
            echo
            echo "| Job or leg | Result |"
            echo "|---|---|"
            awk -F'\t' '{ printf "| %s | %s |\n", $2, $1 }' jobs.tsv
          } >> "$GITHUB_STEP_SUMMARY"
          failed="$(awk -F'\t' '$1 == "failure" || $1 == "timed_out" { print "- " $2 }' jobs.tsv)"
          if [ -z "$failed" ]; then
            echo "Every nightly job passed."
            exit 0
          fi
          title="Nightly CI is red"
          body="$(printf 'The nightly run failed in these jobs or legs:\n\n%s\n\nRun: %s' "$failed" "$RUN_URL")"
          existing="$(gh issue list --label type:bug --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label type:bug --body "$body"
          fi
