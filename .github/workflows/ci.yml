name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned by commit SHA; the comment names the release. Update both together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Java 21 baseline on the Spring Boot 4.x version set in pom.xml (ADR-0011).
    # Further legs (Java 25, Spring Boot 3.5.x, PostgreSQL 14 and 17) join this matrix in a later change.
    name: Build and test (Java ${{ matrix.java }}, Spring Boot 4.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, unit and ArchUnit tests, Testcontainers integration tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  dependency-gates:
    # TR-SEC-06 and TR-LIC-01: SBOM, licence check and vulnerability scan of the shipped modules.
    # Tests run in the verify job; this job builds without them so both finish in parallel.
    name: Dependency licences, SBOM and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Licence gate (TR-LIC-01) and CycloneDX SBOM (TR-SEC-06)
        run: mvn -B -ntp verify -DskipTests

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.json
            target/bom.xml
            **/target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.122.1

      - name: Vulnerability gate, fails on high or critical (TR-SEC-06)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: tools/scan-dependencies.sh target/bom.json
