name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Actions are pinned by commit SHA; the comment names the release. Update both together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Java 21 baseline on the Spring Boot 4.x version set in pom.xml (ADR-0011).
    # Further legs (Java 25, Spring Boot 3.5.x, PostgreSQL 14 and 17) join this matrix in a later change.
    name: Build and test (Java ${{ matrix.java }}, Spring Boot 4.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The cockpit starter packages cockpit/web/dist; the example host's cockpit test needs it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Build the cockpit bundle
        working-directory: cockpit/web
        run: |
          npm ci
          npm run build

      - name: Build, unit and ArchUnit tests, Testcontainers integration tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  cockpit:
    # The cockpit web application: licences of shipped packages, generated schemas, lint, types,
    # Vitest, then Playwright on the bundled Chromium against the production build.
    name: Cockpit (lint, typecheck, Vitest, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cockpit/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Licences of shipped packages (TR-LIC-01)
        run: npm run licences

      - name: Generated schemas match cockpit/api/schema
        run: npm run schemas:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Install the bundled Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (production build, 1440x900 and 1440x1200, light and dark, English and Vietnamese)
        run: npm run e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cockpit-playwright
          path: |
            cockpit/web/playwright-report/
            cockpit/web/e2e/screenshots/
            cockpit/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
