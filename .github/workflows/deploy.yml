name: Deploy

# Builds the example host image and runs the docker compose smoke test (docs/DEPLOYING.md), then the
# image gates: no secrets in the layers, no high or critical vulnerability. Runs on every push to main, on release tags, nightly and on request;
# the CI workflow covers the engines.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Nightly, so a vulnerability published against the base image fails main within a day.
  schedule:
    - cron: "30 2 * * *"

# Actions are pinned by commit SHA; the comment names the release. Update both together.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Image build, compose smoke test and image gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRYPE_VERSION: "0.122.1"
      # SHA-256 of grype_0.122.1_linux_amd64.tar.gz, from the signed checksum file of that release.
      GRYPE_SHA256: "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538"
      IMAGE: horus-bpm/rule-engine-only:local
      # The build stage's image in deploy/docker/Dockerfile, used only to carry the Maven repository in and out.
      MAVEN_IMAGE: maven:3.9.16-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320
      M2_DIR: /home/runner/.cache/horus-bpm-m2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Throwaway secrets in .env, masked in the log
        run: |
          admin="$(openssl rand -hex 16)"; db="$(openssl rand -hex 16)"; demo="$(openssl rand -hex 12)"
          echo "::add-mask::$admin"; echo "::add-mask::$db"; echo "::add-mask::$demo"
          sed -e "s/^HORUS_DB_ADMIN_PASSWORD=.*/HORUS_DB_ADMIN_PASSWORD=$admin/" \
              -e "s/^HORUS_DB_PASSWORD=.*/HORUS_DB_PASSWORD=$db/" \
              -e "s/^HORUS_DEMO_PASSWORD=.*/HORUS_DEMO_PASSWORD=$demo/" .env.example > .env
          git check-ignore -q .env

      # Maven repository for the image build (#171). The Dockerfile keeps it in a BuildKit cache mount, which a
      # fresh runner does not have: restore the last saved copy, load it into the mount, build, save it again.
      # Not on a tag run: a release build restores no dependency cache.
      - name: Restore the Maven repository of the image build
        id: m2
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.M2_DIR }}
          key: maven-docker-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-docker-${{ runner.os }}-

      - name: Load it into the BuildKit cache mount
        if: github.ref_type != 'tag' && steps.m2.outputs.cache-hit != ''
        run: |
          find "$M2_DIR" -name '*.lastUpdated' -delete
          printf 'FROM %s\nRUN --mount=type=cache,id=horus-bpm-m2,target=/m2 --mount=type=bind,source=.,target=/seed cp -a /seed/. /m2/\n' "$MAVEN_IMAGE" \
            | docker build -f - "$M2_DIR"

      - name: Build the image
        run: docker compose build

      - name: Take the Maven repository out of the BuildKit cache mount
        if: github.ref_type != 'tag' && steps.m2.outputs.cache-hit != 'true'
        run: |
          rm -rf "$M2_DIR"; mkdir -p "$M2_DIR"
          printf 'FROM %s AS x\nRUN --mount=type=cache,id=horus-bpm-m2,target=/m2 mkdir /out && cp -a /m2/. /out/ && find /out -name "*.lastUpdated" -delete\nFROM scratch\nCOPY --from=x /out/ /\n' "$MAVEN_IMAGE" \
            | docker build -f - --output "type=local,dest=$M2_DIR" "$(mktemp -d)"
          du -sh "$M2_DIR"

      - name: Save the Maven repository of the image build
        if: github.ref_type != 'tag' && steps.m2.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.M2_DIR }}
          key: maven-docker-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Start PostgreSQL and the host, wait for healthy
        run: docker compose up --wait --wait-timeout 180

      - name: Smoke test (health, sign-in, metadata, rule lifecycle, cockpit)
        run: deploy/smoke-test.sh

      - name: Local-evaluation warning in the start-up log, application role without superuser rights
        run: |
          docker compose logs host | grep -F 'Demo users are on (dev profile): [lan, minh, hoa, tuan]'
          test "$(docker compose exec -T postgres psql -U postgres -d horus -tAc \
            "SELECT rolsuper OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname = 'horus'")" = f

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Grype (signature and pinned checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          sums="grype_${GRYPE_VERSION}_checksums.txt"
          curl -sSfL -O "$base/$tarball" -O "$base/$sums" -O "$base/$sums.sigstore.json"
          cosign verify-blob "$sums" --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"

      - name: Image gates, no secrets in layers and no high or critical vulnerability
        run: deploy/scan-image.sh "$IMAGE"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload the image scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: target/grype-image-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop and remove the stack
        if: always()
        run: docker compose down -v
