name: Release (dry run)

# Runs on every vX.Y.Z tag (one project tag per release, PD-087). Builds a release from a clean checkout: the cockpit bundle from these sources with the pinned Node,
# then every Java artifact, staged into target/release/maven-repo, with one bill of materials covering
# the Maven packages and the npm packages in the cockpit bundle (TR-LIC-01, TR-SEC-06, TR-UI-06).
# The staged artifacts, the bills of materials, BUILD-INFO.json and SHA256SUMS are uploaded to the
# workflow run. On a tag run only, the attest job signs build provenance for every staged jar and POM and
# an SBOM attestation for the jars (TR-SEC-06), and the github-release job then turns that archive into a
# GitHub Release. Maven Central publishing waits for the namespace and will be a separate workflow with no
# pull_request trigger (docs/RELEASING.md).
# Actions are pinned by commit SHA; the comment names the release. Update both together.

on:
  push:
    # One project tag per release, vX.Y.Z (PD-087); tools/release/check-release-tag.sh refuses any other.
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/release/**"
      - "tools/licence-policy/**"
      - "tools/check-test-oracle.py"
      - "tools/test_check_test_oracle.py"
      - "tools/fixtures/bom-with-test-oracle.cdx.json"

permissions:
  contents: read

# A pull request run is replaced by a newer one; a tag or dispatch run is never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tag-guard-tests:
    # Dry runs of the release tag guard on a scratch copy of the tree: v0.1.0 passes; a per-module tag,
    # a module at another version and a commit off main are refused. Then the archive check of the
    # github-release job against fixtures. Nothing is built and nothing is published.
    name: Release guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit tests of the tag check
        run: python3 tools/release/test_release_sbom.py -v

      # PD-098: the release SBOM check (run by release-build.sh) fails on the fixture that holds an oracle artifact.
      - name: Unit tests of the test-oracle check, release SBOM fixture included
        run: python3 tools/test_check_test_oracle.py -v

      - name: Dry runs of the tag guard
        run: tools/release/test-release-tag.sh

      - name: Archive check of the github-release job (tampered, trial, other commit, dirty, duplicate names)
        run: tools/release/test-release-upload.sh

      # #664: the attestation gate of the attest job, run against a fake GitHub CLI. Nothing is signed.
      - name: Dry run of the attestation gate (missing, unsigned, mismatched or wrong-tag statements are refused)
        run: tools/release/test-release-verify.sh

  release-dry-run:
    name: Release dry run (cockpit bundle, artifacts, release SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRYPE_VERSION: "0.122.1"
      # SHA-256 of grype_0.122.1_linux_amd64.tar.gz, from the signed checksum file of that release.
      GRYPE_SHA256: "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538"
      # Tag builds check the tag against the version and main (release-build.sh); empty otherwise.
      BPM_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # A tag build checks that the tagged commit is on main, which needs the history.
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}

      # No dependency cache: a release build never restores a cache another run could have written.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # The exact Node version of every release build; release-build.sh refuses any other.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/release/node-version
          package-manager-cache: false

      - name: Release build (bundle, tests, licence gates, staging, bills of materials, SHA256SUMS)
        run: tools/release/release-build.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: ${{ !cancelled() && hashFiles('target/release/bom-release.json') != '' }}

      - name: Install Grype (signature and pinned checksum verified)
        if: ${{ !cancelled() && hashFiles('target/release/bom-release.json') != '' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          sums="grype_${GRYPE_VERSION}_checksums.txt"
          curl -sSfL -O "$base/$tarball" -O "$base/$sums" -O "$base/$sums.sigstore.json"
          cosign verify-blob "$sums" --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"

      - name: Vulnerability gate on the release SBOM, Java and npm, fails on high or critical (TR-SEC-06)
        if: ${{ !cancelled() && env.GRYPE != '' }}
        run: tools/scan-dependencies.sh target/release/bom-release.json

      # Named by outcome, so the archive of a failed run can never be taken for a passing one.
      - name: Upload staged artifacts and bills of materials
        id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-${{ job.status }}
          path: |
            target/release/
            target/grype-bom-release.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record the archive digest in the step summary
        if: ${{ !cancelled() && steps.upload.outputs.artifact-id != '' }}
        env:
          ARTIFACT_NAME: release-dry-run-${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "### Release dry run: uploaded archive"
            echo
            echo "| Name | Artifact id | SHA-256 of the archive |"
            echo "|---|---|---|"
            echo "| \`${ARTIFACT_NAME}\` | ${ARTIFACT_ID} | \`${ARTIFACT_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  image-scan:
    # INF-06: the container images of the examples are built from deploy/docker/Dockerfile and scanned by Grype
    # (operating system packages and Java libraries) with the repository's .grype.yaml. A high or critical
    # finding fails the run, so it blocks the release. Same gates as the deploy workflow (deploy/scan-image.sh).
    name: Image vulnerability scan (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: [rule-engine-only, rule-and-process, guarded-agent-process]
    env:
      GRYPE_VERSION: "0.122.1"
      # SHA-256 of grype_0.122.1_linux_amd64.tar.gz, from the signed checksum file of that release.
      GRYPE_SHA256: "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538"
      IMAGE: horus-bpm/${{ matrix.example }}:local # pin-exempt: built in this job from deploy/docker/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Throwaway secret files, masked in the log
        run: |
          deploy/create-secrets.sh
          for f in secrets/*; do echo "::add-mask::$(cat "$f")"; done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: EXAMPLE=${{ matrix.example }}
          tags: ${{ env.IMAGE }}
          load: true
          push: false
          provenance: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install Grype (signature and pinned checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          sums="grype_${GRYPE_VERSION}_checksums.txt"
          curl -sSfL -O "$base/$tarball" -O "$base/$sums" -O "$base/$sums.sigstore.json"
          cosign verify-blob "$sums" --bundle "$sums.sigstore.json" \
            --certificate-identity "https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          echo "${GRYPE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" grype
          echo "GRYPE=$RUNNER_TEMP/grype" >> "$GITHUB_ENV"

      - name: Image gates, no secrets in layers and no high or critical vulnerability
        run: deploy/scan-image.sh "$IMAGE"

      - name: Upload the image scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-scan-${{ matrix.example }}
          path: target/grype-image-*.json
          if-no-files-found: ignore
          retention-days: 30

  attest:
    # TR-SEC-06: signed statements, kept by GitHub, of which commit and workflow built each staged jar and
    # POM (SLSA build provenance), and which bill of materials describes the jars (CycloneDX). Keyless:
    # Sigstore signs with this workflow's identity, so no key is stored. Tag runs only, and the only job
    # with id-token and attestations write; no checkout, no Maven, no npm. It signs the bytes the release
    # build staged, after checking them against SHA256SUMS. Verify with docs/RELEASING.md.
    name: Provenance and SBOM attestations (tag runs only)
    needs: release-dry-run
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run-success
          path: ${{ runner.temp }}/archive

      - name: Check the archive against SHA256SUMS and count the subjects
        env:
          ARCHIVE: ${{ runner.temp }}/archive/release
        run: |
          set -euo pipefail
          cd "$ARCHIVE"
          [[ -f SHA256SUMS ]] || { echo "ERROR: the archive has no SHA256SUMS; nothing is attested."; exit 1; }
          shasum -a 256 -c --quiet SHA256SUMS \
            || { echo "ERROR: the archive does not match its SHA256SUMS; nothing is attested."; exit 1; }
          listed="$(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort)"
          present="$(find . -type f ! -name SHA256SUMS | sort)"
          [[ "$listed" == "$present" ]] || { diff <(printf '%s\n' "$listed") <(printf '%s\n' "$present") || true; \
            echo "ERROR: the archive and SHA256SUMS list different files (above); nothing is attested."; exit 1; }
          [[ -f bom-release.json ]] || { echo "ERROR: no bom-release.json in the archive."; exit 1; }
          jars="$(find maven-repo -type f -name '*.jar' | wc -l | tr -d ' ')"
          poms="$(find maven-repo -type f -name '*.pom' | wc -l | tr -d ' ')"
          (( jars > 0 )) || { echo "ERROR: no jar under maven-repo; nothing is attested."; exit 1; }
          echo "SHA256SUMS: $(wc -l < SHA256SUMS | tr -d ' ') file(s) match. Subjects: $jars jar(s), $poms POM(s)."

      - name: Build provenance for every staged jar and POM, SHA256SUMS, BUILD-INFO.json and bom-release.json
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/archive/release/maven-repo/**/*.jar
            ${{ runner.temp }}/archive/release/maven-repo/**/*.pom
            ${{ runner.temp }}/archive/release/SHA256SUMS
            ${{ runner.temp }}/archive/release/BUILD-INFO.json
            ${{ runner.temp }}/archive/release/bom-release.json

      - name: SBOM attestation, bom-release.json over every staged jar
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/archive/release/maven-repo/**/*.jar
          sbom-path: ${{ runner.temp }}/archive/release/bom-release.json

      # #664, #258: the gate. Every jar and POM must verify against its provenance statement and every jar
      # against the SBOM statement, signed by this workflow at this tag. A missing or invalid statement fails
      # this job, and github-release needs this job, so no Release is created. The script needs no checkout.
      - name: Verify the signatures and attestations before anything is published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_DIGEST: ${{ github.sha }}
          ARCHIVE: ${{ runner.temp }}/archive/release
          SCRIPT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
            -o "$RUNNER_TEMP/verify-release-attestations.sh" \
            "https://api.github.com/repos/$REPO/contents/tools/release/verify-release-attestations.sh?ref=$SCRIPT_REF"
          chmod +x "$RUNNER_TEMP/verify-release-attestations.sh"
          "$RUNNER_TEMP/verify-release-attestations.sh" "$ARCHIVE" | tee "$RUNNER_TEMP/verify.out"
          {
            echo "### Attestation gate"
            echo
            echo '```'
            tail -n 1 "$RUNNER_TEMP/verify.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    # TR-SEC-06: a passing tag run becomes a GitHub Release, with the exact bytes the release build staged
    # and checked; nothing is rebuilt. The only job with a write token: no checkout, no Maven, no npm, one
    # pinned action. The assets go to a draft, which is published only after every upload is verified.
    name: GitHub Release (tag runs only)
    # Never without the attestations: a failed attest job leaves no Release.
    needs: [release-dry-run, attest, image-scan]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run-success
          path: ${{ runner.temp }}/archive

      - name: Check the archive (SHA256SUMS, BUILD-INFO.json) and choose the assets
        env:
          ARCHIVE: ${{ runner.temp }}/archive/release
          ASSETS: ${{ runner.temp }}/assets.txt
        # The text between the markers is run against fixtures by tools/release/test-release-upload.sh.
        run: |
          # BEGIN release-archive-check
          set -euo pipefail
          cd "$ARCHIVE"
          [[ -f SHA256SUMS ]] || { echo "ERROR: the archive has no SHA256SUMS; no Release is created."; exit 1; }
          if ! shasum -a 256 -c SHA256SUMS > "$RUNNER_TEMP/shasum.log" 2>&1; then
            grep -v ': OK$' "$RUNNER_TEMP/shasum.log" || true
            echo "ERROR: the archive does not match its SHA256SUMS (above); no Release is created."
            exit 1
          fi
          listed="$(sed -E 's/^[0-9a-f]{64}  //' SHA256SUMS | sort)"
          present="$(find . -type f ! -name SHA256SUMS | sort)"
          if [[ "$listed" != "$present" ]]; then
            diff <(printf '%s\n' "$listed") <(printf '%s\n' "$present") || true
            echo "ERROR: the archive holds files that SHA256SUMS does not list, or lacks listed ones (above)."
            exit 1
          fi
          echo "SHA256SUMS: $(wc -l < SHA256SUMS | tr -d ' ') file(s) match."
          python3 - <<'PY'
          import json, os, sys
          info = json.load(open("BUILD-INFO.json"))
          errors = []
          if info.get("trial") is not False:
              errors.append(f'BUILD-INFO.json says "trial": {json.dumps(info.get("trial"))}; a trial build is never released')
          if info.get("workingTree") != "clean":
              errors.append(f'BUILD-INFO.json says "workingTree": {json.dumps(info.get("workingTree"))}, not "clean"')
          if info.get("tag") != os.environ["TAG"]:
              errors.append(f'BUILD-INFO.json names tag {info.get("tag")!r}, this run is {os.environ["TAG"]!r}')
          if info.get("commit") != os.environ["COMMIT"]:
              errors.append(f'BUILD-INFO.json names commit {info.get("commit")!r}, this run is {os.environ["COMMIT"]!r}')
          for error in errors:
              print(f"ERROR: {error}")
          if errors:
              print("ERROR: no Release is created.")
              sys.exit(1)
          print(f'BUILD-INFO.json: tag {info["tag"]}, commit {info["commit"][:12]}, clean, not a trial.')
          PY
          find "$ARCHIVE/maven-repo" -type f \( -name '*.jar' -o -name '*.pom' \) ! -name 'maven-metadata*' | sort > "$ASSETS"
          printf '%s\n' "$ARCHIVE/bom-release.json" "$ARCHIVE/SHA256SUMS" "$ARCHIVE/BUILD-INFO.json" >> "$ASSETS"
          duplicates="$(sed 's#.*/##' "$ASSETS" | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "ERROR: two assets would share a file name on the Release: $duplicates"
            exit 1
          fi
          grep -q '\.jar$' "$ASSETS" || { echo "ERROR: no jar under maven-repo; no Release is created."; exit 1; }
          echo "Assets: $(wc -l < "$ASSETS" | tr -d ' ') file(s)."
          sed 's#.*/#  #' "$ASSETS"
          # END release-archive-check

      - name: Upload every asset to a draft Release
        env:
          ASSETS: ${{ runner.temp }}/assets.txt
          NOTES: ${{ runner.temp }}/notes.md
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cat > "$NOTES" <<EOF
          HORUS Agentic BPM ${version}: every module at ${version}, pinned by \`bpm-bom\` ${version}.

          The assets are the files the release build of commit ${COMMIT} staged and checked: the jars and
          POMs, the release bill of materials (\`bom-release.json\`), \`BUILD-INFO.json\` and \`SHA256SUMS\`.
          How the build works: [docs/RELEASING.md](https://github.com/${GH_REPO}/blob/${TAG}/docs/RELEASING.md).

          Check your downloads against \`SHA256SUMS\`, in the folder that holds them:

          \`\`\`
          while read -r hash path; do name="\${path##*/}"; if [ -f "\$name" ]; then printf '%s  %s\n' "\$hash" "\$name"; fi; done < SHA256SUMS | shasum -a 256 -c -
          \`\`\`

          Every downloaded file prints \`OK\`.
          EOF
          mapfile -t files < "$ASSETS"
          gh release create "$TAG" --verify-tag --draft --title "HORUS Agentic BPM ${version}" \
            --notes-file "$NOTES" "${files[@]}"
          echo "Draft Release ${TAG} created with ${#files[@]} asset(s)."

      - name: Verify the uploaded assets against SHA256SUMS, then publish
        env:
          ARCHIVE: ${{ runner.temp }}/archive/release
          ASSETS: ${{ runner.temp }}/assets.txt
          DOWNLOADED: ${{ runner.temp }}/downloaded
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir "$DOWNLOADED"
          cd "$DOWNLOADED"
          expected="$(sed 's#.*/##' "$ASSETS" | sort)"
          actual="$(ls -1 | sort)"
          [[ "$expected" == "$actual" ]] || { diff <(echo "$expected") <(echo "$actual") || true; \
            echo "ERROR: the draft's assets differ from the chosen files (above); the draft stays unpublished."; exit 1; }
          # Checked against the SHA256SUMS of the archive verified before the draft, never the draft's own copy.
          cmp -s "$ARCHIVE/SHA256SUMS" SHA256SUMS \
            || { echo "ERROR: the draft's SHA256SUMS differs from the checked archive's; the draft stays unpublished."; exit 1; }
          # The command the release notes give adopters, on the draft's downloads.
          while read -r hash path; do name="${path##*/}"; if [ -f "$name" ]; then printf '%s  %s\n' "$hash" "$name"; fi; done \
            < "$ARCHIVE/SHA256SUMS" | shasum -a 256 -c - | tee "$RUNNER_TEMP/verify.log"
          checked="$(grep -c ': OK$' "$RUNNER_TEMP/verify.log")"
          [[ "$checked" == "$(( $(wc -l < "$ASSETS") - 1 ))" ]] \
            || { echo "ERROR: $checked asset(s) checked, expected every asset but SHA256SUMS."; exit 1; }
          gh release edit "$TAG" --draft=false
          echo "Release ${TAG} published: $(gh release view "$TAG" --json url --jq .url)"
          {
            echo "### GitHub Release ${TAG}"
            echo
            echo "$checked asset(s) match SHA256SUMS; published."
          } >> "$GITHUB_STEP_SUMMARY"
