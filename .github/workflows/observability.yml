name: Observability pack
# The alert rules, their unit tests and the dashboards of deploy/observability (#659).
on:
  pull_request:
    paths: ["deploy/observability/**", "docs/OBSERVABILITY.md", "docker-compose.yml", ".github/workflows/observability.yml"]
  push:
    branches: [main]
    paths: ["deploy/observability/**", "docs/OBSERVABILITY.md", "docker-compose.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: promtool check and test, dashboards valid, meters documented
        run: deploy/observability/check.sh
