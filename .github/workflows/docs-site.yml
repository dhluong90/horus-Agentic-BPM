name: Docs site
# Builds the documentation site from wiki/ and runs the Getting Started guide. It builds only; it publishes nothing.
on:
  pull_request:
    paths: ["wiki/**", "site/**", "examples/rule-engine-only/**", "tools/extract-guide-commands.py", "cockpit/web/scripts/check-licences.mjs", "cockpit/web/scripts/axe-site.mjs", ".github/workflows/docs-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    name: Build the site from the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Licences of the site's packages (TR-LIC-01)
        # The cockpit's licence script, run over this project's whole tree: every package ends up in the built pages.
        working-directory: site
        run: node ../cockpit/web/scripts/check-licences.mjs --include-dev --exceptions=licence-exceptions.json
      - name: Tests of the generator
        working-directory: site
        run: npm test
      - name: Build (a broken wiki link, an unlisted page or a page that does not build fails)
        working-directory: site
        run: npm run build
      - name: No request to another origin, no analytics
        run: |
          set -euo pipefail
          cd site/.generated/.vitepress/dist
          if grep -rhoE '<(script|link|img|iframe)[^>]*(src|href)="https?://[^"]+' . ; then
            echo "::error::the built site loads something from another origin"; exit 1; fi
          if grep -rliE 'google-analytics|googletagmanager|plausible\.io|gtag\(' . ; then
            echo "::error::analytics found in the built site"; exit 1; fi
          test -f index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/.generated/.vitepress/dist
          retention-days: 7

  accessibility:
    # CKP-065 "Readable": the Mermaid diagram is drawn, code blocks have a copy button and axe-core reports no
    # serious violation at 1440x900 and 1440x1200, light and dark. Same Playwright image and axe package as the cockpit.
    name: Site accessibility (axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the site
        working-directory: site
        run: npm ci && npm run build
      - name: Install the cockpit's test tools
        working-directory: cockpit/web
        run: npm ci
      - name: axe on the built site
        working-directory: cockpit/web
        run: node scripts/axe-site.mjs

  guide:
    # CKP-045: the commands of wiki/Getting-Started.md run in order from a fresh checkout; the last one
    # finds exactly one logged decision. A guide change that breaks a step fails here.
    name: Getting Started guide runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Same Maven repository cache as the verify job in ci.yml (#171), so a run does not download
      # everything from Maven Central. Download retries for 429 and 5xx are set in .mvn/maven.config.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.m2/repository
          key: maven-${{ runner.os }}-guide-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-guide-
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-x64-maven-
      - name: Drop remembered download failures from the Maven cache
        run: find ~/.m2/repository -name '*.lastUpdated' -print -delete 2>/dev/null | sed 's/^/removed /' || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extract the commands
        run: python3 tools/extract-guide-commands.py > "$RUNNER_TEMP/guide.sh"
      - name: Run them
        run: bash "$RUNNER_TEMP/guide.sh"
      - name: Host log
        if: ${{ failure() }}
        run: tail -n 80 host.log || true
