# Settings of the spec-to-test gate (tools/spec-coverage.py, TR-QA-01).

[gate]
# The milestone being delivered now. An entry in any docs/spec-pending.txt whose milestone is at
# or before this value fails the gate, so no statement outlives its milestone. Raise it in the
# pull request that closes a milestone (roadmap: docs/product/roadmap.md).
current-milestone = M0

[test-roots]
# Each module's ids are matched against tests under the module folder only, plus the folders
# listed here (space-separated, relative to the repository root).
rule-engine = examples/rule-engine-only bpm-host-metadata
process-engine = examples/rule-and-process
