# One-command local deployment: PostgreSQL 16 and one example host. Guide: docs/DEPLOYING.md.
#
#   cp .env.example .env      # then set the two passwords
#   docker compose up --build --wait
#
# Every secret comes from .env, which git ignores; compose stops with a message when one is missing.
# PostgreSQL publishes no port: only the example host reaches it, on the compose network.

name: horus-bpm

services:
  postgres:
    # PostgreSQL 16.16 on Alpine; tag and digest are updated together.
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment:
      POSTGRES_DB: horus
      POSTGRES_USER: horus
      POSTGRES_PASSWORD: ${HORUS_DB_PASSWORD:?set HORUS_DB_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus -d horus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  host:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        EXAMPLE: ${HORUS_EXAMPLE:-rule-engine-only}
      # The patched JRE in the image is published for x64 only so far (deploy/docker/Dockerfile).
      platforms:
        - linux/amd64
    platform: linux/amd64
    image: horus-bpm/${HORUS_EXAMPLE:-rule-engine-only}:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HORUS_DB_URL: jdbc:postgresql://postgres:5432/horus
      HORUS_DB_USERNAME: horus
      HORUS_DB_PASSWORD: ${HORUS_DB_PASSWORD:?set HORUS_DB_PASSWORD in .env (see .env.example)}
      # "dev" turns on the demo users for a local walkthrough; leave it empty anywhere shared.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      HORUS_DEMO_PASSWORD: ${HORUS_DEMO_PASSWORD:-}
      # Bearer tokens: set the issuer and audience in docker-compose.override.yml (docs/DEPLOYING.md).
    ports:
      # Bound to this machine only. Change the left side in .env when 8080 is taken.
      - "127.0.0.1:${HORUS_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

volumes:
  pgdata:
