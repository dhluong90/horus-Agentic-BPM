# LOCAL EVALUATION ONLY, NOT A PRODUCTION DEPLOYMENT: demo users, plain HTTP, one instance, no backups.
# One-command local deployment: PostgreSQL 16 and one example host. Guide: docs/DEPLOYING.md.
#
#   cp .env.example .env      # settings, no secrets
#   deploy/create-secrets.sh  # the three passwords, as files in secrets/
#   docker compose up --build --wait
#
# Every password reaches the containers as a file mounted under /run/secrets, never as an environment
# variable, so docker inspect and /proc/<pid>/environ show none. git and the build context ignore secrets/;
# when a file is missing, compose stops before any container starts and names the file.
# PostgreSQL publishes no port: only the example host reaches it, on the compose network.
# The host connects as "horus", a role without superuser rights that owns the database horus and runs
# the migrations; the superuser "postgres" is used only by the init script (deploy/postgres/initdb).

name: horus-bpm

services:
  postgres:
    # PostgreSQL 16.16 on Alpine; tag and digest are updated together.
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: horus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
      # Read by deploy/postgres/initdb/10-application-role.sh on the first start only.
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horus -d horus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # The entrypoint switches to the postgres user and fixes ownership of the data directory; nothing more.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  host:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        EXAMPLE: ${HORUS_EXAMPLE:-rule-engine-only}
      # Built for the architecture of this machine: linux/amd64 or linux/arm64 (deploy/docker/Dockerfile).
    image: horus-bpm/${HORUS_EXAMPLE:-rule-engine-only}:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HORUS_DB_URL: jdbc:postgresql://postgres:5432/horus
      HORUS_DB_USERNAME: horus
      # Spring Boot reads each file under /run/secrets as a property named after the file, so
      # ${HORUS_DB_PASSWORD} and ${HORUS_DEMO_PASSWORD} resolve from the mounted secrets.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      # "dev" turns on the demo users for a local walkthrough; leave it empty anywhere shared.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Bearer tokens: set the issuer and audience in docker-compose.override.yml (docs/DEPLOYING.md).
      # Metrics (docs/OBSERVABILITY.md): empty keeps /actuator/health on the application port and no metrics endpoint.
      # deploy/observability/observability.env sets both, for the "observability" profile.
      MANAGEMENT_SERVER_PORT: ${HORUS_MANAGEMENT_PORT:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${HORUS_MANAGEMENT_EXPOSURE:-health}
    secrets:
      - source: db_password
        target: HORUS_DB_PASSWORD
      - source: demo_password
        target: HORUS_DEMO_PASSWORD
    ports:
      # Bound to this machine only. Change the left side in .env when 8080 is taken.
      - "127.0.0.1:${HORUS_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 512

  # Optional: docker compose --env-file .env --env-file deploy/observability/observability.env --profile observability up --wait
  # Prometheus (alert rules) and Grafana (three dashboards). Both publish to this machine only. docs/OBSERVABILITY.md.
  prometheus:
    profiles: ["observability"]
    # Prometheus v3.5.0 (LTS); tag and digest are updated together.
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    depends_on:
      host:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HORUS_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

  grafana:
    profiles: ["observability"]
    # Grafana 12.2.0; tag and digest are updated together.
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${HORUS_GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256

volumes:
  pgdata:
  promdata:
  grafanadata:

# Created by deploy/create-secrets.sh; see docs/DEPLOYING.md to bring your own values.
secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_password:
    file: ./secrets/db_password
  demo_password:
    file: ./secrets/demo_password
  # Read by Grafana only, in the observability profile. Compose reads it only when that profile is started.
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
