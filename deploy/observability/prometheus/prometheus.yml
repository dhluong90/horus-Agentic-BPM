# Prometheus for the optional "observability" profile of docker-compose.yml (docs/OBSERVABILITY.md).
# It scrapes the host's management port, which is not published outside the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: horus-bpm
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host:9464"]
