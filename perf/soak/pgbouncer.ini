; PgBouncer of the soak stack (#655): transaction pooling, as the pooler tests use (TR-ASY-04).
; 3 copies x a pool of 10 connections = 30 clients; 20 server connections shared between them.
[databases]
horus = host=postgres port=5432 dbname=horus

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer_userlist
admin_users = horus
stats_users = horus
pool_mode = transaction
default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
; A paused or restarted database must not hang a client for ever.
query_wait_timeout = 30
server_connect_timeout = 5
unix_socket_dir = /tmp
pidfile = /tmp/pgbouncer.pid
