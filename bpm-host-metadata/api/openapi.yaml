openapi: 3.1.0
info:
  title: HORUS Agentic BPM host contract
  version: 1.3.0
  summary: What a host's engines are, and who the caller is.
  description: |
    Every host that embeds an engine serves these endpoints once, whatever engines it runs
    (ADR-0014); `/api/bpm/display-names` was added in 1.3.0 (#442). Both need an authenticated caller and no other permission. The response bodies are
    owned by the JSON Schemas in `cockpit/api/schema/`; this document references them and adds the
    headers and errors. Changes are additive within schema version 1.
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
servers:
  - url: /
# Alternatives: a bearer token or the host's session cookie. The host's own security chain decides which it
# accepts; the engines add no authentication of their own.
security:
  - bearer: []
  - session: []
paths:
  /api/bpm/meta:
    get:
      operationId: getHostMeta
      summary: Engines, versions, features, tenancy and limits of this host
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: The host's engines.
          headers:
            Cache-Control: { $ref: '#/components/headers/MetaCacheControl' }
            ETag: { $ref: '#/components/headers/ETag' }
            Vary:
              description: '`Authorization, Cookie, X-Tenant-Id`, only when an engine publishes settings of the caller''s tenant (the Rule Engine does from 0.2.0).'
              schema: { type: string }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '../../cockpit/api/schema/bpm-meta.v1.schema.json'
              example:
                schemaVersion: 1
                hostId: loans
                modules:
                  - module: rules
                    engineVersion: 0.1.0
                    apiVersion: v1
                    features: []
                tenancy: { switching: false }
                limits: { maxPageSize: 200 }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/bpm/me:
    get:
      operationId: getCurrentCaller
      summary: The caller, the tenant the request resolved to, and the caller's engine permissions
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: The caller as this host sees it.
          headers:
            Cache-Control: { $ref: '#/components/headers/MeCacheControl' }
            ETag: { $ref: '#/components/headers/ETag' }
            Vary:
              description: '`Authorization, Cookie, X-Tenant-Id`: the body depends on the caller; `Accept-Language` too when `tenant.names` is present.'
              schema: { type: string }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                $ref: '../../cockpit/api/schema/bpm-me.v1.schema.json'
              example:
                schemaVersion: 1
                user: { id: lan, displayName: Lan Nguyen }
                tenant: { current: bank-a, allowed: [bank-a], names: { bank-a: Bank A } }
                permissions: ['rules:read', 'rules:author']
                roles: [ROLE_PRICING_ANALYST]
                groups: []
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/bpm/display-names:
    get:
      operationId: getDisplayNames
      summary: Readable names of roles, groups and users, in the caller's language
      description: |
        The names a screen shows instead of identifiers (#442, `RLE-196`, `PRE-206`): the role of a task in the
        queue, a group, or the user who requested an approval. Names come from the host's `DisplayNames` bean; the
        default reads `horus.bpm.display-names.roles|groups|users.<id>.<language>`. The language is the first of
        `Accept-Language`, then `horus.bpm.display-names.default-language` (`en`). Only known names are returned:
        a client shows the identifier for the rest. Each parameter may be repeated or comma-separated, at most 100
        identifiers per kind. Needs an authenticated caller and no other permission; the tenant is the caller's.
        Names are labels only and grant nothing.
      parameters:
        - { name: roles, in: query, required: false, schema: { type: string }, example: 'CARD_OFFICER,COMPLIANCE_REVIEWER' }
        - { name: groups, in: query, required: false, schema: { type: string }, example: hn-branch }
        - { name: users, in: query, required: false, schema: { type: string }, example: lan }
        - name: Accept-Language
          in: header
          required: false
          schema: { type: string }
          example: vi-VN,vi;q=0.9
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: The known names, by kind and identifier.
          headers:
            Cache-Control:
              description: '`private, no-cache`'
              schema: { type: string, const: 'private, no-cache' }
            Vary:
              description: '`Accept-Language, Authorization, Cookie, X-Tenant-Id`'
              schema: { type: string }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisplayNames' }
              example:
                language: vi
                roles: { CARD_OFFICER: Cán bộ thẻ, COMPLIANCE_REVIEWER: Compliance reviewer }
                groups: { hn-branch: Chi nhánh Hà Nội }
                users: { lan: Trần Thị Lan }
        '400':
          description: '`INPUT_INVALID`: more than 100 identifiers of one kind, or one that is not 1 to 128 letters, digits or `. _ : @ -`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    session:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: |
        The host's session cookie, after the host's own sign-in. The cookie name is host-defined;
        `JSESSIONID` is the servlet default. State-changing calls made with the session also send the
        host's CSRF token. The engines read the caller from the host's security context either way.
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: An `ETag` from an earlier response; a match answers `304`.
      schema: { type: string }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Your own id for the request. The host logs it as `clientCorrelationId` and always issues its own ULID, returned in the `X-Correlation-Id` response header and every problem body.
      schema: { type: string }
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Tenant switching is not available yet (`tenancy.switching: false`). A value other than the
        tenant the request resolved to is refused with `403 TENANT_NOT_ALLOWED`.
      schema: { type: string }
  headers:
    MetaCacheControl:
      description: |
        `private, max-age=60` when the body is the same for every caller of the host. `private, no-cache`
        when an engine publishes settings of the caller's tenant (the Rule Engine does from 0.2.0), as for
        `/me`: the browser revalidates with `If-None-Match` every time, so a sign-out on a shared machine is
        never served from cache.
      schema: { type: string, enum: ['private, max-age=60', 'private, no-cache'] }
    MeCacheControl:
      description: '`private, no-cache`: the body carries the caller''s permissions, so the browser revalidates with `If-None-Match` every time.'
      schema: { type: string, const: 'private, no-cache' }
    ETag:
      description: Weak validator of the body's content.
      schema: { type: string }
    CorrelationId:
      description: The ULID this host issued for the request, also in every problem body.
      schema: { type: string }
  responses:
    NotModified:
      description: The body has not changed since the `ETag` in `If-None-Match`.
    Unauthenticated:
      description: |
        `UNAUTHENTICATED`: no principal, or no tenant could be resolved from it (PD-079: the tenant
        comes from the principal, session or token, never from a header). Always carries
        `WWW-Authenticate`; for a missing tenant a bearer challenge adds `error="invalid_token"`, and a
        client must not repeat the sign-in more than once, because the same account gets the same token.
      headers:
        WWW-Authenticate:
          description: |
            The host's `horus.bpm.security.challenge`, `Bearer` by default, the same value whether the
            host's security chain or the endpoint itself refuses the call.
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#unauthenticated
            title: Authentication required
            status: 401
            code: UNAUTHENTICATED
            detail: Sign in, or send a token issued for this host.
            instance: /api/bpm/me
            correlationId: 01KAF3N8Q4V6W2Y9Z0A1B2C3D4
    Forbidden:
      description: |
        `TENANT_NOT_ALLOWED`: `X-Tenant-Id` names a tenant other than the principal's, or the tenant is
        outside the allowed format.
        `PERMISSION_DENIED`: the caller's id starts with `system:`, the prefix the engines reserve for the
        actions they record themselves. The match is exact and case-sensitive, so `systems-admin` is an
        ordinary caller. The body names neither the id nor the rule; the host writes a
        `caller.reserved.refused` security log entry with the same `correlationId`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            tenantNotAllowed:
              value:
                type: https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#tenant_not_allowed
                title: Tenant not allowed
                status: 403
                code: TENANT_NOT_ALLOWED
                detail: The request names a tenant the caller is not signed in for, and tenant switching is off.
                instance: /api/bpm/me
                correlationId: 01KAF3N8Q4V6W2Y9Z0A1B2C3D5
            reservedIdentity:
              value:
                type: https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#permission_denied
                title: Permission denied
                status: 403
                code: PERMISSION_DENIED
                detail: The caller lacks the permission this endpoint checks.
                instance: /api/bpm/me
                correlationId: 01KAF3N8Q4V6W2Y9Z0A1B2C3D6
  schemas:
    DisplayNames:
      type: object
      required: [language, roles, groups, users]
      additionalProperties: false
      properties:
        language: { type: string, description: 'The language the names were asked in, or `und` when none was sent' }
        roles: { type: object, additionalProperties: { type: string } }
        groups: { type: object, additionalProperties: { type: string } }
        users: { type: object, additionalProperties: { type: string } }
    Problem:
      description: RFC 9457 problem details with the engine contract's `code` and `correlationId` (ADR-0010).
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: '`https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#<code in lower case>`. Branch on `code`, never on `type`.'
        title: { type: string }
        status: { type: integer }
        code: { type: string, pattern: '^[A-Z][A-Z_]*$' }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
