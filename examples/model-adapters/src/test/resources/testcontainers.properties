# Testcontainers settings of this module's tests (PD-100: test-only images are pinned by digest).
# The reaper Testcontainers 2.0.5 starts by default, testcontainers/ryuk:0.14.0, pinned by digest; resolved
# 20 Nov 2026 from the registry and Docker Hub. Update it with the Testcontainers version.
ryuk.container.image=testcontainers/ryuk@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
# Refuses any container image without a digest at start-up.
image.substitutor=io.github.dhluong90.bpm.examples.models.DigestPinnedImages
