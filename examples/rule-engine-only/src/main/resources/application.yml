spring:
  application:
    name: rule-engine-only
  datasource:
    # Credentials come from the environment only; see README.md.
    url: ${HORUS_DB_URL:jdbc:postgresql://localhost:5432/horus}
    username: ${HORUS_DB_USERNAME:horus}
    password: ${HORUS_DB_PASSWORD:}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        # Safe to copy: the session cookie (and XSRF-TOKEN, HostSecurityConfiguration) only over https and
        # not on cross-site requests. Browsers accept a secure cookie from http://localhost.
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Component names only for authorised callers; hosts copy examples, so the safe default is shown.
      show-components: when-authorized

# The one configuration block a host adds for the Rule Engine, plus the cockpit's name for this service.
horus:
  bpm:
    # Shown by clients for this host; returned by GET /api/bpm/meta.
    host-id: rule-engine-only
    rules:
      decision-log:
        # How long decisions are kept: the bank's choice, in whole months, at least 12 (P12M). Monthly partitions
        # older than this are dropped and each drop is recorded in rle_decision_log_drop. Never on by default: left empty (or keep-forever),
        # every decision is kept, nothing is dropped and start-up warns.
        retention: ${HORUS_DECISION_LOG_RETENTION:}
      enabled: true
      security:
        # The host's roles mapped to engine permissions, listed by GET /api/bpm/me.
        role-permissions:
          ROLE_PRICING_AUTHOR: [rules:read, rules:author]
          ROLE_PRICING_APPROVER: [rules:read, rules:approve, rules:simulate]
          ROLE_TELLER: [rules:evaluate]
          # The only role that may look decisions up by a masked value such as a national id; no other role holds
          # rules:masked:search, and rules:log:read does not imply it.
          ROLE_PRIVACY_OPS: [rules:log:read, rules:masked:search]
    cockpit:
      # How the cockpit header names this service.
      host-label: Loan origination
      environment: demo
