spring:
  application:
    name: rule-engine-only
  datasource:
    # Credentials come from the environment only; see README.md.
    url: ${HORUS_DB_URL:jdbc:postgresql://localhost:5432/horus}
    username: ${HORUS_DB_USERNAME:horus}
    password: ${HORUS_DB_PASSWORD:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Component names only for authorised callers; hosts copy examples, so the safe default is shown.
      show-components: when-authorized

# The one configuration block a host adds for the Rule Engine.
horus:
  bpm:
    rules:
      enabled: true

# Demo users of the scripted demo (ExampleSecurity). No password in this file: without
# HORUS_DEMO_PASSWORD there are no demo users and every API call is refused.
example:
  demo-password: ${HORUS_DEMO_PASSWORD:}
