# Monthly card fee from 1 December 2026: the default fee drops from 50,000 VND to 30,000 VND (RLE-008).
# Keys are in author order on purpose: the canonical form sorts them, the source keeps them.
schemaVersion: 1
ruleSet: card-fee
description: Monthly card fee by tier and transaction count
effectiveFrom: "2026-12-01T00:00:00Z"   # scheduled: approved now, in force from this instant
hitPolicy: first            # the first matching row wins

inputs:
  - { name: tier,    type: string }
  - { name: txCount, type: integer, description: card transactions in the month }

outputs:
  - { name: fee, type: money }

rules:
  - id: R1                  # Gold customers pay nothing
    when: { tier: "== 'GOLD'" }
    then: { fee: "0 VND" }
  - id: R2                  # active cards get the reduced fee
    when: { txCount: ">= 3" }
    then: { fee: "10000 VND" }
  - id: R3                  # default row, last under first
    when: {}
    then: { fee: "30000 VND" }
