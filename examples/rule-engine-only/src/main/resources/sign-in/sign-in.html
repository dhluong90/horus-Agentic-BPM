<!doctype html>
<!--
  The example host's sign-in page. The host owns sign-in; copy this file and point host.sign-in.template at
  your copy to change it. Placeholders in double braces are text (escaped); in triple braces, markup built by SignInPage.
  No inline script or style: the page runs under script-src 'self' and style-src 'self'.
-->
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{title}}</title>
  <link rel="stylesheet" href="{{assets}}/sign-in.css">
  <script src="{{assets}}/sign-in.js" defer></script>
</head>
<body>
  <a class="skip" href="#sign-in-form">{{skip}}</a>
  <div class="page">
    <aside class="brand-panel" aria-label="{{brandLabel}}">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true" focusable="false"><rect class="brand-mark__tile" x="1" y="1" width="26" height="26" rx="7"/><path class="brand-mark__glyph" d="M8 7v14M20 7v14M8 14h12"/><circle class="brand-mark__dot" cx="14" cy="14" r="2.4"/></svg>
        <span class="brand__service">{{service}}</span>
        {{{environmentTag}}}
      </div>
      <div class="brand-panel__body">
        <p class="brand-panel__headline">{{brandHeadline}}</p>
        <p class="brand-panel__text">{{brandBody}}</p>
        <ul class="brand-panel__points">
          <li><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 8h15M8 8v8.5"/></svg>{{point1}}</li>
          <li><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 2.5l6 2.5v5c0 3.8-2.6 6.3-6 7.5-3.4-1.2-6-3.7-6-7.5V5z"/><path d="M7.2 10l2 2 3.8-4"/></svg>{{point2}}</li>
          <li><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4.5l3 2"/></svg>{{point3}}</li>
        </ul>
      </div>
      <p class="brand-panel__foot">{{poweredBy}}</p>
    </aside>
    <main class="form-column">
      <div class="prefs">
        <nav class="seg" aria-label="{{language}}">{{{languageLinks}}}</nav>
        <button type="button" class="iconbtn" id="theme-toggle" hidden data-to-dark="{{toDark}}" data-to-light="{{toLight}}" aria-label="{{toDark}}" title="{{toDark}}">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path class="moon" d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7z"/><g class="sun"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></g></svg>
        </button>
      </div>
      <section class="sign-in" aria-labelledby="sign-in-title">
        <h1 id="sign-in-title">{{heading}}</h1>
        <p class="sub">{{subtitle}}</p>
        {{{alert}}}
        <form method="post" action="{{action}}" class="form" id="sign-in-form" novalidate>
          <input name="{{csrfParameter}}" type="hidden" value="{{csrfToken}}">
          <div class="field">
            <label for="username">{{username}}</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus{{{usernameInvalid}}} data-required="{{usernameRequired}}">
            <p class="field__error" id="username-error" hidden></p>
          </div>
          <div class="field">
            <label for="password">{{password}}</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required{{{passwordInvalid}}} data-required="{{passwordRequired}}">
            <p class="field__error" id="password-error" hidden></p>
          </div>
          <button type="submit" class="btn">{{submit}}</button>
        </form>
        {{{demo}}}
      </section>
    </main>
  </div>
</body>
</html>
