# These integration tests connect as the one role that owns the tables, which is the development setup. Outside the dev
# profile the role check refuses that role by default (HORUS-DB-ROLE-001), so the tests opt out. TwoRoleDatabaseIT in
# examples/rule-and-process proves the default and the two-role setup.
horus.bpm.rules.database.role-check=off
horus.bpm.processes.database.role-check=off
