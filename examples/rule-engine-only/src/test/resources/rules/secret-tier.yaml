# A rule set that exists only in tenant-b (RLE-011).
schemaVersion: 1
ruleSet: secret-tier
hitPolicy: first
inputs:
  - { name: score, type: integer }
outputs:
  - { name: tier, type: string }
rules:
  - id: S1
    when: { score: ">= 800" }
    then: { tier: "'PLATINUM'" }
  - id: S2
    when: {}
    then: { tier: "'STANDARD'" }
