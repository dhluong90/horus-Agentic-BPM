# Local development only. The demo users sign in with the host's form or HTTP Basic and carry no tenant
# attribute, so the engines serve them for this fixed tenant. Refused outside the dev profile.
horus:
  demo:
    # Short timers so a presenter sees one fire live (DemoTimerOverrides). The key is the id of the event that holds the
    # timer; the models keep their real durations (P2D, PT2H, PT24H) outside the dev profile. Set a key to a longer
    # duration, or delete it, to keep the model's own.
    timers:
      assess-overdue: PT1M   # card-dispute, the officer's reminder
      two-hours: PT1M        # payment-review, the wait for the payment
      cooling-off: PT1M      # sub-process-and-timer, the cooling-off wait
      manager-sla: PT20S     # loan-origination, the 4-hour escalation of the manager approval
      committee-sla: PT40S   # loan-origination, the 1-day escalation of the committee approval
      offer-expired: PT60S   # loan-origination, the 7-day validity of the offer
  bpm:
    tenancy:
      dev-tenant: bank-a
      # lan may select bank-a or bank-b in the cockpit's tenant switch; every accepted switch is audited.
      switching:
        enabled: true
    rules:
      # The demo edits drafts in the cockpit. A host that changes definitions through its release pipeline leaves this off.
      authoring:
        cockpit-drafts: true
      security:
        role-permissions:
          # Dev only: the author and the approver may also evaluate, so the cockpit's Try it works for them, and both simulate, so
          # either can replay selected decisions; the approver reads the decision log those replays draw from.
          ROLE_PRICING_AUTHOR: [rules:read, rules:author, rules:evaluate, rules:simulate]
          ROLE_PRICING_APPROVER: [rules:read, rules:approve, rules:evaluate, rules:simulate, rules:log:read]
          ROLE_AUDITOR: [rules:read, rules:log:read]
          ROLE_TELLER: [rules:evaluate]
          ROLE_CARD_OFFICER: [rules:evaluate]
          ROLE_COMPLIANCE_REVIEWER: [rules:evaluate]
          ROLE_CREDIT_ANALYST: [rules:evaluate]
          ROLE_CREDIT_MANAGER: [rules:evaluate]
          ROLE_CREDIT_COMMITTEE: [rules:evaluate]
    processes:
      authoring:
        cockpit-drafts: true
      security:
        role-permissions:
          # Dev only: the roles the demo and conformance models assign user tasks to, each held by a demo user
          # (HostSecurityConfiguration), so every task in the models can be worked.
          ROLE_KYC_OFFICER: [processes:read, processes:task:work]
          ROLE_AML_OFFICER: [processes:read, processes:task:work]
          ROLE_SANCTIONS_OFFICER: [processes:read, processes:task:work]
          ROLE_PAYMENT_OFFICER: [processes:read, processes:task:work]
          ROLE_PRICING_OFFICER: [processes:read, processes:task:work]
          ROLE_DISPUTES_OFFICER: [processes:read, processes:task:work]
          ROLE_DISPUTES_SENIOR: [processes:read, processes:task:work]
          ROLE_OPS: [processes:read, processes:task:work]
          # loan-origination (imported by DevLoanOriginationSeeder, not listed under locations below). The rule steps
          # run as the caller, so each of these roles may also evaluate rules.
          ROLE_COMPLIANCE_REVIEWER: [processes:read, processes:task:work]
          ROLE_CREDIT_ANALYST: [processes:read, processes:task:work]
          ROLE_CREDIT_MANAGER: [processes:read, processes:task:work]
          ROLE_CREDIT_COMMITTEE: [processes:read, processes:task:work]
      definitions:
        # Seed the sample process for the demo tenant and activate it without approval (dev profile only).
        startup-tenants: [bank-a]
        # Every demo and conformance model, so each scene of the live demo runs on the default start. card-welcome
        # comes before customer-onboarding, which calls it.
        locations:
          - classpath:processes/card-fee-review.bpmn
          - classpath:processes/card-welcome.bpmn
          - classpath:processes/card-delivery.bpmn
          - classpath:processes/card-dispute.bpmn
          - classpath:processes/loan-payout.bpmn
          - classpath:processes/card-limit-check.bpmn
          - classpath:processes/fee-routing-feel.bpmn
          - classpath:processes/order-payment.bpmn
          - classpath:processes/order-payment-pools.bpmn
          - classpath:processes/payment-review.bpmn
          - classpath:processes/payment-screening.bpmn
          - classpath:processes/rate-card-watch.bpmn
          - classpath:processes/fund-transfer.bpmn
          - classpath:processes/payment-approval.bpmn
          - classpath:processes/credit-review-form.bpmn
          - classpath:processes/customer-onboarding.bpmn
          - classpath:processes/conformance/compensation-background.bpmn
          - classpath:processes/conformance/compensation-event-subprocess.bpmn
          - classpath:processes/conformance/compensation-manual-undo.bpmn
          - classpath:processes/conformance/data-objects.bpmn
          - classpath:processes/conformance/data-store.bpmn
          - classpath:processes/conformance/event-gateway-parallel-start.bpmn
          - classpath:processes/conformance/event-gateway-start.bpmn
          - classpath:processes/conformance/gateways.bpmn
          - classpath:processes/conformance/multiple-throw-and-end.bpmn
          - classpath:processes/conformance/non-interrupting-start.bpmn
          - classpath:processes/conformance/parallel-join.bpmn
          - classpath:processes/conformance/parallel-multiple-start.bpmn
          - classpath:processes/conformance/receive-task-start.bpmn
          - classpath:processes/conformance/service-task-handler-urn.bpmn
          - classpath:processes/conformance/sub-process-and-timer.bpmn
        auto-approve: true
