# Sentences of the decision explanation (rule-engine/docs/DESIGN.md section 4.7, PD-027), English.
# UTF-8. Placeholders are {names}; values arrive already written without grouping, money in major units with its code.
# Joiners keep their spaces as \u0020. A host overrides any entry, or adds a language, with horus-bpm/rules/explain_<language>.properties on its class path.
# A changed sentence ships only in a minor release and is listed in the release notes.
row.because=Rule {ruleId} of {ruleSet} version {version} matched because {conditions}.
row.always=Rule {ruleId} of {ruleSet} version {version} matched; it has no conditions.
result=Result: {outputs}.
no-match=No rule of {ruleSet} version {version} matched. No output was produced.
unique.two=Rules {ruleIds} of {ruleSet} version {version} both matched; this table allows one. No output was produced.
unique.many=Rules {ruleIds} of {ruleSet} version {version} all matched; this table allows one. No output was produced.
error=The decision of {ruleSet} version {version} failed with {errorCode}. No output was produced.
error.rows=The decision of {ruleSet} version {version} failed with {errorCode} after {ruleIds} matched. No output was produced.
condition={value}, {test}
value={input} is {value}
value.masked={input} is masked
value.missing={input} has no value
test.ge=which is at least {operand}
test.gt=which is more than {operand}
test.le=which is at most {operand}
test.lt=which is less than {operand}
test.eq=which equals {operand}
test.ne=which is not {operand}
test.in=which is one of {operand}
test.not-in=which is none of {operand}
test.between=which is between {low} and {high}
test.is-null=which is no value
test.is-not-null=which has a value
test.other=which satisfies {test}
test.unknown=tested with {test}
any=at least one of these held: {alternatives}
join.conditions=,\u0020and\u0020
join.alternatives=\u0020or\u0020
join.and=\u0020and\u0020
join.list=,\u0020
join.outputs=;\u0020
output={name} {value}
null=no value
