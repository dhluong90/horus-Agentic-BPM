# Expected token and example of a syntax error (#419): chosen by the kind of error, never text of the cell.
syntax.OPERAND.expected=A value: a number, a text in single quotes, an input name or a function, here instead of what was written.
syntax.OPERAND.example=balance >= 1000000
syntax.OPERATOR_OR_END.expected=An operator such as ==, >, and, or, or the end of the cell, after the complete expression.
syntax.OPERATOR_OR_END.example=tier == 'GOLD' and txCount >= 3
syntax.OPEN_PAREN.expected=An opening parenthesis ( after the function name.
syntax.OPEN_PAREN.example=date('2026-12-31')
syntax.CLOSE_PAREN.expected=A closing parenthesis ) to match the opening one.
syntax.CLOSE_PAREN.example=(balance + 100) > 0
syntax.OPEN_BRACKET.expected=An opening bracket [ that starts the list after in.
syntax.OPEN_BRACKET.example=tier in ['GOLD', 'SILVER']
syntax.CLOSE_BRACKET.expected=A closing bracket ] that ends the list.
syntax.CLOSE_BRACKET.example=tier in ['GOLD', 'SILVER']
syntax.KEYWORD_NULL.expected=The word null after is or is not.
syntax.KEYWORD_NULL.example=branch is not null
syntax.KEYWORD_AND.expected=The word and between the two limits of between.
syntax.KEYWORD_AND.example=txCount between 3 and 10
syntax.UNTERMINATED_STRING.expected=A closing single quote to end the text.
syntax.UNTERMINATED_STRING.example=tier == 'GOLD'
syntax.SINGLE_QUOTES.expected=Single quotes around a text, not double quotes.
syntax.SINGLE_QUOTES.example=tier == 'GOLD'
syntax.EQUALITY.expected=Two equals signs == to compare for equality.
syntax.EQUALITY.example=tier == 'GOLD'
syntax.LOGIC_WORDS.expected=The words and, or and not instead of symbols.
syntax.LOGIC_WORDS.example=tier == 'GOLD' and txCount >= 3
syntax.NUMBER_START.expected=A digit at the start of a number.
syntax.NUMBER_START.example=0.5
syntax.NUMBER_DIGITS.expected=Only the digits 0 to 9 in a number.
syntax.NUMBER_DIGITS.example=1000000
syntax.STRING_ESCAPE.expected=One of the escapes \\', \\\\ or \\uXXXX with four hexadecimal digits.
syntax.STRING_ESCAPE.example='O\\'Brien'
syntax.LITERAL_ARGUMENT.expected=A text in single quotes as the argument, not an expression.
syntax.LITERAL_ARGUMENT.example=matches(name, '^[A-Z]+$')
syntax.CHARACTER.expected=A character the expression language uses: letters, digits, operators, quotes and parentheses.
syntax.CHARACTER.example=amount > 100
