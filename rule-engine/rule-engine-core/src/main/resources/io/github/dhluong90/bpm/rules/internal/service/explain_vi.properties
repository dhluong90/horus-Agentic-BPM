# Kiểm tra bản nháp (RLE-090): câu được chọn theo mã, không lặp lại nội dung của ô.
problem.SYNTAX_ERROR=Ô này không phải là biểu thức hợp lệ.
problem.UNKNOWN_INPUT=Ô này dùng một tên không phải là đầu vào đã khai báo.
problem.FORBIDDEN_CONSTRUCT=Ô này dùng thứ mà ngôn ngữ biểu thức không cho phép.
problem.TYPE_MISMATCH=Ô này trộn các giá trị khác kiểu, hoặc không phải là điều kiện đúng hoặc sai.
problem.INVALID_LITERAL=Ô này có ngày, giờ, số tiền hoặc số được viết sai.
problem.INVALID_PATTERN=Ô này có mẫu văn bản quá dài hoặc không được hỗ trợ.
problem.EXPRESSION_TOO_LONG=Ô này dài hơn giới hạn của biểu thức.
problem.EXPRESSION_TOO_DEEP=Ô này lồng nhau quá sâu.
problem.UNKNOWN_OUTPUT=Quy tắc này gán giá trị cho một đầu ra chưa được khai báo.
problem.MASKED_INPUT_IN_OUTPUT=Một đầu ra sao chép đầu vào đã che, điều này không được phép.
problem.EVALUATION_BUDGET_EXCEEDED=Từ quy tắc này trở đi, một quyết định có thể cần nhiều bước hơn ngân sách cho phép. Hãy tách bảng hoặc đơn giản hóa các ô.
problem.RULE_INVALID=Quy tắc này chưa được chấp nhận.
problem.COLUMN_INVALID=Cột này chưa được chấp nhận.
problem.DOCUMENT_INVALID=Tài liệu này chưa được chấp nhận.
problem.CSV_NO_TABLE_FORM=Bảng này không thể thành bảng tính.
problem.CSV_EMPTY=Tệp không có dòng nào.
problem.CSV_ENCODING=Tệp không phải UTF-8. Hãy lưu thành CSV UTF-8.
problem.CSV_FILE_INVALID=Tệp không phải là tệp CSV hợp lệ.
problem.CSV_COLUMN_UNKNOWN=Cột này không có trong phiên bản mà tệp dựa vào. Không thể đổi đầu vào và đầu ra qua tệp.
problem.CSV_COLUMN_MISSING=Thiếu cột này của phiên bản mà tệp dựa vào. Không thể đổi đầu vào và đầu ra qua tệp.
problem.CSV_COLUMN_DUPLICATE=Cột này xuất hiện hai lần.
problem.CSV_COLUMN_ORDER=Cột này sai thứ tự. Hãy giữ thứ tự của phiên bản mà tệp dựa vào.
problem.CSV_RULE_ID_INVALID=Mã quy tắc không hợp lệ.
problem.CSV_RULE_DUPLICATE=Mã quy tắc đã được dùng ở một dòng trước.
problem.CSV_ROW_SHAPE=Dòng có số ô khác với dòng tiêu đề.
problem.CSV_CELL_INVALID=Ô này được viết chưa đúng.
problem.CSV_CELL_EMPTY=Ô đầu ra đang trống. Hãy ghi null nếu không có giá trị.
problem.CSV_CELL_SCIENTIFIC=Ô này bị đổi thành ký hiệu khoa học, như 5E+07. Hãy ghi đủ cả số.
problem.CSV_CELL_SEPARATORS=Số tiền có dấu phân cách hàng nghìn. Hãy ghi không có dấu, ví dụ 50000000 VND.
problem.CSV_CELL_DATE=Ngày không theo chuẩn ISO. Hãy ghi năm-tháng-ngày, ví dụ 2026-11-20.
problem.CSV_CELL_NOT_A_NUMBER=Ô này có chữ trong cột số.
problem.CSV_CELL_NO_CURRENCY=Số tiền thiếu đơn vị tiền tệ hợp lệ. Hãy ghi sau con số, ví dụ 50000000 VND.
