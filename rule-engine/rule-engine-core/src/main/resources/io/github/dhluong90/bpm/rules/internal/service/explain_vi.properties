# Kiểm tra bản nháp (RLE-090): câu được chọn theo mã, không lặp lại nội dung của ô.
problem.SYNTAX_ERROR=Ô này không phải là biểu thức hợp lệ.
problem.UNKNOWN_INPUT=Ô này dùng một tên không phải là đầu vào đã khai báo.
problem.FORBIDDEN_CONSTRUCT=Ô này dùng thứ mà ngôn ngữ biểu thức không cho phép.
problem.TYPE_MISMATCH=Ô này trộn các giá trị khác kiểu, hoặc không phải là điều kiện đúng hoặc sai.
problem.INVALID_LITERAL=Ô này có ngày, giờ, số tiền hoặc số được viết sai.
problem.INVALID_PATTERN=Ô này có mẫu văn bản quá dài hoặc không được hỗ trợ.
problem.EXPRESSION_TOO_LONG=Ô này dài hơn giới hạn của biểu thức.
problem.EXPRESSION_TOO_DEEP=Ô này lồng nhau quá sâu.
problem.UNKNOWN_OUTPUT=Quy tắc này gán giá trị cho một đầu ra chưa được khai báo.
problem.MASKED_INPUT_IN_OUTPUT=Một đầu ra sao chép đầu vào đã che, điều này không được phép.
problem.EVALUATION_BUDGET_EXCEEDED=Từ quy tắc này trở đi, một quyết định có thể cần nhiều bước hơn ngân sách cho phép. Hãy tách bảng hoặc đơn giản hóa các ô.
problem.RULE_INVALID=Quy tắc này chưa được chấp nhận.
problem.COLUMN_INVALID=Cột này chưa được chấp nhận.
problem.DOCUMENT_INVALID=Tài liệu này chưa được chấp nhận.
reading.rule=Quy tắc {ruleId} áp dụng khi {conditions}.
reading.always=Quy tắc {ruleId} luôn áp dụng; quy tắc này không có điều kiện.

