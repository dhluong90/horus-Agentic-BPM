# Expected token and example of a syntax error (#419): chosen by the kind of error, never text of the cell.
syntax.OPERAND.expected=Một giá trị: số, văn bản trong dấu nháy đơn, tên đầu vào hoặc hàm, thay cho phần đã viết.
syntax.OPERAND.example=balance >= 1000000
syntax.OPERATOR_OR_END.expected=Một toán tử như ==, >, and, or hoặc kết thúc ô, sau biểu thức đã đầy đủ.
syntax.OPERATOR_OR_END.example=tier == 'GOLD' and txCount >= 3
syntax.OPEN_PAREN.expected=Dấu mở ngoặc ( sau tên hàm.
syntax.OPEN_PAREN.example=date('2026-12-31')
syntax.CLOSE_PAREN.expected=Dấu đóng ngoặc ) khớp với dấu mở ngoặc.
syntax.CLOSE_PAREN.example=(balance + 100) > 0
syntax.OPEN_BRACKET.expected=Dấu mở ngoặc vuông [ bắt đầu danh sách sau in.
syntax.OPEN_BRACKET.example=tier in ['GOLD', 'SILVER']
syntax.CLOSE_BRACKET.expected=Dấu đóng ngoặc vuông ] kết thúc danh sách.
syntax.CLOSE_BRACKET.example=tier in ['GOLD', 'SILVER']
syntax.KEYWORD_NULL.expected=Từ null sau is hoặc is not.
syntax.KEYWORD_NULL.example=branch is not null
syntax.KEYWORD_AND.expected=Từ and giữa hai giới hạn của between.
syntax.KEYWORD_AND.example=txCount between 3 and 10
syntax.UNTERMINATED_STRING.expected=Dấu nháy đơn đóng để kết thúc văn bản.
syntax.UNTERMINATED_STRING.example=tier == 'GOLD'
syntax.SINGLE_QUOTES.expected=Văn bản đặt trong dấu nháy đơn, không dùng nháy kép.
syntax.SINGLE_QUOTES.example=tier == 'GOLD'
syntax.EQUALITY.expected=Hai dấu bằng == để so sánh bằng.
syntax.EQUALITY.example=tier == 'GOLD'
syntax.LOGIC_WORDS.expected=Các từ and, or và not thay cho ký hiệu.
syntax.LOGIC_WORDS.example=tier == 'GOLD' and txCount >= 3
syntax.NUMBER_START.expected=Một chữ số ở đầu số.
syntax.NUMBER_START.example=0.5
syntax.NUMBER_DIGITS.expected=Chỉ dùng các chữ số 0 đến 9 trong một số.
syntax.NUMBER_DIGITS.example=1000000
syntax.STRING_ESCAPE.expected=Một trong các ký tự thoát \\', \\\\ hoặc \\uXXXX với bốn chữ số thập lục phân.
syntax.STRING_ESCAPE.example='O\\'Brien'
syntax.LITERAL_ARGUMENT.expected=Một văn bản trong dấu nháy đơn làm đối số, không phải biểu thức.
syntax.LITERAL_ARGUMENT.example=matches(name, '^[A-Z]+$')
syntax.CHARACTER.expected=Một ký tự mà ngôn ngữ biểu thức dùng: chữ cái, chữ số, toán tử, dấu nháy và dấu ngoặc.
syntax.CHARACTER.example=amount > 100
