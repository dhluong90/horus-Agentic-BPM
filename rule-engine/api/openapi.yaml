  /rule-sets/{name}/evidence:
    post:
      tags: [rule-sets]
      operationId: exportEvidence
      summary: Export versions and decisions of a rule set as an evidence file
      description: |
        Permission `rules:read`; a request that names decisions also needs `rules:log:read`, checked before
        anything is read (`403 PERMISSION_DENIED` naming it). The engine writes the file, so it is reproducible and
        its handover is recorded (PD-116).

        - `versions`: version numbers of this rule set, at most 100, no repeats. Each contributes every event of its
          history, oldest first. An unknown version is `404 VERSION_NOT_FOUND`.
        - `decisionIds`: logged decisions of this rule set, at most 100, no repeats, kept in the order sent. A
          decision of another rule set is `400 INPUT_INVALID` naming it; one the caller's tenant does not have is
          `404 DECISION_NOT_FOUND` naming it. Masked inputs stay `hmac:<keyId>:<hex>`.
        - At least one version or one decision.

        The file starts with who exported it, when, for which tenant, and `contentSha256`: the SHA-256 of the
        content, which is everything after those header lines in CSV (UTF-8, CRLF line ends, from the column line
        on), and in JSON the `content` member, the file's last, exactly as written. The same versions and decisions always give the
        same `contentSha256`, so an auditor can check a file by hashing its content. CSV is one file with a
        `record` column, `version event` or `decision`; a cell that starts with `=`, `+`, `-`, `@`, a tab or a
        carriage return is prefixed with `'` so a spreadsheet never runs it as a formula. The response also carries
        `X-Evidence-Sha256` (the same hex digest) and `Content-Digest` (RFC 9530, SHA-256 of the whole body), so the
        saved file can be checked against the bytes sent. A file over 8,388,608 bytes is
        `422 EVIDENCE_TOO_LARGE`; choose fewer decisions.

        In the same transaction the export appends an `EVIDENCE_EXPORTED` entry to the rule set's history (actor,
        format, versions, decision ids, `contentSha256`, size) and writes `rules.evidence.exported.v1` to the outbox.
        With an `Idempotency-Key` a repeat returns the same bytes and writes nothing.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        description: At most 16,384 bytes
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
            example:
              format: csv
              versions: [1, 2]
              decisionIds: [01KF2Q8Z0RQ6V2Y8M1C4N5P7T9, 01KF2Q8Z0RQ6V2Y8M1C4N5P7TA, 01KF2Q8Z0RQ6V2Y8M1C4N5P7TB]
      responses:
        '200':
          description: The evidence file, with `Content-Disposition` `attachment; filename="<name>-evidence-<exported at, yyyyMMddTHHmmssZ>.<csv|json>"`
          headers:
            Content-Digest:
              description: RFC 9530 digest of the body, `sha-256=:<base64>:`
              schema:
                type: string
            X-Evidence-Sha256:
              description: The file's `contentSha256`, 64 lower-case hex digits
              schema:
                type: string
                pattern: '^[0-9a-f]{64}$'
          content:
            text/csv:
              schema:
                type: string
              example: |
                # HORUS Rule Engine evidence export
                # Rule set: card-fee
                # Tenant: bank-a
                # Exported by: ha
                # Exported at: 2027-01-20T03:00:00Z
                # Content SHA-256: 9f4a6c1e0b7d2c4a6e8f0a1b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d
                record,version,occurred_at,action,from_status,to_status,actor,reason,version_canonical_hash,decision_id,outcome,error_code,matched_rule_ids,inputs,outputs,correlation_id,eval_clock
                version event,1,2026-11-01T01:00:00Z,CREATED,,DRAFT,lan,,4be1...,,,,,,,,
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceFile'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:request-publish:
    post:
      tags: [rule-sets]
      operationId: requestPublish
      summary: Move a draft to PENDING_APPROVAL and record the caller as requester
      description: |
        Permission `rules:author`. The response lists the personal-data `warnings` of the draft, which
        the approver also sees on every read of the version (`RLE-049`). With
        `decision-log.require-explicit-mask` on for the tenant, a draft with an input that declares no
        `mask` (one imported before strict mode was turned on) is `422 VALIDATION_FAILED` naming the
        input, and stays a draft (`RLE-050`). The draft is read, parsed and type-checked again exactly
        as import does today, so a draft stored before a check existed cannot reach an approver: a
        problem is `422 VALIDATION_FAILED` with every violation located by rule, column, `code` and
        `position`, and the version stays a draft (`RLE-004`). The check uses the host's configured
        limits, the ones evaluation applies, and refuses a table whose worst-case step count is over
        the step budget (`EVALUATION_BUDGET_EXCEEDED`).
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:approve:
    post:
      tags: [rule-sets]
      operationId: approve
      summary: Approve a pending version as a second person; it becomes PUBLISHED
      description: |
        Permission `rules:approve`. The requester of the publication cannot approve it:
        `403 SELF_APPROVAL_FORBIDDEN`, and the version stays `PENDING_APPROVAL`. Without an
        `effectiveFrom` in the document the version takes effect at approval. A body over
        16,384 bytes is `413 PAYLOAD_TOO_LARGE`. With `decision-log.require-explicit-mask` on for
        the tenant, a version with an input that declares no `mask` (requested before strict mode was
        turned on) is `422 VALIDATION_FAILED` naming the input, and stays `PENDING_APPROVAL`
        (`RLE-050`).

        A version with no recorded author (written before the author was recorded, schema V2) cannot
        be approved by anyone: `409 AUTHOR_UNKNOWN`, and it stays `PENDING_APPROVAL` with nothing
        written (PD-105, `RLE-054`). No author is ever assigned. It can still be rejected or withdrawn;
        importing the change again records its author, and that version can be approved. Its
        `allowedActions` never contain `approve`.

        Acknowledged warnings (PD-104, `RLE-053`, DESIGN 3.3.5). Checks run in this order: permission,
        `If-Match` present, status, four eyes (then a recorded author), lock version, strict mode,
        acknowledgement. The engine
        recomputes the `{ code, input }` pairs that need an acknowledgement: the version's warnings whose
        code is in `lifecycle.acknowledge-warnings` (default `[UNMASKED_PERSONAL_DATA]`), under the
        tenant's personal-data names and masking default in force, leaving out inputs that the tenant's
        `decision-log.mask-default` masks. These are exactly the warnings the version response marks
        `requiresAcknowledgement: true`. The approval is accepted only when `acknowledgedWarnings`
        equals that set, compared as sets (order and duplicates ignored). A missing or an extra pair is
        `409 WARNINGS_NOT_ACKNOWLEDGED`, whose `warnings` carry the full current set
        (`{ code, input, matchedName }`, empty when nothing is needed now) and whose `setting` carries
        the required codes; nothing is written. An unknown code, an input name that is empty or longer
        than 100 characters, or more than 100 pairs is `400 INPUT_INVALID`. Exactly the set is recorded:
        the `APPROVED` history entry and `rules.version.published.v1` carry `acknowledgedWarnings` and
        `maskedByDefaultInputs`, each empty when nothing applies. The sorted pairs are part of the
        idempotency request hash. A client shows the current set and lets the approver accept it; it
        never retries on its own.

        `If-Match` is required and must be the `lockVersion` of the version the approver reviewed:
        without it the answer is `428 PRECONDITION_REQUIRED`, and a stale value is
        `409 VERSION_CONFLICT`, with nothing published. A version can be sent back, replaced in place
        and requested again under the same number, so the lock version is what ties an approval to
        the content reviewed (#275). A client that receives `409 VERSION_CONFLICT` here must show the
        approver the current version (its content and diff) again and let them decide; it must never
        retry automatically with the new `ETag`, because that would approve content nobody reviewed.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 2000
                  description: Optional; stored in the history. Longer than `lifecycle.reason-max-length` (default 2,000 characters) is `400 INPUT_INVALID`
                acknowledgedWarnings:
                  type: array
                  maxItems: 100
                  description: The exact pairs the approver was shown and accepts (`RLE-053`); must equal the set the engine recomputes
                  items:
                    $ref: '#/components/schemas/AcknowledgedWarning'
            example:
              comment: Fees checked against the tariff
              acknowledgedWarnings:
                - { code: UNMASKED_PERSONAL_DATA, input: nationalId }
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:reject:
    post:
      tags: [rule-sets]
      operationId: reject
      summary: Send a pending version back to DRAFT with a reason
      description: |
        Permission `rules:approve`. Only a `PENDING_APPROVAL` version can be rejected; any other
        status is `409 INVALID_STATE`. The version returns to `DRAFT` with `requestedBy` and
        `requestedAt` cleared, one history entry `REJECTED` and one `rules.version.rejected.v1`
        event. The requester of the publication cannot reject it: `403 SELF_APPROVAL_FORBIDDEN`,
        with a detail pointing to `:withdraw`, and the version stays `PENDING_APPROVAL` (PD-089,
        DESIGN section 3.3, `RLE-025`).
        A blank reason, or one longer than `lifecycle.reason-max-length` (default 2,000
        characters), is `400 INPUT_INVALID`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.
        `If-Match` is required, as for `:approve`: `428 PRECONDITION_REQUIRED` without it,
        `409 VERSION_CONFLICT` when stale. On `409 VERSION_CONFLICT` a client shows the current
        version again and never retries automatically with the new `ETag`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
            example:
              reason: R2 waiver needs pricing committee minutes
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions:
    get:
      tags: [decisions]
      operationId: searchDecisions
      summary: List logged decisions of a rule set or a case reference in a period of at most 31 days
      description: |
        Two searches, both newest first and both needing `rules:log:read`. With `ruleSet` alone it lists one rule
        set's decisions; with `correlationId` it finds the decisions of the host's case reference, such as a loan
        application number, across every rule set of the caller's tenant, or in one rule set when `ruleSet` is
        added. A REST call without `X-Correlation-Id` gets a generated id, so a host that wants case search sends its
        own reference. A correlation id is a business reference and may appear in a URL; a host must not use a
        national id as one. One of `ruleSet` and `correlationId` is required, otherwise `400 QUERY_INVALID`. The
        search is led by tenant and correlation id and reads at most two monthly partitions.

        Permission `rules:log:read`. The decisions of the caller's tenant for `ruleSet` with
        `from <= loggedAt < to`, newest first, keyset-paged by log time and decision id; follow
        `nextCursor` until it is null. The cursor is signed for the tenant, the rule set and the period:
        reusing it with another rule set or period is `400 QUERY_INVALID`. The period is at most
        `query.max-range` (default 31 days, ADR-0015), so one page reads at most two monthly partitions
        of the decision log. Inputs declared `mask: true` are returned as stored (`hmac:<hex>`); the
        plain value is never kept. Every item carries `evalClock`, `clockChosen` and `pinned`, as
        `GET /decisions/{id}` does, so a back-dated or pinned decision never reads as a normal one
        in a list either. A rule set the tenant does not have gives an empty page. Writes nothing.
      parameters:
        - name: ruleSet
          in: query
          required: false
          description: The rule set name. Required unless `correlationId` is given; then it narrows the search to that rule set.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        - name: correlationId
          in: query
          required: false
          description: |
            The host's case reference, 1 to 128 characters of `A-Z a-z 0-9 . _ : -`; empty or any other
            character is `400 QUERY_INVALID`. The cursor is bound to it.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
        - name: from
          in: query
          required: true
          description: First instant of the period, inclusive, ISO 8601 in UTC. Missing or malformed is `400 QUERY_INVALID`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: |
            End of the period, exclusive, after `from` and at most `query.max-range` (default 31 days)
            later. Otherwise `400 QUERY_INVALID`.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Decisions per page, 1 to `query.max-page-size` (default 200, also the default page). Outside that range is `400 QUERY_INVALID`.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLogPage'
              example:
                data:
                  - decisionId: 01KF8ZQ3M5T7V9X1B3D5F7H9K2
                    ruleSet: card-fee
                    version: 1
                    hitPolicy: FIRST
                    outcome: MATCHED
                    matchedRuleIds: [R2]
                    inputs:
                      tier: SILVER
                      txCount: 5
                      nationalId: hmac:9f2c41d07a5be3c89f2c41d07a5be3c89f2c41d07a5be3c89f2c41d07a5be3c8
                    outputs:
                      fee: { currency: VND, amount: 10000 }
                    callerId: teller-01
                    correlationId: null
                    evalClock: '2027-01-31T22:50:00Z'
                    evaluatedAt: '2027-01-31T22:50:00Z'
                    clockChosen: false
                    pinned: false
                    loggedAt: '2027-01-31T22:50:00Z'
                    durationMicros: 31
                nextCursor: ZGVjaXNpb25zOjIwMjctMDEtMDFUMDA6MTA6MDBafDAxS0Y4WlEzTTVUN1Y5WDFCM0Q1RjdIOUsy.k2Yp0yq9R1y8JmB3V5tWcA
                hasNext: true
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:simulate:
    post:
      tags: [rule-sets]
      operationId: simulate
      summary: Run a version over sample inputs beside the version effective now, without logging anything
      description: |
        Permission `rules:simulate`, checked before the body is read. Runs the version (normally a
        `DRAFT`, or a version `PENDING_APPROVAL` an approver is looking at) and the version effective
        at the host clock over 1 to 1,000 sample input sets, and flags each sample whose outcome
        changed: the outcome kind, an output value or the failure code differs. A different matched
        rule giving the same outputs is not a change; with no effective version every sample is
        `changed`. Validation runs first: a stored version that no longer compiles or matches its hash
        is `422 VALIDATION_FAILED`, and no sample is evaluated. Inputs the effective version does not
        declare are left out of its side. Writes nothing (no decision row, no idempotency record, no
        event), so it takes no `Idempotency-Key`; the same version, samples and clock give the same
        body. A version of another tenant is `404 VERSION_NOT_FOUND`. Members other than `samples` and
        their `inputs` are ignored, including `tenantId`. A body over 1,048,576 bytes is
        `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            example:
              samples:
                - inputs: { tier: GOLD, txCount: 5 }
                - inputs: { tier: SILVER, txCount: 2 }
      responses:
        '200':
          description: One result per sample, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
              example:
                ruleSet: card-fee
                version: 2
                status: DRAFT
                baselineVersion: 1
                evaluatedAt: '2026-12-15T02:00:00Z'
                sampleCount: 2
                changedCount: 1
                results:
                  - index: 0
                    changed: false
                    simulated: { outcome: MATCHED, matchedRuleIds: [R1], outputs: { fee: { currency: VND, amount: 0 } } }
                    baseline: { outcome: MATCHED, matchedRuleIds: [R1], outputs: { fee: { currency: VND, amount: 0 } } }
                  - index: 1
                    changed: true
                    simulated: { outcome: MATCHED, matchedRuleIds: [R3], outputs: { fee: { currency: VND, amount: 30000 } } }
                    baseline: { outcome: MATCHED, matchedRuleIds: [R3], outputs: { fee: { currency: VND, amount: 50000 } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:simulate-history:
    post:
      tags: [rule-sets]
      operationId: simulateHistory
      summary: Replay logged decisions of a period through a version, without logging anything
      description: |
        Permissions `rules:simulate` and `rules:log:read`, both checked before the body is read: the
        answer is built from logged inputs (`RLE-015`). Reads the caller's tenant's decisions of the
        rule set made in `[from, to)`, newest first, at most `limit` of them, and evaluates each one
        twice at its logged clock: with the version it was made with, loaded by number as
        `POST /decisions/{decisionId}:replay` does, and with this version (normally a `DRAFT`, or a
        version `PENDING_APPROVAL` an approver is looking at). `changed` follows the rule of
        `:simulate`: the outcome kind, an output value or the failure code differs. A decision whose
        masked input had a value is not replayable: it is listed with `maskedInputs` naming the inputs,
        never their values, and the run goes on. All the decisions of one run share one regular
        expression read budget (`evaluation.regex-max-reads-per-request`); once it is spent, later
        items fail with `REGEX_TIMEOUT: not evaluated`.

        The period is at most `query.max-range` (31 days) and the run at most `simulation.max-inputs`
        (1,000) decisions; both may be lowered by the host. Outside them is `400 QUERY_INVALID`.
        `truncated` is true when the period held more decisions than were replayed. Writes nothing (no
        decision row, no idempotency record, no event), so it takes no `Idempotency-Key`. A version of
        another tenant is `404 VERSION_NOT_FOUND` and no decision is read. The response holds no logged
        input. Members other than `from`, `to` and `limit` are ignored, including `tenantId`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistorySimulationRequest'
            example:
              from: '2026-11-01T00:00:00Z'
              to: '2026-12-01T00:00:00Z'
              limit: 100
      responses:
        '200':
          description: One item per logged decision, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorySimulationResult'
              example:
                ruleSet: card-fee
                version: 2
                status: DRAFT
                from: '2026-11-01T00:00:00Z'
                to: '2026-12-01T00:00:00Z'
                decisionCount: 2
                replayedCount: 1
                changedCount: 1
                notReplayableCount: 1
                truncated: false
                results:
                  - decisionId: 01KB2R6Q3C0000000000000001
                    loggedVersion: 1
                    evalClock: '2026-11-29T22:00:00Z'
                    changed: true
                    maskedInputs: []
                    simulated: { outcome: MATCHED, matchedRuleIds: [R2], outputs: { fee: { currency: VND, amount: 30000 } } }
                    logged: { outcome: MATCHED, matchedRuleIds: [R2], outputs: { fee: { currency: VND, amount: 50000 } } }
                  - decisionId: 01KB2R6Q3C0000000000000000
                    loggedVersion: 1
                    evalClock: '2026-11-29T15:00:00Z'
                    changed: false
                    maskedInputs: [nationalId]
                    simulated: null
                    logged: null
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:retire:
    post:
      tags: [rule-sets]
      operationId: retire
      summary: Take a published version out of service by hand, with a reason
      description: |
        Permission `rules:approve`, checked before the body is read. Only a `PUBLISHED` version can be
        retired; any other status is `409 INVALID_STATE`. The reason is required: blank, or longer than
        `lifecycle.reason-max-length` (default 2,000 characters), is `400 INPUT_INVALID`
        (ADR-0025, DESIGN section 3.3, `RLE-026`).

        In the default mode `lifecycle.retire-approval: single` one identity is enough (PD-080). The
        version becomes `RETIRED` with `retiredAt` set to the transaction's clock and `lockVersion`
        incremented. One history entry `RETIRED` (actor, reason, `approvalMode: single`) and one
        `rules.version.retired.v1` event (`rule-engine/api/schema/rules.version.retired.v1.schema.json`)
        are written in the same transaction. Older `PUBLISHED` versions already in effect are retired
        with it as superseded, so a retire never brings an older version back. Evaluation stops
        selecting the version from `retiredAt` on, on every replica, because selection reads the
        database; with no other version in force the answer is `404 NO_EFFECTIVE_VERSION`. A retired
        version stays readable, replays, and is still selected for a clock before `retiredAt`.

        `Idempotency-Key` and `If-Match` are required: without `If-Match` the answer is
        `428 PRECONDITION_REQUIRED`, without `Idempotency-Key` `400 INPUT_INVALID`, and a stale
        `If-Match` is `409 VERSION_CONFLICT`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.

        Retiring the version in force when no other would remain leaves the rule set with no version in
        effect, so every evaluation fails until a new version is approved (PD-101). Under the shared host
        setting `horus.bpm.lifecycle.retire-last-version: confirm` (default) the request must then carry
        `confirmNoVersionInEffect: true` with its reason, otherwise it is `409 LAST_VERSION_IN_EFFECT`
        naming the rule set; under `refuse` it is always `409 LAST_VERSION_IN_EFFECT`. The problem body
        carries `ruleSet`, `version`, `setting` and `nextEffectiveFrom` (the start of a later approved
        version, or null). A version that only starts later does not count as in effect. The history
        entry and the event record `noVersionInEffect: true`. The transaction locks the rule set row first,
        so two concurrent retirements of its last versions run one after the other.

        In the mode `lifecycle.retire-approval: four-eyes`, and for the last version in effect under
        `lifecycle.retire-last-version: four-eyes`, this call only records a retirement request (PD-080,
        `RLE-038`). The answer is `200` with the version still `PUBLISHED` and serving, `retireRequestedBy`,
        `retireRequestedAt` and `retireReason` set and `lockVersion` incremented. One history entry
        `RETIRE_REQUESTED` and one `rules.version.retire-requested.v1` event
        (`rule-engine/api/schema/rules.version.retire-requested.v1.schema.json`) are written. The
        last-version rule applies to the request as above, except under `retire-last-version: four-eyes`,
        where the second approver is the control. A second request while one is pending is
        `409 INVALID_STATE`. Another `rules:approve` holder confirms with `:confirm-retire`; any holder
        withdraws it with `:cancel-retire`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireRequest'
            example:
              reason: Tet promotion ended
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:confirm-retire:
    post:
      tags: [rule-sets]
      operationId: confirmRetire
      summary: Confirm a pending retirement as the second approver
      description: |
        Permission `rules:approve`, checked before the body is read (PD-080, DESIGN section 3.3,
        `RLE-038`). Only a version with a pending retirement request can be confirmed; otherwise
        `409 INVALID_STATE`. The requester of the retirement gets `403 SELF_APPROVAL_FORBIDDEN` and
        nothing changes.

        The version becomes `RETIRED` with the same effects as `:retire` in `single` mode: `retiredAt`
        set to the transaction's clock, older versions in effect retired as superseded, the cache epoch
        moved, and evaluation stops selecting it on every replica. The history entry `RETIRED` and the
        `rules.version.retired.v1` event record `approvalMode: four-eyes`, the confirmer as actor, the
        requester (`retireRequestedBy` in the history, `requestedBy` in the event) and the reason of the
        request.

        The last-version rule (PD-101) is checked again at confirmation: when no other version would
        remain in effect, `retire-last-version: confirm` needs `confirmNoVersionInEffect: true` on the
        request or on this call, else `409 LAST_VERSION_IN_EFFECT`; `refuse` always answers
        `409 LAST_VERSION_IN_EFFECT`; `four-eyes` needs nothing more. A version that a newer version in
        effect now supersedes is `409 INVALID_STATE`.

        `Idempotency-Key` and `If-Match` are required: without `If-Match` the answer is
        `428 PRECONDITION_REQUIRED`, without `Idempotency-Key` `400 INPUT_INVALID`, and a stale
        `If-Match` is `409 VERSION_CONFLICT`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRetireRequest'
            example: {}
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:cancel-retire:
    post:
      tags: [rule-sets]
      operationId: cancelRetire
      summary: Withdraw a pending retirement request, with a reason
      description: |
        Permission `rules:approve`, checked before the body is read; any holder may cancel, the
        requester included (DESIGN section 3.3, `RLE-038`). Only a version with a pending retirement
        request can be cancelled; otherwise `409 INVALID_STATE`. The reason is required: blank, or
        longer than `lifecycle.reason-max-length` (default 2,000 characters), is `400 INPUT_INVALID`.

        The version stays `PUBLISHED` and serving, its request fields are cleared and `lockVersion`
        is incremented. One history entry `RETIRE_CANCELLED` records the actor and the reason; no event
        is written. `Idempotency-Key` and `If-Match` are required as on `:confirm-retire`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRetireRequest'
            example:
              reason: Promotion extended to March
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:withdraw:
    post:
      tags: [rule-sets]
      operationId: withdraw
      summary: Take back your own publication request; the version returns to DRAFT
      description: |
        Permission `rules:author`, checked before the body is read. Only the identity that requested
        publication (`requestedBy`) may withdraw it; anyone else, an approver included, gets
        `403 PERMISSION_DENIED` (an approver uses `:reject`). Only a `PENDING_APPROVAL` version can be
        withdrawn; any other status is `409 INVALID_STATE` (PD-089, DESIGN section 3.3, `RLE-046`).

        The version returns to `DRAFT` with `requestedBy` and `requestedAt` cleared and `lockVersion`
        incremented, one history entry `WITHDRAWN` and one `rules.version.withdrawn.v1` event
        (`rule-engine/api/schema/rules.version.withdrawn.v1.schema.json`). Nothing is published and
        the version in effect does not change. The draft can be edited and requested again, which
        starts a new approval.

        `Idempotency-Key` and `If-Match` are required: without `If-Match` the answer is
        `428 PRECONDITION_REQUIRED`, without `Idempotency-Key` `400 INPUT_INVALID`. The reason is
        optional; one longer than `lifecycle.reason-max-length` (default 2,000 characters) is
        `400 INPUT_INVALID`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
            example:
              reason: Wrong fee for GOLD
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{ruleSet}:evaluate:
    post:
      tags: [decisions]
      operationId: evaluate
      summary: Evaluate the version in force at the clock and log one decision
      description: |
        Permission `rules:evaluate`; a request that sets `clock` also needs `rules:simulate`, otherwise
        `403 CLOCK_NOT_ALLOWED`. The clock defaults to the host clock. It selects the version in force
        (the highest approved version whose `effectiveFrom` is at or before the clock; DESIGN 3.3.1) and
        feeds `today()` and `now()`, which read it in the rule set's `timeZone`.

        Writes exactly one `rle_decision` row in the request's transaction, with the version and the
        clock, so the decision replays (`POST /decisions/{decisionId}:replay`). A failed evaluation
        (`EVALUATION_ERROR`, or `UNIQUE_HIT_VIOLATION` when a `unique` table matches several rules; no
        match is outcome `NO_MATCH`) is logged and answered `422` with the `decisionId` and
        `matchedRuleIds`, never with partial outputs. Members other than `inputs` and `clock` are
        ignored, including `tenantId`. A body over 1,048,576 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - name: ruleSet
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            example:
              inputs:
                tier: GOLD
                txCount: 5
      responses:
        '200':
          description: The logged decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                decisionId: 01KDG7Z0RQ6V2Y8M1C4N5P7T9W
                ruleSet: card-fee
                version: 1
                evalClock: '2026-12-15T02:00:00Z'
                evaluatedAt: '2026-12-15T02:00:00Z'
                clockChosen: false
                pinned: false
                outcome: MATCHED
                matchedRuleIds: [R1]
                outputs:
                  fee: { currency: VND, amount: 0 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{ruleSet}:evaluate-batch:
    post:
      tags: [decisions]
      operationId: evaluateBatch
      summary: Evaluate up to 1,000 items of one rule set and log one decision per item
      description: |
        Permission `rules:evaluate`; a request that sets `clock` also needs `rules:simulate`, otherwise
        `403 CLOCK_NOT_ALLOWED`. One version is selected for the whole batch, at the request clock. The items are
        evaluated in order and every evaluated item is a logged decision with its own `decisionId`; an item that
        fails does not stop the others. The rows commit together in the request's transaction: all or none. The
        answer is `200` whenever the batch was accepted, with one entry per item in order: a `decision`, or a
        `problem` for an item that failed (`INPUT_INVALID`, `UNIQUE_HIT_VIOLATION`, `EVALUATION_ERROR`). An item
        whose input fails validation is not a decision and writes no row, as on `:evaluate`. Results never echo
        inputs.

        Bounds: at least 1 and at most `evaluation.max-batch` items (default and ceiling 1,000), otherwise
        `400 INPUT_INVALID` for none and `422 BATCH_TOO_LARGE` for too many; a body over 4,194,304 bytes is
        `413 PAYLOAD_TOO_LARGE`, refused before it is read when `Content-Length` declares it. The step budget is per
        item. The regular expression budget `evaluation.regex-max-reads-per-request` is shared by the batch: the item
        that spends it fails with `REGEX_TIMEOUT`, and every later item is reported failed and not evaluated, with
        no row. A `tenantId` in the body is ignored. With `Idempotency-Key`, a repeat returns the same body, decision
        ids included, and writes nothing; the same key with a changed item is `422 IDEMPOTENCY_KEY_REUSE_MISMATCH`.
        The correlation id of an item is part of neither the idempotent request nor the response.
      parameters:
        - name: ruleSet
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              items:
                - { inputs: { tier: GOLD, txCount: 5 }, correlationId: eod-2027-01-31-0000 }
                - { inputs: { tier: SILVER, txCount: four }, correlationId: eod-2027-01-31-0001 }
      responses:
        '200':
          description: One entry per item, in the order sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
              example:
                ruleSet: card-fee
                version: 1
                evalClock: '2027-01-31T22:00:00Z'
                succeeded: 1
                failed: 1
                results:
                  - index: 0
                    decision:
                      decisionId: 01KF8ZQ3M5T7V9X1B3D5F7H9K2
                      ruleSet: card-fee
                      version: 1
                      evalClock: '2027-01-31T22:00:00Z'
                      evaluatedAt: '2027-01-31T22:00:00Z'
                      clockChosen: false
                      pinned: false
                      outcome: MATCHED
                      matchedRuleIds: [R1]
                      outputs:
                        fee: { currency: VND, amount: 0 }
                  - index: 1
                    problem:
                      type: https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#input_invalid
                      title: Bad Request
                      status: 400
                      code: INPUT_INVALID
                      detail: Input txCount must be an integer
                      correlationId: 01KF8ZQ3M5T7V9X1B3D5F7H9K3
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{ruleSet}/versions/{version}:evaluate:
    post:
      tags: [decisions]
      operationId: evaluateVersion
      summary: Evaluate one approved version, at the host clock or a chosen clock, and log one decision
      description: |
        Pins the version instead of selecting it, for example to show what version 1 gave on a past
        date. A pin bypasses the selection of the version in force, so its permission is `rules:pin`
        (`403 PERMISSION_DENIED`), not `rules:evaluate`; no role holds `rules:pin` by default. Setting `clock`
        also needs `rules:simulate` (`403 CLOCK_NOT_ALLOWED`). The version must be `PUBLISHED`; a
        `RETIRED` version is `409 INVALID_STATE` unless the host sets
        `horus.bpm.rules.evaluation.pin-retired: true` (replay of its logged decisions is not
        affected). A `DRAFT` or `PENDING_APPROVAL`
        version is `409 INVALID_STATE`, because it would put an unapproved rule in the decision log;
        simulate it with `:simulate`, which writes no decision row. Writes one `rle_decision` row with
        the version and the clock, as `:evaluate` does, with the same `422` answers and body limit.
      parameters:
        - name: ruleSet
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            example:
              inputs:
                tier: STANDARD
                txCount: 1
              clock: '2026-11-20T10:00:00Z'
      responses:
        '200':
          description: The logged decision of the pinned version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                decisionId: 01KCS3W1DQ0M8V6T2B9R5N7K4E
                ruleSet: card-fee
                version: 1
                evalClock: '2026-11-20T10:00:00Z'
                evaluatedAt: '2026-12-05T08:00:00Z'
                clockChosen: true
                pinned: true
                outcome: MATCHED
                matchedRuleIds: [R3]
                outputs:
                  fee: { currency: VND, amount: 50000 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{decisionId}:replay:
    post:
      tags: [decisions]
      operationId: replayDecision
      summary: Re-evaluate a logged decision with its recorded version, inputs and clock
      description: |
        Permission `rules:log:read`, because the answer is built from logged inputs. Reads the
        decision row of the caller's tenant, loads the version it names (never selecting, so a
        version superseded or retired since still replays) and evaluates the logged inputs at the
        logged clock, in the version's own `timeZone`. The result carries the logged `decisionId`
        and `evalClock`; the same version, outputs and `matchedRuleIds` as the logged decision prove that
        the decision is reproducible (`TR-DET-05`). Writes nothing: no decision row, no event. No
        request body.

        An unknown id, or a decision of another tenant, is `404 DECISION_NOT_FOUND`. A decision whose
        logged inputs include a masked value (`mask: true`, stored only as `masked`) cannot be
        re-evaluated and is `422 REPLAY_NOT_POSSIBLE`, naming the inputs and never their values. So is a
        decision that called a host function whose version label is not the one now registered: the problem
        names the function and both labels. A
        logged failure replays as the same `422` problem as at evaluation, with the logged `decisionId`.
      parameters:
        - name: decisionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      responses:
        '200':
          description: The re-evaluated decision, identical to the logged one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                decisionId: 01KCS3W1DQ0M8V6T2B9R5N7K4E
                ruleSet: card-fee
                version: 1
                evalClock: '2026-11-20T10:00:00Z'
                evaluatedAt: '2026-11-20T10:00:00Z'
                clockChosen: false
                pinned: false
                outcome: MATCHED
                matchedRuleIds: [R3]
                outputs:
                  fee: { currency: VND, amount: 50000 }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{id}:
    get:
      tags: [decisions]
      operationId: getDecision
      summary: Read one logged decision of the caller's tenant
      description: |
        Permission `rules:log:read`. Returns the `rle_decision` row as stored, with `evalClock`,
        `clockChosen` and `pinned`, so a back-dated or pinned decision never reads as a normal one. An input declared
        `mask: true` (or masked by the host's or tenant's `decision-log.mask-default`) appears as
        `hmac:<keyId>:<hex>`, the HMAC-SHA256 of its plain value under the tenant's masking key; the plain
        value is not available anywhere after evaluation (RLE-012). A decision of another tenant is
        `404 DECISION_NOT_FOUND`. Writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The decision as logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedDecision'
              example:
                decisionId: 01KF2Q8Z0RQ6V2Y8M1C4N5P7T9
                ruleSet: minor-review
                version: 1
                hitPolicy: FIRST
                outcome: OK
                errorCode: null
                inputs:
                  nationalId: hmac:k1:7d8c2f0a9b6e4d1c3a5f7e9b0d2c4a6e8f1b3d5c7a9e0f2b4d6c8a0e2f4b6d8c
                  age: 16
                outputs:
                  route: MANUAL
                matchedRuleIds: [R1]
                callerId: teller
                correlationId: 7f3c2a10-5b2e-4f7a-9c1d-2e6b8a4d0f13
                evalClock: '2027-01-15T02:00:00Z'
                evaluatedAt: '2027-01-15T02:00:00Z'
                clockChosen: false
                pinned: false
                durationMicros: 41
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{id}/explain:
    get:
      tags: [decisions]
      operationId: explainDecision
      summary: Explain one logged decision in plain language
      description: |
        Permission `rules:log:read`. Built from the decision row and the stored version it names, and nothing
        else: no expression is evaluated, and a later version does not change it (RLE-030, DESIGN section 4.7).
        `matched` lists the matched rows in table order with each condition: the input, the cell's test, the
        recorded value and `result` (true for a condition that had to hold; null inside an `any` group, where the
        log does not say which alternative held). Rows that did not match are not explained. `reasons` are the
        contract: `RULE_MATCHED`, `NO_RULE_MATCHED`, `UNIQUE_HIT_VIOLATION`, `EVALUATION_ERROR`, `VALUE_MISSING` and
        `VALUE_MASKED`, each with named `params`. `text` is rendered from `reasons` through a message catalogue:
        `lang`, then `Accept-Language`, choose among the catalogues the host has (English and Vietnamese ship),
        else `explain.default-language`; `language` says which was used. Numbers in `text` have no grouping and
        money is in major units with its currency code (`10000 VND`); JSON values keep money in minor units. A
        masked input shows its stored `hmac:<keyId>:<hex>` with `masked: true` (RLE-031); the plain value is never
        available. The same decision always gives the same body. A decision of another tenant is
        `404 DECISION_NOT_FOUND`. Writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: Language of `text`, for example `vi`; a language the host has no catalogue for falls back as described
          schema:
            type: string
            pattern: '^[a-z]{2,3}$'
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionExplanation'
              example:
                decisionId: 01KF2Q8Z0RQ6V2Y8M1C4N5P7T9
                ruleSet: card-fee
                version: 1
                hitPolicy: FIRST
                outcome: OK
                errorCode: null
                clock: '2026-11-20T10:00:00Z'
                matched:
                  - ruleId: R2
                    position: 2
                    conditions:
                      - { input: txCount, path: /when/txCount, test: '>= 3', value: 5, masked: false, missing: false, result: true }
                    outputs:
                      fee: { currency: VND, amount: 10000 }
                outputs:
                  fee: { currency: VND, amount: 10000 }
                reasons:
                  - { code: RULE_MATCHED, params: { ruleId: R2, version: 1 } }
                language: en
                text: 'Rule R2 of card-fee version 1 matched because txCount is 5, which is at least 3. Result: fee 10000 VND.'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions:find-by-masked-input:
    post:
      tags: [decisions]
      operationId: findDecisionsByMaskedInput
      summary: Find the decisions whose masked input had a given plain value
      description: |
        Permission `rules:masked:search`, which `rules:log:read` does not imply. At most
        `masking.search.max-per-minute` searches per caller per minute on one replica (default 30,
        at least 1); past it `429 RATE_LIMITED` with `Retry-After`, and the refusal is audited. The engine fingerprints `value` with the caller's tenant key
        and returns the decisions of `ruleSet` between `from` (inclusive) and `to` (exclusive)
        whose input `input` holds that fingerprint, newest first. The plain value travels in the
        body, so it never appears in a URL or an access log, and it is never stored or echoed.
        The period is at most 31 days and `limit` (default 50) at most `query.max-page-size`
        (200); `truncated` is true when more decisions match, so narrow the period. A tenant
        without a masking key, a period over 31 days or an unknown member is `400 QUERY_INVALID`.
        The value is fingerprinted with every key the tenant holds, so rows written before a key
        rotation are found. Writes nothing to the decision log; each search writes one audit entry,
        `rules.decision-log.masked-input-searched.v1`, without the value or its fingerprint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskedInputSearch'
            example:
              ruleSet: minor-review
              input: nationalId
              value: '079090001234'
              from: '2027-01-01T00:00:00Z'
              to: '2027-02-01T00:00:00Z'
              limit: 50
      responses:
        '200':
          description: The matching decisions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSearchResult'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions:find-by-input:
    post:
      tags: [decisions]
      operationId: findDecisionsByInput
      summary: Find the decisions whose plain input had an exact value
      description: |
        Permission `rules:log:read`. Returns the decisions of `ruleSet` between `from` (inclusive) and `to`
        (exclusive) whose input `input`, stored in plain text, held exactly `value`, newest first, keyset-paged as
        `GET /decisions`. The value travels in the body, never in a URL. Values compare by canonical form: money by
        currency and minor units, a number by exact value (`30000` equals `30000.00`), a string by code point, with
        no case folding or trimming. The input must be declared by a version of the rule set and `value` must have
        its type, otherwise `400 QUERY_INVALID` naming `input` or `value`.

        An input that is masked, by `mask: true` or by the tenant's `decision-log.mask-default`, is refused with
        `400 QUERY_INVALID` pointing to `POST /decisions:find-by-masked-input` (permission `rules:masked:search`),
        never answered with no rows, so this search cannot be used to test a masked value. The period is at most
        31 days. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`. Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputSearch'
            example:
              ruleSet: loan-pricing
              input: productCode
              value: HOME-30Y
              from: '2027-01-01T00:00:00Z'
              to: '2027-02-01T00:00:00Z'
      responses:
        '200':
          description: One page of decisions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLogPage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    hostAuth:
      type: http
      scheme: bearer
      description: The host's own authentication. The engine reads the caller and tenant from the host's security context.
  parameters:
    RuleSetName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    VersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Written to the decision row of an evaluation and carried as `correlationId` by the event a command
        writes. Not part of the idempotent request: a replay
        with another correlation id returns the original result. When absent or malformed (more than 128 characters,
        or characters outside `A-Z a-z 0-9 . _ : -`), the engine uses a generated id.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Accepted by every endpoint that writes. A replay with the same request returns the original
        status and body and changes nothing. The same key with a different request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH` (a client defect: do not retry). A second request with the
        key while the first is still running is `409 IDEMPOTENCY_IN_FLIGHT` with `Retry-After: 1`: wait
        that many seconds and send the same request again, which then replays the first result.
        Keys are scoped to the tenant and the operation and remembered 24 hours
        (`idempotency.retention`).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page, 1 to `query.max-page-size` (default 200). Outside that range is `400 QUERY_INVALID`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `nextCursor` of the previous page, unchanged. Cursors are signed for the tenant and the
        list: a cursor not issued by this endpoint to this tenant (forged, edited, from another list
        or another tenant) is `400 QUERY_INVALID`.
      schema:
        type: string
        maxLength: 400
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `lockVersion` the change is based on, quoted; a stale value is `409 VERSION_CONFLICT`.
      schema:
        type: string
        example: '"1"'
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: |
        The `lockVersion` the change is based on, quoted; a stale value is `409 VERSION_CONFLICT`.
        Required: without it the answer is `428 PRECONDITION_REQUIRED`.
      schema:
        type: string
        example: '"3"'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required: without it the answer is `400 INPUT_INVALID`. A replay with the same request
        returns the original result and changes nothing. The same key with a different request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH`; while the first request runs it is
        `409 IDEMPOTENCY_IN_FLIGHT` with `Retry-After: 1`. Remembered 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    ETag:
      description: The version's `lockVersion`, quoted.
      schema:
        type: string
  responses:
    VersionCreated:
      description: The new draft version
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleSetVersion'
    Version:
      description: The version after the change
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleSetVersion'
    Problem:
      description: >-
        RFC 9457 problem; see the wiki page Common Error Codes. `401 UNAUTHENTICATED` carries a
        `WWW-Authenticate` challenge (the host's `horus.bpm.security.challenge`, `Bearer` by default, with
        `error="invalid_token"` when no tenant could be resolved for the caller). `403` is
        `PERMISSION_DENIED` when the caller lacks the endpoint's permission (or, on `:withdraw`, is not the
        requester), `CLOCK_NOT_ALLOWED` for a chosen `clock` without `rules:simulate`,
        `SELF_APPROVAL_FORBIDDEN` for a maker approving or rejecting their own version, `DRAFT_AUTHORING_DISABLED` when the host turned draft editing off, or `TENANT_NOT_ALLOWED` when an `X-Tenant-Id` header names
        another tenant than the caller's while tenant switching is off, or the principal's tenant attribute
        contradicts the resolved tenant (RLE-018, RLE-037). `428 PRECONDITION_REQUIRED` is a command
        that must be conditional sent without `If-Match`. `500 INTERNAL_ERROR` carries only a
        `correlationId`, never a stack trace, class name, SQL or table name; the same id is in the
        server log. `type` is
        `https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#<code in lower case>`.
      headers:
        WWW-Authenticate:
          description: Sent with every `401`
          schema:
            type: string
        Retry-After:
          description: Seconds to wait; sent with `409 IDEMPOTENCY_IN_FLIGHT`
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: integer
          description: Minor units, within plus or minus 2^53 - 1
          minimum: -9007199254740991
          maximum: 9007199254740991
    RuleSetVersion:
      type: object
      required: [ruleSet, version, status, hitPolicy, lockVersion, canonicalHash, sourceFormat, sourceHash, createdAt, definition]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        hitPolicy:
          type: string
          enum: [FIRST, UNIQUE, COLLECT]
        effectiveFrom: { type: [string, 'null'], format: date-time }
        lockVersion: { type: integer }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceFormat:
          type: string
          enum: [JSON, YAML, DMN_XML]
        sourceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceDocument:
          type: string
          description: The source text as received, only with `include=source`
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        retiredAt:
          type: [string, 'null']
          format: date-time
          description: When the version was retired, by hand or as superseded; null while it is not retired
        copiedFrom:
          type: integer
          minimum: 1
          description: 'Present on a draft restored from an earlier version (`RLE-062`), naming the version it was copied from; absent on an imported version'
        retireRequestedBy:
          type: [string, 'null']
          description: |
            Who requested the pending four-eyes retirement (`RLE-038`); null when none is pending. The
            version is still `PUBLISHED` and serving while it is pending
        retireRequestedAt: { type: [string, 'null'], format: date-time }
        retireReason:
          type: [string, 'null']
          description: The reason of the pending retirement request; null when none is pending
        retireConfirmsNoVersionInEffect:
          type: boolean
          description: |
            True when the pending request accepted that no version may remain in effect (PD-101), so its
            confirmation needs no `confirmNoVersionInEffect` of its own; false when none is pending
        createdBy:
          type: [string, 'null']
          description: Who imported the version; neither the author nor the requester may approve it
        createdAt: { type: string, format: date-time }
        allowedActions:
          $ref: '#/components/schemas/AllowedActions'
        definition:
          type: object
          description: The canonical definition, rule-engine/api/schema/rule-set.v1.schema.json
        warnings:
          type: array
          description: |
            What the author and the approver should see before publication; empty when none. Computed
            from the definition and the tenant's settings each time the version is returned, so the
            approver sees the warning the author saw at import (`RLE-049`). An idempotent replay
            returns the warnings of the original response.
          items:
            $ref: '#/components/schemas/VersionWarning'
    VersionWarning:
      type: object
      required: [code, input, matchedName, message, requiresAcknowledgement]
      properties:
        code:
          type: string
          enum: [UNMASKED_PERSONAL_DATA]
          description: '`UNMASKED_PERSONAL_DATA`: an input that declares no `mask` has a name that looks like personal data (PD-099)'
        input: { type: string }
        matchedName:
          type: [string, 'null']
          description: The configured personal-data name the input matched, for example `national id`
        message: { type: string }
        requiresAcknowledgement:
          type: boolean
          description: |
            Whether `:approve` must list this `{ code, input }` pair in `acknowledgedWarnings`
            (RLE-053, PD-104): the code is in `lifecycle.acknowledge-warnings` and the input is not
            masked only by the tenant's `decision-log.mask-default`. Computed with the tenant's
            settings at the time of the read, by the same rule the approve check applies; a client
            shows a checkbox for exactly these warnings. A replayed response recorded before this
            field existed reads it as `false`.
      example:
        code: UNMASKED_PERSONAL_DATA
        input: nationalId
        matchedName: national id
        message: 'Input nationalId looks like personal data (it matches "national id") but declares no mask. Its values will be stored in plain text in the decision log, which can never be changed. Declare mask: true, or mask: false if it holds no personal data.'
        requiresAcknowledgement: true
    AllowedActions:
      type: array
      description: |
        Lifecycle actions the caller may take on this version now, from its status, the
        caller's permissions and the four-eyes rule: `request-publish` on a `DRAFT` with
        `rules:author`; `approve` on a `PENDING_APPROVAL` with `rules:approve` when the caller is
        neither the requester nor the author; `reject` on a `PENDING_APPROVAL` with
        `rules:approve` when the caller is not the requester; `withdraw` on a `PENDING_APPROVAL`
        with `rules:author` for its requester only (PD-089), who never gets `approve` or `reject`;
        `retire` on a `PUBLISHED` version with `rules:approve` and no pending retirement; while a
        retirement is pending, `confirm-retire` for a `rules:approve` holder who is not its requester
        and `cancel-retire` for any `rules:approve` holder (`RLE-038`).
        A hint for screens only: the engine checks again on every command.
      items:
        type: string
        enum: [request-publish, approve, reject, withdraw, retire, confirm-retire, cancel-retire]
    RuleSetSummary:
      type: object
      required: [ruleSet, latestVersion, latestStatus, publishedVersion, lastChangedAt]
      properties:
        ruleSet: { type: string }
        latestVersion: { type: integer, minimum: 1 }
        latestStatus:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        publishedVersion:
          type: [integer, 'null']
          description: |
            The version evaluation selects at the host clock (DESIGN section 3.3.1, ADR-0025), or
            null when none is in effect. An approved version whose `effectiveFrom` is still in the
            future does not count until that instant.
        lastChangedAt:
          type: string
          format: date-time
          description: The latest creation, request, approval or rejection of any version of the rule set
    DecisionLogPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DecisionLogEntry'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor`, with the same search and period, for the next page; null on the last page
        hasNext:
          type: boolean
          description: True when `nextCursor` is set
    DecisionLogEntry:
      type: object
      description: One logged decision, as stored in the append-only decision log
      required: [decisionId, ruleSet, version, hitPolicy, outcome, matchedRuleIds, inputs, outputs, callerId, correlationId,
        evalClock, evaluatedAt, clockChosen, pinned, loggedAt, durationMicros]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        hitPolicy:
          type: string
          description: The hit policy of the evaluated version, for example `FIRST`
        outcome:
          type: string
          enum: [MATCHED, NO_MATCH, UNIQUE_HIT_VIOLATION, EVALUATION_ERROR]
        matchedRuleIds:
          type: array
          description: Matched rules in rule order; for `UNIQUE_HIT_VIOLATION` every overlapping rule
          items: { type: string }
        inputs:
          type: object
          description: The declared inputs as logged; an input declared `mask` is its stored hash, never the plain value
          additionalProperties: true
        outputs:
          type: object
          description: The outputs; empty for a failed evaluation. Money is `{currency, amount}` in minor units
          additionalProperties: true
        callerId: { type: [string, 'null'] }
        onBehalfOf:
          type: [string, 'null']
          description: |
            The user an embedded engine evaluated for: a process decision step is evaluated as
            `system:process-engine` on behalf of the user who triggered it. Null for a decision made
            for its caller alone, or after a timer
        correlationId: { type: [string, 'null'] }
        evalClock:
          type: string
          format: date-time
          description: The instant the decision reasoned about (`eval_clock`), the request's `clock` or the host clock
        evaluatedAt:
          type: string
          format: date-time
          description: When the decision ran (`created_at`), as in `LoggedDecision`
        clockChosen:
          type: boolean
          description: |
            True when the caller chose the clock, so the decision is back-dated or forward-dated:
            `evalClock` differs from `evaluatedAt`. Derived from two server-set timestamps.
        pinned:
          type: boolean
          description: |
            True when the caller named the version (`rules:pin`) instead of the engine selecting the
            version in force. Set by the engine on the decision row; never read from a request.
        loggedAt:
          type: string
          format: date-time
          description: The time of the log row, which places it in its monthly partition; equal to `evaluatedAt`
        durationMicros: { type: integer, format: int64 }
    RuleSetPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetSummary'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page
        hasNext:
          type: boolean
          description: True when `nextCursor` is set
    VersionSummary:
      type: object
      required: [ruleSet, version, status, hitPolicy, lockVersion, canonicalHash, createdAt, allowedActions]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        hitPolicy:
          type: string
          enum: [FIRST, UNIQUE, COLLECT]
        effectiveFrom: { type: [string, 'null'], format: date-time }
        lockVersion: { type: integer }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        retireRequestedBy:
          type: [string, 'null']
          description: Who requested the pending four-eyes retirement (`RLE-038`); null when none is pending
        allowedActions:
          $ref: '#/components/schemas/AllowedActions'
    VersionPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean
    HistoryEntry:
      type: object
      required: [action, toStatus, actor, lockVersion, occurredAt]
      properties:
        action:
          type: string
          enum: [CREATED, REQUESTED, APPROVED, REJECTED, WITHDRAWN, DRAFT_UPDATED, RETIRE_REQUESTED, RETIRE_CANCELLED, RETIRED]
        fromStatus:
          type: [string, 'null']
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED, null]
        toStatus:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        actor: { type: string }
        reason:
          type: [string, 'null']
          description: The rejection, withdrawal or retirement reason (`SUPERSEDED` when superseded), or the approval comment
        supersededBy:
          type: [integer, 'null']
          description: Present on a `RETIRED` entry only; the version that took over when superseded, null when retired by hand
        approvalMode:
          type: [string, 'null']
          enum: [single, four-eyes, system, null]
          description: Present on a `RETIRED` entry only; how the retirement was approved (`system` when superseded)
        noVersionInEffect:
          type: [boolean, 'null']
          description: Present on a `RETIRED` entry only; true when the retirement left the rule set with no version in effect (PD-101)
        copiedFrom:
          type: integer
          minimum: 1
          description: On the `CREATED` entry of a restore only (`RLE-062`); the version it was copied from
        retireRequestedBy:
          type: [string, 'null']
          description: Present on a `RETIRED` entry only; in `four-eyes` mode the requester whose request the actor confirmed, else null (`RLE-038`)
        lockVersion: { type: integer }
        occurredAt: { type: string, format: date-time }
        canonicalHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: On `DRAFT_UPDATED` only; the canonical hash after the replacement
        previousCanonicalHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: On `DRAFT_UPDATED` only; the canonical hash before the replacement
        acknowledgedWarnings:
          type: array
          description: On `APPROVED` only, always present there; the warnings the approver accepted, empty when nothing needed an acknowledgement (`RLE-053`); approvals recorded before this release show it empty
          items:
            $ref: '#/components/schemas/AcknowledgedWarning'
        maskedByDefaultInputs:
          type: array
          description: On `APPROVED` only, always present there; the inputs masked by the tenant's `decision-log.mask-default` rather than by their declaration at approval (PD-104)
          items: { type: string }
    AcknowledgedWarning:
      type: object
      description: One warning accepted on the record at approval (PD-104, `RLE-053`)
      required: [code, input]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [UNMASKED_PERSONAL_DATA]
        input:
          type: string
          minLength: 1
          maxLength: 100
          example: nationalId
    VersionHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
    RetireRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the version is taken out of service; stored in the history and the event
        confirmNoVersionInEffect:
          type: boolean
          default: false
          description: |
            True to accept that the retirement leaves the rule set with no version in effect (PD-101);
            needed when the version is the last one in effect, unless the host refuses it outright
    ConfirmRetireRequest:
      type: object
      properties:
        confirmNoVersionInEffect:
          type: boolean
          default: false
          description: |
            True to accept that the retirement leaves the rule set with no version in effect (PD-101),
            when the request did not already accept it
    CancelRetireRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the retirement request is withdrawn; stored in the history
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the version goes back to its author; stored in the history and the event
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: Optional; why the requester takes the request back. Stored in the history and the event
    FieldChange:
      type: object
      required: [path, from, to, nonAscii]
      properties:
        path:
          type: string
          description: JSON Pointer of the member, relative to the row, the column or the document (`/then/fee`, `/when/tier`, `/type`, `/hitPolicy`)
        from:
          description: The canonical value in `base`, or null when the member is absent there. A money literal in a `then` cell or an output default is `Money`; other cells are their canonical text
        to:
          description: The canonical value in `{version}`, or null when the member is absent there
        nonAscii:
          type: boolean
          description: True when either value holds a character outside printable ASCII or an escaped character such as `\u200B`, so a look-alike is visible to the approver
    ColumnChanges:
      type: object
      required: [added, removed, changed, reordered]
      properties:
        added:
          type: array
          items: { type: string }
          description: Column names only in `{version}`, in its order
        removed:
          type: array
          items: { type: string }
          description: Column names only in `base`, in its order
        changed:
          type: array
          items:
            type: object
            required: [name, fields]
            properties:
              name: { type: string }
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/FieldChange'
        reordered:
          type: boolean
          description: True when the columns both versions have are in a different order
    RowChange:
      type: object
      required: [ruleId, change]
      properties:
        ruleId: { type: string }
        change:
          type: string
          enum: [ADDED, REMOVED, CHANGED, MOVED]
        position:
          type: integer
          minimum: 1
          description: 1-based place in `{version}`; absent on `REMOVED`
        basePosition:
          type: integer
          minimum: 1
          description: 1-based place in `base`; absent on `ADDED`
        moved:
          type: boolean
          description: On `CHANGED` only; true when the row also moved
        fields:
          type: array
          description: On `CHANGED` only, in canonical member order
          items:
            $ref: '#/components/schemas/FieldChange'
    VersionDiff:
      type: object
      required: [ruleSet, version, base, canonicalHash, baseCanonicalHash, sourceHashChanged, effectiveFrom,
        header, inputs, outputs, rows, unchangedCount]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        base: { type: integer, minimum: 1 }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        baseCanonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceHashChanged:
          type: boolean
          description: True when the source documents differ, even if the canonical models are equal
        effectiveFrom:
          type: object
          required: [from, to]
          description: Version metadata reported beside the content diff
          properties:
            from: { type: [string, 'null'], format: date-time }
            to: { type: [string, 'null'], format: date-time }
        header:
          type: array
          description: Changed document members other than the columns and rules (hit policy, aggregate, time zone, money rounding, expression language, description), in canonical order; empty when none changed
          items:
            $ref: '#/components/schemas/FieldChange'
        inputs:
          $ref: '#/components/schemas/ColumnChanges'
        outputs:
          $ref: '#/components/schemas/ColumnChanges'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowChange'
        unchangedCount:
          type: integer
          minimum: 0
          description: Rows in both versions with the same cells and not moved
        masking:
          type: array
          description: Every input of either version with its masking status, inputs of `{version}` first in its order, then inputs only in `base` (`RLE-051`)
          items:
            $ref: '#/components/schemas/InputMasking'
    InputMasking:
      type: object
      required: [input, from, to, changed, personalDataName]
      properties:
        input: { type: string }
        from:
          description: Status in `base`; null when the input is only in `{version}`
          oneOf:
            - $ref: '#/components/schemas/MaskingStatus'
            - type: 'null'
        to:
          description: Status in `{version}`; null when the input is only in `base`
          oneOf:
            - $ref: '#/components/schemas/MaskingStatus'
            - type: 'null'
        changed:
          type: boolean
          description: True when `from` and `to` differ, including an input added or removed
        personalDataName:
          type: [string, 'null']
          description: When the input declares no `mask` in `{version}` and its name looks like personal data, the configured name it matched
    MaskingStatus:
      type: string
      enum: [MASKED, NOT_MASKED, MASKED_BY_DEFAULT, NOT_MASKED_BY_DEFAULT]
      description: |
        `MASKED` and `NOT_MASKED`: the input declares `mask: true` or `mask: false`. `MASKED_BY_DEFAULT`
        and `NOT_MASKED_BY_DEFAULT`: it declares nothing, and the tenant's `decision-log.mask-default`
        in force when the diff is read decides.
    UnsupportedElement:
      type: object
      required: [element, id, line, stage]
      properties:
        element: { type: string, description: 'The element name, for example `businessKnowledgeModel`' }
        id:
          type: [string, 'null']
          maxLength: 200
          description: The element's `id`; control characters are removed and it is cut at 200 characters
        line: { type: integer, minimum: 1 }
        stage:
          type: string
          enum: [S1, S2, S3, not planned]
          description: The stage of the coverage table that adds the element, or `not planned`
    Violation:
      type: object
      required: [ruleId, column, message]
      properties:
        ruleId:
          type: [string, 'null']
          description: The rule (row) the problem is in, or null for a problem outside the rules
        column:
          type: [string, 'null']
          description: The input or output name (column) the problem is in, or null when it concerns the row or the document
        message:
          type: string
          description: The problem, in English, without the rule id and column
        code:
          type: [string, 'null']
          description: |
            A stable code a client can act on; the message beside it may change. Expression problems
            (`when` and `then` cells): `SYNTAX_ERROR`, `UNKNOWN_INPUT` (a name that is not a declared
            input, for example `creditScoreX`), `TYPE_MISMATCH` (for example `balance + 100` where
            `balance` is money; also a call of a host function with the wrong number or types of arguments),
            `FORBIDDEN_CONSTRUCT` (a method call, member access or class reference
            such as `T(java.lang.Runtime).getRuntime()`; refused before anything inside it is read; also a call of
            a function the host did not register),
            `INVALID_LITERAL`, `INVALID_PATTERN`, `EXPRESSION_TOO_LONG`, `EXPRESSION_TOO_DEEP` (more than
            64 levels, a chain such as `a + a + ...` included). Other cell problems: `UNKNOWN_OUTPUT`,
            `MASKED_INPUT_IN_OUTPUT`. A table whose worst case is over the step budget:
            `EVALUATION_BUDGET_EXCEEDED`, on the first rule from which it is over, with a null `column`.
            Null for a problem of the document as a whole. New codes may be added.
          examples: [TYPE_MISMATCH]
        position:
          type: [integer, 'null']
          minimum: 0
          description: |
            Zero-based character position of the problem in the cell text as written (a shorthand
            such as `> 600 + tier` is counted from its first character), or null when the problem
            concerns the whole cell or is not in a cell.
          examples: [8]
    EvaluateRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: object
          description: Input values by name; money as `Money`
          additionalProperties: true
        clock:
          type: string
          format: date-time
          description: |
            The instant the decision reasons about, ISO 8601 with `Z` or an offset, for example
            `2026-11-20T10:00:00Z`. Selects the version in force and feeds `today()` and `now()`.
            Needs `rules:simulate` (`403 CLOCK_NOT_ALLOWED`); default the host clock.
    EvaluationLimit:
      type: string
      enum: [STEPS, TIME]
      description: |
        An `EVALUATION_ERROR` whose `detail` starts with `FUNCTION_FAILED` names a host function that threw or
        returned a value of another type, never the exception; one that starts with `FUNCTION_CHANGED` names a
        function whose version label is not the one the rule set version was approved with (only when the host
        sets `evaluation.function-version-change` to `refuse`). Both carry no limit.

        Present on an `EVALUATION_ERROR` whose `detail` starts with `EVALUATION_BUDGET_EXCEEDED`, and
        absent otherwise: the limit the decision reached. `STEPS` is the step budget (expression nodes
        visited, 100,000 by default): deterministic, so the same input fails the same way on every
        machine and the rule set must change. `TIME` is the wall-clock backstop (10 s by default): the
        machine was slow, so a retry may pass. New values may be added.
      examples: [STEPS]
    SimulationRequest:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [inputs]
            properties:
              inputs:
                type: object
                description: Input values by name; money as `Money`
                additionalProperties: true
    SimulationResult:
      type: object
      required: [ruleSet, version, status, baselineVersion, evaluatedAt, sampleCount, changedCount, results]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        baselineVersion:
          type: [integer, 'null']
          description: The version effective at `evaluatedAt`, or null when nothing is effective
        evaluatedAt: { type: string, format: date-time }
        sampleCount: { type: integer }
        changedCount:
          type: integer
          description: How many results have `changed` set
        results:
          type: array
          items:
            $ref: '#/components/schemas/SimulatedSample'
    SimulatedSample:
      type: object
      required: [index, changed, simulated, baseline]
      properties:
        index:
          type: integer
          description: Position of the sample in the request, from 0
        changed:
          type: boolean
          description: The outcome kind, an output value or the failure code differs, or there is no baseline
        simulated:
          $ref: '#/components/schemas/SimulatedOutcome'
        baseline:
          oneOf:
            - $ref: '#/components/schemas/SimulatedOutcome'
            - type: 'null'
    HistorySimulationRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
          description: First instant of the period, inclusive, ISO 8601
        to:
          type: string
          format: date-time
          description: End of the period, exclusive; after `from` and at most `query.max-range` (31 days) later
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: The most decisions to replay, newest first, 1 to `simulation.max-inputs`; default that maximum
    HistorySimulationResult:
      type: object
      required: [ruleSet, version, status, from, to, decisionCount, replayedCount, changedCount, notReplayableCount,
        truncated, results]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        decisionCount:
          type: integer
          description: How many logged decisions were read, the length of `results`
        replayedCount:
          type: integer
          description: How many were evaluated through both versions
        changedCount:
          type: integer
          description: How many results have `changed` set
        notReplayableCount:
          type: integer
          description: How many had a masked input with a value, which the log holds only as a fingerprint
        truncated:
          type: boolean
          description: True when the period held more decisions than `limit`; the newest were replayed
        results:
          type: array
          items:
            $ref: '#/components/schemas/HistorySimulatedDecision'
    HistorySimulatedDecision:
      type: object
      required: [decisionId, loggedVersion, evalClock, changed, maskedInputs, simulated, logged]
      properties:
        decisionId: { type: string }
        loggedVersion:
          type: integer
          description: The version the decision was made with
        evalClock:
          type: string
          format: date-time
          description: The logged clock both versions were evaluated at
        changed:
          type: boolean
          description: The outcome kind, an output value or the failure code differs; false when not replayable
        maskedInputs:
          type: array
          items: { type: string }
          description: Masked inputs that had a value, by name only; empty when the decision was replayed
        simulated:
          description: What this version decides; null when the decision is not replayable
          oneOf:
            - $ref: '#/components/schemas/SimulatedOutcome'
            - type: 'null'
        logged:
          description: What the logged version decides again, which is what was decided; null when not replayable
          oneOf:
            - $ref: '#/components/schemas/SimulatedOutcome'
            - type: 'null'
    SimulatedOutcome:
      type: object
      required: [outcome, matchedRuleIds, outputs]
      properties:
        outcome:
          type: string
          enum: [MATCHED, NO_MATCH, FAILED]
        matchedRuleIds:
          type: array
          items: { type: string }
        outputs:
          type: object
          additionalProperties: true
          description: Output values by name; money as `Money`. Empty on `FAILED`
        error:
          type: object
          description: Present on `FAILED` only
          required: [code, detail]
          properties:
            code:
              type: string
              enum: [EVALUATION_ERROR, UNIQUE_HIT_VIOLATION]
            detail: { type: string }
            limit:
              $ref: '#/components/schemas/EvaluationLimit'
    DecisionResult:
      type: object
      required: [decisionId, ruleSet, version, evalClock, evaluatedAt, clockChosen, pinned, outcome, matchedRuleIds, outputs]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        evalClock:
          type: string
          format: date-time
          description: The instant the decision reasoned about, the request's `clock` or the host clock; logged as `eval_clock` and used again by replay
        evaluatedAt:
          type: string
          format: date-time
          description: When the evaluation ran; equals `evalClock` unless a clock was chosen
        clockChosen:
          type: boolean
          description: |
            True when the caller chose the clock, so the decision is back-dated or forward-dated. The
            decision row records it the same way, as an `eval_clock` different from `created_at`.
        pinned:
          type: boolean
          description: |
            True when the caller named the version (`rules:pin`) instead of the clock selecting the
            version in force. Set by the engine and stored on the decision row; never read from a request.
        outcome:
          type: string
          enum: [MATCHED, NO_MATCH]
          description: A failed evaluation is answered with a Problem instead, carrying decisionId and matchedRuleIds
        matched:
          type: boolean
          description: False for a no-match, where every output is null and matchedRuleIds is empty
        matchedRuleIds:
          type: array
          items: { type: string }
        outputs:
          type: object
          additionalProperties: true
    LoggedDecision:
      type: object
      required: [decisionId, ruleSet, version, hitPolicy, outcome, inputs, matchedRuleIds, evalClock, evaluatedAt,
        clockChosen, pinned, durationMicros]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        hitPolicy: { type: string, enum: [FIRST, UNIQUE, COLLECT] }
        outcome:
          type: string
          enum: [OK, UNIQUE_HIT_VIOLATION, EVALUATION_ERROR]
          description: OK with an empty matchedRuleIds is a no-match
        errorCode:
          type: [string, 'null']
          description: |
            Why a decision failed: `EVALUATION_ERROR`, `UNIQUE_HIT_VIOLATION`, or
            `MASKING_KEY_MISSING` when the rule set masks an input and the tenant has no masking
            key, or `MASKED_INPUT_IN_OUTPUT` when an output reads an input masked by the tenant
            default (the decision was refused and no input was logged)
        inputs:
          type: object
          additionalProperties: true
          description: |
            The declared inputs as logged. A masked input with a value is a string
            `hmac:<keyId>:<64 hex digits>`; money is `Money`
        outputs:
          type: [object, 'null']
          additionalProperties: true
        matchedRuleIds:
          type: array
          items: { type: string }
        callerId: { type: [string, 'null'] }
        onBehalfOf:
          type: [string, 'null']
          description: |
            The user an embedded engine evaluated for: a process decision step is evaluated as
            `system:process-engine` on behalf of the user who triggered it. Null for a decision made
            for its caller alone, or after a timer
        correlationId: { type: [string, 'null'] }
        evalClock:
          type: string
          format: date-time
          description: The instant the decision reasoned about (`eval_clock`), the request's `clock` or the host clock
        evaluatedAt:
          type: string
          format: date-time
          description: When the decision ran (`created_at`)
        clockChosen:
          type: boolean
          description: |
            True when the caller chose the clock, so the decision is back-dated or forward-dated:
            `evalClock` differs from `evaluatedAt`. Derived from two server-set timestamps.
        pinned:
          type: boolean
          description: |
            True when the caller named the version (`rules:pin`) instead of the engine selecting the
            version in force. Set by the engine on the decision row; never read from a request.
        durationMicros: { type: integer, format: int64 }
    BatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          description: 1 to `evaluation.max-batch` items (default and ceiling 1,000)
          items:
            type: object
            required: [inputs]
            properties:
              inputs:
                type: object
                description: Input values by name; money as `Money`
                additionalProperties: true
              correlationId:
                type: string
                pattern: '^[A-Za-z0-9._:-]{1,128}$'
                description: The host's case reference, written to this item's decision row; another form is a failed item
        clock:
          type: string
          format: date-time
          description: As on `:evaluate`; needs `rules:simulate` (`403 CLOCK_NOT_ALLOWED`)
    BatchResponse:
      type: object
      required: [ruleSet, version, evalClock, succeeded, failed, results]
      properties:
        ruleSet: { type: string }
        version: { type: integer, description: The one version every item was evaluated with }
        evalClock: { type: string, format: date-time, description: The one clock every decision reasoned about }
        succeeded: { type: integer, description: Items that produced a decision that is not a failure }
        failed: { type: integer, description: Items that failed, including items not evaluated }
        results:
          type: array
          description: One entry per item, in the order sent
          items:
            type: object
            required: [index]
            properties:
              index: { type: integer, minimum: 0 }
              decision: { $ref: '#/components/schemas/DecisionResult' }
              problem:
                $ref: '#/components/schemas/Problem'
            oneOf:
              - required: [decision]
              - required: [problem]
    InputSearch:
      type: object
      additionalProperties: false
      required: [ruleSet, input, value, from, to]
      properties:
        ruleSet: { type: string }
        input: { type: string, description: The input's name; declared by a version of the rule set and not masked }
        value:
          description: The exact value, of the type the input declares; a string, number, boolean or `Money`. A date is `YYYY-MM-DD` and a datetime ISO 8601
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        limit: { type: integer, minimum: 1, maximum: 200, default: 200 }
        cursor: { type: string, description: The `nextCursor` of the previous page, with the same search }
    MaskedInputSearch:
      type: object
      additionalProperties: false
      required: [ruleSet, input, value, from, to]
      properties:
        ruleSet: { type: string }
        input: { type: string, description: The masked input's name }
        value:
          description: The plain value as it was passed to evaluation; a string, number, boolean or `Money`
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
    DecisionSearchResult:
      type: object
      required: [data, truncated]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LoggedDecision'
        truncated:
          type: boolean
          description: True when more decisions match than the limit
    DecisionExplanation:
      type: object
      description: A logged decision explained from its row and its stored version (RLE-030, RLE-031, DESIGN section 4.7)
      required: [decisionId, ruleSet, version, hitPolicy, outcome, errorCode, clock, matched, outputs, reasons, language, text]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        hitPolicy: { type: string, enum: [FIRST, UNIQUE, COLLECT] }
        outcome: { type: string, enum: [OK, UNIQUE_HIT_VIOLATION, EVALUATION_ERROR] }
        errorCode: { type: [string, 'null'] }
        clock:
          type: string
          format: date-time
          description: The instant the decision reasoned about (`evalClock`)
        matched:
          type: array
          description: The matched rows in table order; empty for no match. On `UNIQUE_HIT_VIOLATION` every matched row; on `EVALUATION_ERROR` the rows recorded as matched
          items:
            $ref: '#/components/schemas/ExplainedRow'
        outputs:
          type: [object, 'null']
          additionalProperties: true
          description: The decision's logged outputs; null when it produced none
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ExplanationReason'
        language:
          type: string
          description: The language `text` is written in
        text:
          type: string
          description: The plain-language explanation rendered from `reasons`; a client never parses it
    ExplainedRow:
      type: object
      required: [ruleId, position, conditions, outputs]
      properties:
        ruleId: { type: string }
        position:
          type: integer
          minimum: 1
          description: The row's 1-based place in the table
        conditions:
          type: array
          description: The row's conditions, the plain ones first in column order (the order of the declared inputs), then those of its `all` and `any` groups
          items:
            $ref: '#/components/schemas/ExplainedCondition'
        outputs:
          type: object
          additionalProperties: true
          description: |
            The outputs this row gave: the decision's outputs under `first` and `unique`; under `collect`, the
            row's entry of each list output (aggregated outputs are only in the decision's `outputs`); empty on a
            failed decision
    ExplainedCondition:
      type: object
      required: [input, path, test, value, masked, missing, result]
      properties:
        input: { type: string }
        path:
          type: string
          description: JSON Pointer of the cell in the row, for example `/when/txCount` or `/when/any/0/tier`
        test:
          type: string
          description: The cell's condition as stored, for example `>= 3`
        value:
          description: The recorded value (money in minor units); `hmac:<keyId>:<hex>` when masked; null when missing
        masked: { type: boolean }
        missing:
          type: boolean
          description: True when the input had no value
        result:
          type: [boolean, 'null']
          description: True for a condition that had to hold for the row to match; null inside an `any` group
    ExplanationReason:
      type: object
      required: [code, params]
      properties:
        code:
          type: string
          enum: [RULE_MATCHED, NO_RULE_MATCHED, UNIQUE_HIT_VIOLATION, EVALUATION_ERROR, VALUE_MISSING, VALUE_MASKED]
        params:
          type: object
          additionalProperties: true
          description: |
            Named parameters: `RULE_MATCHED` `ruleId`, `version`; `NO_RULE_MATCHED` `ruleSet`, `version`;
            `UNIQUE_HIT_VIOLATION` `ruleIds`, `version`; `EVALUATION_ERROR` `errorCode`, `ruleIds`, `version`;
            `VALUE_MISSING` and `VALUE_MASKED` `ruleId`, `input`
    RuleSetHistory:
      type: object
      required: [ruleSet, data, ruleSetEvents, ruleSetEventsTruncated, nextCursor, hasNext]
      properties:
        ruleSet: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionHistoryLine'
        ruleSetEvents:
          type: array
          description: The rule set's own events, newest first, on the first page only
          items:
            $ref: '#/components/schemas/RuleSetEvent'
        ruleSetEventsTruncated:
          type: boolean
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean
    VersionHistoryLine:
      type: object
      required: [version, status, effectiveFrom, effectiveTo, canonicalHash, createdBy, createdAt, requestedBy,
        requestedAt, approvedBy, approvedAt, approvalComment, rejectedBy, rejectedAt, rejectionReason, events,
        eventsTruncated]
      properties:
        version: { type: integer }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED] }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        effectiveTo:
          type: [string, 'null']
          format: date-time
          description: When the version was retired, by hand or superseded; null while it is not retired
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        approvalComment: { type: [string, 'null'] }
        rejectedBy:
          type: [string, 'null']
          description: The actor of the latest `REJECTED` event listed, or null
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }
        events:
          type: array
          description: The version's history entries, oldest first, at most 100
          items:
            $ref: '#/components/schemas/HistoryEntry'
        eventsTruncated: { type: boolean }
    RuleSetEvent:
      type: object
      required: [action, actor, occurredAt, evidence]
      properties:
        action:
          type: string
          enum: [EVIDENCE_EXPORTED]
        actor: { type: string }
        occurredAt: { type: string, format: date-time }
        evidence:
          $ref: '#/components/schemas/EvidenceSummary'
    EvidenceSummary:
      type: object
      required: [format, versions, decisionIds, contentSha256, bytes]
      properties:
        format: { type: string, enum: [csv, json] }
        versions:
          type: array
          items: { type: integer }
        decisionIds:
          type: array
          items: { type: string }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        bytes:
          type: integer
          description: Size of the file in bytes
    EvidenceRequest:
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format: { type: string, enum: [csv, json] }
        versions:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        decisionIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    EvidenceFile:
      type: object
      description: The JSON evidence file, compact, with `content` last. `contentSha256` is the SHA-256 of the `content` value exactly as it appears in the file
      required: [evidence, content]
      properties:
        evidence:
          type: object
          required: [ruleSet, tenantId, exportedBy, exportedAt, contentSha256]
          properties:
            ruleSet: { type: string }
            tenantId: { type: string }
            exportedBy: { type: string }
            exportedAt: { type: string, format: date-time }
            contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        content:
          type: object
          required: [ruleSet, versions, decisions]
          properties:
            ruleSet: { type: string }
            versions:
              type: array
              items:
                type: object
                required: [version, status, canonicalHash, events]
                properties:
                  version: { type: integer }
                  status: { type: string }
                  canonicalHash: { type: string }
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryEntry'
            decisions:
              type: array
              items:
                $ref: '#/components/schemas/LoggedDecision'
    Problem:
      type: object
      required: [type, title, status, code, detail, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [INPUT_INVALID, QUERY_INVALID, UNAUTHENTICATED, PERMISSION_DENIED, TENANT_NOT_ALLOWED,
            SELF_APPROVAL_FORBIDDEN, RULE_SET_NOT_FOUND, VERSION_NOT_FOUND, NO_EFFECTIVE_VERSION, DECISION_NOT_FOUND,
            VERSION_CONFLICT, INVALID_STATE, IDEMPOTENCY_IN_FLIGHT, RULE_SET_EXISTS, VALIDATION_FAILED,
            IDEMPOTENCY_KEY_REUSE_MISMATCH, EVALUATION_ERROR, UNIQUE_HIT_VIOLATION, PAYLOAD_TOO_LARGE,
            PRECONDITION_REQUIRED, INTERNAL_ERROR, SCHEMA_NOT_READY,
            DRAFT_AUTHORING_DISABLED, RATE_LIMITED, CLOCK_NOT_ALLOWED, REPLAY_NOT_POSSIBLE, LAST_VERSION_IN_EFFECT,
            WARNINGS_NOT_ACKNOWLEDGED, AUTHOR_UNKNOWN, BATCH_TOO_LARGE, CMMN_UNSUPPORTED, DMN_UNSUPPORTED_ELEMENT,
            EXPRESSION_LANGUAGE_UNSUPPORTED, EVIDENCE_TOO_LARGE]
        detail: { type: string }
        correlationId: { type: string }
        namespace:
          type: string
          description: Present on `CMMN_UNSUPPORTED`, the namespace of the root element
        line:
          type: integer
          description: Present on `CMMN_UNSUPPORTED`, the line of the root element
        elements:
          type: array
          description: >-
            Present on `DMN_UNSUPPORTED_ELEMENT` and `EXPRESSION_LANGUAGE_UNSUPPORTED`, in document order, at most
            100 (`violationsTruncated` is true when there were more)
          items: { $ref: '#/components/schemas/UnsupportedElement' }
        violations:
          type: array
          description: |
            Present on `VALIDATION_FAILED` only, with at least one entry. Every cell problem of the
            document is listed, in document order (rule by rule; conditions, then outputs, each as
            written), up to 100 entries, so a screen can mark each cell
            at once; `violationsTruncated` says whether more were found. A problem in the
            document's structure (a missing key, an unknown property) stops reading and is the only
            entry.
          maxItems: 100
          items:
            $ref: '#/components/schemas/Violation'
          example:
            - { ruleId: R3, column: fee, message: 'output fee is money and needs a currency: write 30000 followed by its ISO 4217 currency code' }
        violationsTruncated:
          type: boolean
          description: >-
            Present on `VALIDATION_FAILED`, and on `DMN_UNSUPPORTED_ELEMENT` when true; true when the document
            has more than the 100 problems or elements listed
        decisionId:
          type: string
          description: Present on `EVALUATION_ERROR` and `UNIQUE_HIT_VIOLATION`; the failed decision is logged
        ruleSet:
          type: string
          description: Present on `LAST_VERSION_IN_EFFECT`; the rule set that would be left with no version in effect
        version:
          type: integer
          description: Present on `LAST_VERSION_IN_EFFECT`; the version being retired
        setting:
          type: string
          enum: [confirm, refuse]
          description: Present on `LAST_VERSION_IN_EFFECT`; the host's `lifecycle.retire-last-version`
        nextEffectiveFrom:
          type: [string, 'null']
          format: date-time
          description: Present on `LAST_VERSION_IN_EFFECT`; the start of a later approved version, or null
        matchedRuleIds:
          type: array
          items: { type: string }
          description: On `UNIQUE_HIT_VIOLATION`, every matched rule (two or more); empty on `EVALUATION_ERROR`
        limit:
          $ref: '#/components/schemas/EvaluationLimit'
