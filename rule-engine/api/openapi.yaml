openapi: 3.1.0
info:
  title: HORUS Rule Engine REST API
  version: 0.1.0
  description: |
    REST API of the Rule Engine, served by the host application under `/api/bpm/rules/v1`.
    This file covers the endpoints implemented so far: import (YAML and DMN), lists and reads,
    export, replace a draft, diff two versions, request publication, approve, reject, withdraw, history,
    evaluate, and decision-log reads (one decision, and the search by a masked input's plain value).
    The remaining endpoints of
    rule-engine/docs/DESIGN.md section 4.2 are added with the features that implement them.

    The tenant is never part of a request: it comes from the host's authenticated context
    (`TenantResolver`). A `tenantId` in a body is ignored. Money is `{currency, amount}` with the
    amount in minor units. Errors are RFC 9457 `application/problem+json`; clients branch on `code`.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
servers:
  - url: /api/bpm/rules/v1
security:
  - hostAuth: []
tags:
  - name: rule-sets
    description: Import and the publication lifecycle
  - name: decisions
    description: Evaluation and the decision log
paths:
  /rule-sets:
    get:
      tags: [rule-sets]
      operationId: listRuleSets
      summary: List the rule sets of the caller's tenant, by name
      description: |
        Permission `rules:read`. Keyset-paged by rule set name in ascending order; follow
        `nextCursor` until it is null. `publishedVersion` is the version evaluation selects at the
        host clock (DESIGN section 3.3.1), or null when none is in effect. Writes nothing.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of rule sets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetPage'
              example:
                data:
                  - ruleSet: card-fee
                    latestVersion: 2
                    latestStatus: PENDING_APPROVAL
                    publishedVersion: 1
                    lastChangedAt: '2026-12-15T02:00:00Z'
                nextCursor: null
                hasNext: false
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [rule-sets]
      operationId: importRuleSet
      summary: Import a YAML document or a DMN decision table as version 1 of a new rule set
      description: |
        Stores the version as `DRAFT`, with the source document byte for byte, its SHA-256
        (`sourceHash`) and the SHA-256 of its RFC 8785 canonical form (`canonicalHash`). Nothing
        in the document is evaluated. Permission `rules:author`, checked before the body is read.

        A DMN 1.2 to 1.5 file (`application/xml`, `text/xml` or a DMN media type such as
        `application/dmn+xml`) holding one decision with a decision table is read into the lowest
        schema version that expresses it, so it gets the same checks, hash and four-eyes approval
        as YAML. The rule set name is the decision id (kebab-case). Cells use a FEEL subset:
        comparisons, ranges such as `[18..65]`, lists, `not(...)`, `-`, `null`, strings, numbers,
        booleans, `date("...")` and `date and time("...")`; `money(12.50, "USD")` is a non-portable
        extension. Anything else is `422 VALIDATION_FAILED` naming the rule, the column and the line.
        DTDs and entities are refused, and the file must be UTF-8. A body over 1 MB (1,048,576 bytes)
        is `413 PAYLOAD_TOO_LARGE`, for every content type.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              schemaVersion: 1
              ruleSet: card-fee
              hitPolicy: first
              inputs:
                - { name: tier, type: string }
              outputs:
                - { name: fee, type: money }
              rules:
                - id: R1
                  when: { tier: "== 'GOLD'" }
                  then: { fee: "0 VND" }
          application/xml:
            schema:
              type: string
            example: |
              <definitions xmlns="https://www.omg.org/spec/DMN/20230324/MODEL/" name="card-fee" namespace="urn:example">
                <decision id="card-fee" name="card-fee">
                  <decisionTable hitPolicy="FIRST">
                    <input><inputExpression typeRef="string"><text>tier</text></inputExpression></input>
                    <output name="fee" typeRef="number"/>
                    <rule id="R1"><inputEntry><text>"GOLD"</text></inputEntry><outputEntry><text>0</text></outputEntry></rule>
                  </decisionTable>
                </decision>
              </definitions>
      responses:
        '201':
          $ref: '#/components/responses/VersionCreated'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}:
    get:
      tags: [rule-sets]
      operationId: getRuleSet
      summary: Read the summary of one rule set
      description: Permission `rules:read`. The same summary as an item of `GET /rule-sets`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
      responses:
        '200':
          description: The rule set summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetSummary'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions:
    get:
      tags: [rule-sets]
      operationId: listVersions
      summary: List the versions of a rule set, newest first
      description: |
        Permission `rules:read`. Keyset-paged by version number in descending order. Items carry
        the lifecycle fields without the definition; read one version for its definition.
        `allowedActions` is computed for the caller. A rule set of another tenant is
        `404 RULE_SET_NOT_FOUND`. Writes nothing.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
              example:
                data:
                  - ruleSet: card-fee
                    version: 2
                    status: PENDING_APPROVAL
                    hitPolicy: FIRST
                    effectiveFrom: null
                    lockVersion: 1
                    canonicalHash: 3f1c9a5e0b7d2c4a6e8f0a1b3c5d7e9f1a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d
                    createdBy: lan
                    createdAt: '2026-12-15T01:00:00Z'
                    requestedBy: lan
                    requestedAt: '2026-12-15T01:30:00Z'
                    approvedBy: null
                    approvedAt: null
                    allowedActions: [reject]
                nextCursor: null
                hasNext: false
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [rule-sets]
      operationId: importVersion
      summary: Import a YAML document or a DMN decision table as the next draft version of an existing rule set
      description: |
        The document's `ruleSet` (for DMN, the decision id) must equal `{name}`. DMN files are read
        as for `importRuleSet`. Permission `rules:author`, checked before the body is read. A body
        over 1,048,576 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
          application/xml:
            schema:
              type: string
      responses:
        '201':
          $ref: '#/components/responses/VersionCreated'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:
    get:
      tags: [rule-sets]
      operationId: getVersion
      summary: Read one version
      description: Permission `rules:read`. With `include=source` the response adds `sourceDocument`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [source]
      responses:
        '200':
          description: The version
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [rule-sets]
      operationId: replaceDraft
      summary: Replace the document of a DRAFT version in place
      description: |
        Permission `rules:author`, checked before the body is read; only the draft's author
        (`createdBy`) may replace it. Anyone else gets `403 PERMISSION_DENIED`, with a detail pointing
        to importing their own document as a new version (`POST .../rule-sets/{name}/versions`); so the four-eyes check on
        `createdBy` keeps holding. When the host sets
        `horus.bpm.rules.authoring.cockpit-drafts` to `false` the answer is
        `403 DRAFT_AUTHORING_DISABLED` (DESIGN section 4.4).

        The body is read and validated exactly as for `importVersion`: YAML or DMN 1.2 to 1.5,
        at most 1,048,576 bytes (`413 PAYLOAD_TOO_LARGE`), the document's `ruleSet` must equal
        `{name}` (`400 INPUT_INVALID`), and a refused document is `422 VALIDATION_FAILED` with every
        cell problem in `violations`. A refused document stores nothing.

        On success the version keeps its number, status `DRAFT`, author and creation time; its
        canonical document, `canonicalHash`, source document, `sourceHash`, `sourceFormat`, hit
        policy and `effectiveFrom` are replaced and `lockVersion` is incremented. One history entry
        `DRAFT_UPDATED` (actor, `lockVersion`, the canonical hash before and after) and one
        `rules.version.draft-updated.v1` event (`rule-engine/api/schema/rules.version.draft-updated.v1.schema.json`)
        are written in the same transaction (DESIGN section 3.3).
        Only a `DRAFT` can be replaced; any other status is `409 INVALID_STATE`.

        `Idempotency-Key` and `If-Match` are required: without `If-Match` the answer is
        `428 PRECONDITION_REQUIRED`, without `Idempotency-Key` `400 INPUT_INVALID`; a stale
        `If-Match` is `409 VERSION_CONFLICT`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
            example: |
              schemaVersion: 1
              ruleSet: card-fee
              hitPolicy: first
              inputs:
                - { name: tier, type: string }
              outputs:
                - { name: fee, type: money }
              rules:
                - id: R1
                  when: { tier: "== 'GOLD'" }
                  then: { fee: "0 VND" }
          application/xml:
            schema:
              type: string
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}/diff:
    get:
      tags: [rule-sets]
      operationId: diffVersions
      summary: Compare two versions of a rule set row by row
      description: |
        Permission `rules:read`. Compares the canonical models of version `{version}` and version
        `base` of the same rule set (DESIGN section 4.5, `RLE-028`). Source text, comments and
        `effectiveFrom` never show as content changes; `effectiveFrom` is reported beside the content
        diff and `sourceHashChanged` says whether the source files differ. Any statuses may be
        compared. Writes nothing.

        Rows are matched by rule id, never by position: `ADDED` (only in `{version}`), `REMOVED`
        (only in `base`), `CHANGED` (same id, different cells; `fields` lists JSON Pointer paths
        into the row with canonical values, money as `Money`), `MOVED` (same id and cells, order
        changed relative to the other common rows; the moved set is the common rows outside the
        longest common subsequence of the two orders, ties broken by keeping the earlier rows of
        `{version}`). A row both moved and changed is `CHANGED` with `moved: true`. Rows are ordered
        by `position`, then removed rows by `basePosition`, so the same request returns a
        byte-identical body. Every changed value whose text holds a character outside printable
        ASCII, or an escaped character such as `\u200B`, has `nonAscii: true` (ADR-0026 decision 6).

        No `base`, or `base` equal to `{version}`, is `400 INPUT_INVALID`; a `base` that does not
        exist is `404 VERSION_NOT_FOUND`; a rule set of another tenant is `404 RULE_SET_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - name: base
          in: query
          required: true
          description: The version to compare against, usually the version in effect
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDiff'
              example:
                ruleSet: card-fee
                version: 2
                base: 1
                canonicalHash: 4be1d7a0c35e9f2b8a6d4c1e0f9b7a5d3c2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a
                baseCanonicalHash: 9c07e5d3b1a9f7e5d3c1b9a7f5e3d1c9b7a5f3e1d9c7b5a3f1e9d7c5b3a1f9e7
                sourceHashChanged: true
                effectiveFrom: { from: '2026-11-01T00:00:00Z', to: null }
                header: []
                inputs: { added: [], removed: [], changed: [], reordered: false }
                outputs: { added: [], removed: [], changed: [], reordered: false }
                rows:
                  - ruleId: R2
                    change: CHANGED
                    position: 2
                    basePosition: 2
                    moved: false
                    fields:
                      - path: /then/fee
                        from: { currency: VND, amount: 30000 }
                        to: { currency: VND, amount: 0 }
                        nonAscii: false
                  - ruleId: R6
                    change: ADDED
                    position: 3
                unchangedCount: 2
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}/export:
    get:
      tags: [rule-sets]
      operationId: exportVersion
      summary: Export a version as a file that imports back with the same canonical hash
      description: |
        `format=json` is the RFC 8785 canonical document; `format=dmn` is a DMN 1.5 document with
        one decision table. The file carries no tenant, status, lock version, requester, approver or
        decision data. A version that uses `any` or `all` groups, output defaults, collect
        aggregates or calculated cells has no decision table form and is `422 VALIDATION_FAILED`
        naming the rule and the cell. YAML export is not available yet. Writes nothing. Permission
        `rules:read`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, dmn]
      responses:
        '200':
          description: The file, with `Content-Disposition` `attachment; filename="<name>-v<version>.<json|dmn>"`
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: string
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}/history:
    get:
      tags: [rule-sets]
      operationId: getVersionHistory
      summary: Read the lifecycle history of one version, oldest first
      description: |
        Permission `rules:read`. One entry per transition (`CREATED`, `REQUESTED`, `APPROVED`,
        `REJECTED`, `WITHDRAWN`) and per replacement of a draft (`DRAFT_UPDATED`, with both canonical hashes), with actor, reason or comment, statuses before and after and the
        `lockVersion` after (DESIGN section 3.3.3). A version created before the history table
        existed starts with a backfilled `CREATED` entry; its earlier request and approval have
        no entries.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: The history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionHistory'
              example:
                data:
                  - action: CREATED
                    fromStatus: null
                    toStatus: DRAFT
                    actor: lan
                    reason: null
                    lockVersion: 0
                    occurredAt: '2026-12-15T01:00:00Z'
                  - action: REQUESTED
                    fromStatus: DRAFT
                    toStatus: PENDING_APPROVAL
                    actor: lan
                    reason: null
                    lockVersion: 1
                    occurredAt: '2026-12-15T01:30:00Z'
                  - action: REJECTED
                    fromStatus: PENDING_APPROVAL
                    toStatus: DRAFT
                    actor: minh
                    reason: R2 waiver needs pricing committee minutes
                    lockVersion: 2
                    occurredAt: '2026-12-15T02:00:00Z'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:request-publish:
    post:
      tags: [rule-sets]
      operationId: requestPublish
      summary: Move a draft to PENDING_APPROVAL and record the caller as requester
      description: Permission `rules:author`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:approve:
    post:
      tags: [rule-sets]
      operationId: approve
      summary: Approve a pending version as a second person; it becomes PUBLISHED
      description: |
        Permission `rules:approve`. The requester of the publication cannot approve it:
        `403 SELF_APPROVAL_FORBIDDEN`, and the version stays `PENDING_APPROVAL`. Without an
        `effectiveFrom` in the document the version takes effect at approval. A body over
        16,384 bytes is `413 PAYLOAD_TOO_LARGE`.

        `If-Match` is required and must be the `lockVersion` of the version the approver reviewed:
        without it the answer is `428 PRECONDITION_REQUIRED`, and a stale value is
        `409 VERSION_CONFLICT`, with nothing published. A version can be sent back, replaced in place
        and requested again under the same number, so the lock version is what ties an approval to
        the content reviewed (#275). A client that receives `409 VERSION_CONFLICT` here must show the
        approver the current version (its content and diff) again and let them decide; it must never
        retry automatically with the new `ETag`, because that would approve content nobody reviewed.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  maxLength: 2000
                  description: Optional; stored in the history. Longer than `lifecycle.reason-max-length` (default 2,000 characters) is `400 INPUT_INVALID`
            example:
              comment: Fees checked against the tariff
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:reject:
    post:
      tags: [rule-sets]
      operationId: reject
      summary: Send a pending version back to DRAFT with a reason
      description: |
        Permission `rules:approve`. Only a `PENDING_APPROVAL` version can be rejected; any other
        status is `409 INVALID_STATE`. The version returns to `DRAFT` with `requestedBy` and
        `requestedAt` cleared, one history entry `REJECTED` and one `rules.version.rejected.v1`
        event. The requester of the publication cannot reject it: `403 SELF_APPROVAL_FORBIDDEN`,
        with a detail pointing to `:withdraw`, and the version stays `PENDING_APPROVAL` (PD-089,
        DESIGN section 3.3, `RLE-025`).
        A blank reason, or one longer than `lifecycle.reason-max-length` (default 2,000
        characters), is `400 INPUT_INVALID`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.
        `If-Match` is required, as for `:approve`: `428 PRECONDITION_REQUIRED` without it,
        `409 VERSION_CONFLICT` when stale. On `409 VERSION_CONFLICT` a client shows the current
        version again and never retries automatically with the new `ETag`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
            example:
              reason: R2 waiver needs pricing committee minutes
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /rule-sets/{name}/versions/{version}:withdraw:
    post:
      tags: [rule-sets]
      operationId: withdraw
      summary: Take back your own publication request; the version returns to DRAFT
      description: |
        Permission `rules:author`, checked before the body is read. Only the identity that requested
        publication (`requestedBy`) may withdraw it; anyone else, an approver included, gets
        `403 PERMISSION_DENIED` (an approver uses `:reject`). Only a `PENDING_APPROVAL` version can be
        withdrawn; any other status is `409 INVALID_STATE` (PD-089, DESIGN section 3.3, `RLE-046`).

        The version returns to `DRAFT` with `requestedBy` and `requestedAt` cleared and `lockVersion`
        incremented, one history entry `WITHDRAWN` and one `rules.version.withdrawn.v1` event
        (`rule-engine/api/schema/rules.version.withdrawn.v1.schema.json`). Nothing is published and
        the version in effect does not change. The draft can be edited and requested again, which
        starts a new approval.

        `Idempotency-Key` and `If-Match` are required: without `If-Match` the answer is
        `428 PRECONDITION_REQUIRED`, without `Idempotency-Key` `400 INPUT_INVALID`. The reason is
        optional; one longer than `lifecycle.reason-max-length` (default 2,000 characters) is
        `400 INPUT_INVALID`. A body over 16,384 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - $ref: '#/components/parameters/RuleSetName'
        - $ref: '#/components/parameters/VersionNumber'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
            example:
              reason: Wrong fee for GOLD
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{ruleSet}:evaluate:
    post:
      tags: [decisions]
      operationId: evaluate
      summary: Evaluate the version effective at the host clock and log one decision
      description: |
        Permission `rules:evaluate`. Writes exactly one `rle_decision` row in the request's
        transaction. A failed evaluation (`EVALUATION_ERROR`, or `UNIQUE_HIT_VIOLATION` when a
        `unique` table matches several rules; no match is outcome `NO_MATCH`) is logged and answered `422` with the
        `decisionId` and `matchedRuleIds`, never with partial outputs. Members other than `inputs` are ignored, including `tenantId`. A body over
        1,048,576 bytes is `413 PAYLOAD_TOO_LARGE`.
      parameters:
        - name: ruleSet
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            example:
              inputs:
                tier: GOLD
                txCount: 5
      responses:
        '200':
          description: The logged decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResult'
              example:
                decisionId: 01KDG7Z0RQ6V2Y8M1C4N5P7T9W
                ruleSet: card-fee
                version: 1
                evaluatedAt: '2026-12-15T02:00:00Z'
                outcome: MATCHED
                matchedRuleIds: [R1]
                outputs:
                  fee: { currency: VND, amount: 0 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions/{id}:
    get:
      tags: [decisions]
      operationId: getDecision
      summary: Read one logged decision of the caller's tenant
      description: |
        Permission `rules:log:read`. Returns the `rle_decision` row as stored. An input declared
        `mask: true` (or masked by the host's or tenant's `decision-log.mask-default`) appears as
        `hmac:<keyId>:<hex>`, the HMAC-SHA256 of its plain value under the tenant's masking key; the plain
        value is not available anywhere after evaluation (RLE-012). A decision of another tenant is
        `404 DECISION_NOT_FOUND`. Writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The decision as logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedDecision'
              example:
                decisionId: 01KF2Q8Z0RQ6V2Y8M1C4N5P7T9
                ruleSet: minor-review
                version: 1
                hitPolicy: FIRST
                outcome: OK
                errorCode: null
                inputs:
                  nationalId: hmac:k1:7d8c2f0a9b6e4d1c3a5f7e9b0d2c4a6e8f1b3d5c7a9e0f2b4d6c8a0e2f4b6d8c
                  age: 16
                outputs:
                  route: MANUAL
                matchedRuleIds: [R1]
                callerId: teller
                correlationId: 7f3c2a10-5b2e-4f7a-9c1d-2e6b8a4d0f13
                evaluatedAt: '2027-01-15T02:00:00Z'
                durationMicros: 41
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /decisions:find-by-masked-input:
    post:
      tags: [decisions]
      operationId: findDecisionsByMaskedInput
      summary: Find the decisions whose masked input had a given plain value
      description: |
        Permission `rules:masked:search`, which `rules:log:read` does not imply. At most
        `masking.search.max-per-minute` searches per caller per minute on one replica (default 30,
        at least 1); past it `429 RATE_LIMITED` with `Retry-After`, and the refusal is audited. The engine fingerprints `value` with the caller's tenant key
        and returns the decisions of `ruleSet` between `from` (inclusive) and `to` (exclusive)
        whose input `input` holds that fingerprint, newest first. The plain value travels in the
        body, so it never appears in a URL or an access log, and it is never stored or echoed.
        The period is at most 31 days and `limit` (default 50) at most `query.max-page-size`
        (200); `truncated` is true when more decisions match, so narrow the period. A tenant
        without a masking key, a period over 31 days or an unknown member is `400 QUERY_INVALID`.
        The value is fingerprinted with every key the tenant holds, so rows written before a key
        rotation are found. Writes nothing to the decision log; each search writes one audit entry,
        `rules.decision-log.masked-input-searched.v1`, without the value or its fingerprint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskedInputSearch'
            example:
              ruleSet: minor-review
              input: nationalId
              value: '079090001234'
              from: '2027-01-01T00:00:00Z'
              to: '2027-02-01T00:00:00Z'
              limit: 50
      responses:
        '200':
          description: The matching decisions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSearchResult'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    hostAuth:
      type: http
      scheme: bearer
      description: The host's own authentication. The engine reads the caller and tenant from the host's security context.
  parameters:
    RuleSetName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    VersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Carried as `correlationId` by the event the command writes. Not part of the idempotent request: a replay
        with another correlation id returns the original result. When absent or malformed (more than 128 characters,
        or characters outside `A-Z a-z 0-9 . _ : -`), the engine uses a generated id.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Accepted by every endpoint that writes. A replay with the same request returns the original
        status and body and changes nothing. The same key with a different request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH` (a client defect: do not retry). A second request with the
        key while the first is still running is `409 IDEMPOTENCY_IN_FLIGHT` with `Retry-After: 1`: wait
        that many seconds and send the same request again, which then replays the first result.
        Keys are scoped to the tenant and the operation and remembered 24 hours
        (`idempotency.retention`).
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page, 1 to `query.max-page-size` (default 200). Outside that range is `400 QUERY_INVALID`.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The `nextCursor` of the previous page, unchanged. Cursors are signed for the tenant and the
        list: a cursor not issued by this endpoint to this tenant (forged, edited, from another list
        or another tenant) is `400 QUERY_INVALID`.
      schema:
        type: string
        maxLength: 400
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `lockVersion` the change is based on, quoted; a stale value is `409 VERSION_CONFLICT`.
      schema:
        type: string
        example: '"1"'
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: |
        The `lockVersion` the change is based on, quoted; a stale value is `409 VERSION_CONFLICT`.
        Required: without it the answer is `428 PRECONDITION_REQUIRED`.
      schema:
        type: string
        example: '"3"'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required: without it the answer is `400 INPUT_INVALID`. A replay with the same request
        returns the original result and changes nothing. The same key with a different request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH`; while the first request runs it is
        `409 IDEMPOTENCY_IN_FLIGHT` with `Retry-After: 1`. Remembered 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    ETag:
      description: The version's `lockVersion`, quoted.
      schema:
        type: string
  responses:
    VersionCreated:
      description: The new draft version
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Location:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleSetVersion'
    Version:
      description: The version after the change
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleSetVersion'
    Problem:
      description: >-
        RFC 9457 problem; see the wiki page Common Error Codes. `401 UNAUTHENTICATED` carries a
        `WWW-Authenticate` challenge (the host's `horus.bpm.security.challenge`, `Bearer` by default, with
        `error="invalid_token"` when no tenant could be resolved for the caller). `403` is
        `PERMISSION_DENIED` when the caller lacks the endpoint's permission (or, on `:withdraw`, is not the
        requester), `SELF_APPROVAL_FORBIDDEN` for a maker approving or rejecting their own version, `DRAFT_AUTHORING_DISABLED` when the host turned draft editing off, or `TENANT_NOT_ALLOWED` when an `X-Tenant-Id` header names
        another tenant than the caller's while tenant switching is off, or the principal's tenant attribute
        contradicts the resolved tenant (RLE-018, RLE-037). `428 PRECONDITION_REQUIRED` is a command
        that must be conditional sent without `If-Match`. `500 INTERNAL_ERROR` carries only a
        `correlationId`, never a stack trace, class name, SQL or table name; the same id is in the
        server log. `type` is
        `https://github.com/dhluong90/horus-Agentic-BPM/wiki/Common-Error-Codes#<code in lower case>`.
      headers:
        WWW-Authenticate:
          description: Sent with every `401`
          schema:
            type: string
        Retry-After:
          description: Seconds to wait; sent with `409 IDEMPOTENCY_IN_FLIGHT`
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        amount:
          type: integer
          description: Minor units, within plus or minus 2^53 - 1
          minimum: -9007199254740991
          maximum: 9007199254740991
    RuleSetVersion:
      type: object
      required: [ruleSet, version, status, hitPolicy, lockVersion, canonicalHash, sourceFormat, sourceHash, createdAt, definition]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        hitPolicy:
          type: string
          enum: [FIRST, UNIQUE, COLLECT]
        effectiveFrom: { type: [string, 'null'], format: date-time }
        lockVersion: { type: integer }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceFormat:
          type: string
          enum: [JSON, YAML, DMN_XML]
        sourceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceDocument:
          type: string
          description: The source text as received, only with `include=source`
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        createdBy:
          type: [string, 'null']
          description: Who imported the version; neither the author nor the requester may approve it
        createdAt: { type: string, format: date-time }
        allowedActions:
          $ref: '#/components/schemas/AllowedActions'
        definition:
          type: object
          description: The canonical definition, rule-engine/api/schema/rule-set.v1.schema.json
    AllowedActions:
      type: array
      description: |
        Lifecycle actions the caller may take on this version now, from its status, the
        caller's permissions and the four-eyes rule: `request-publish` on a `DRAFT` with
        `rules:author`; `approve` on a `PENDING_APPROVAL` with `rules:approve` when the caller is
        neither the requester nor the author; `reject` on a `PENDING_APPROVAL` with
        `rules:approve` when the caller is not the requester; `withdraw` on a `PENDING_APPROVAL`
        with `rules:author` for its requester only (PD-089), who never gets `approve` or `reject`.
        A hint for screens only: the engine checks again on every command.
      items:
        type: string
        enum: [request-publish, approve, reject, withdraw]
    RuleSetSummary:
      type: object
      required: [ruleSet, latestVersion, latestStatus, publishedVersion, lastChangedAt]
      properties:
        ruleSet: { type: string }
        latestVersion: { type: integer, minimum: 1 }
        latestStatus:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        publishedVersion:
          type: [integer, 'null']
          description: |
            The version evaluation selects at the host clock (DESIGN section 3.3.1, ADR-0025), or
            null when none is in effect. An approved version whose `effectiveFrom` is still in the
            future does not count until that instant.
        lastChangedAt:
          type: string
          format: date-time
          description: The latest creation, request, approval or rejection of any version of the rule set
    RuleSetPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RuleSetSummary'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page
        hasNext:
          type: boolean
          description: True when `nextCursor` is set
    VersionSummary:
      type: object
      required: [ruleSet, version, status, hitPolicy, lockVersion, canonicalHash, createdAt, allowedActions]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        hitPolicy:
          type: string
          enum: [FIRST, UNIQUE, COLLECT]
        effectiveFrom: { type: [string, 'null'], format: date-time }
        lockVersion: { type: integer }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        allowedActions:
          $ref: '#/components/schemas/AllowedActions'
    VersionPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionSummary'
        nextCursor:
          type: [string, 'null']
        hasNext:
          type: boolean
    HistoryEntry:
      type: object
      required: [action, toStatus, actor, lockVersion, occurredAt]
      properties:
        action:
          type: string
          enum: [CREATED, REQUESTED, APPROVED, REJECTED, WITHDRAWN, DRAFT_UPDATED]
        fromStatus:
          type: [string, 'null']
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED, null]
        toStatus:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED]
        actor: { type: string }
        reason:
          type: [string, 'null']
          description: The rejection or withdrawal reason, or the approval comment
        lockVersion: { type: integer }
        occurredAt: { type: string, format: date-time }
        canonicalHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: On `DRAFT_UPDATED` only; the canonical hash after the replacement
        previousCanonicalHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: On `DRAFT_UPDATED` only; the canonical hash before the replacement
    VersionHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the version goes back to its author; stored in the history and the event
    WithdrawRequest:
      type: object
      properties:
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: Optional; why the requester takes the request back. Stored in the history and the event
    FieldChange:
      type: object
      required: [path, from, to, nonAscii]
      properties:
        path:
          type: string
          description: JSON Pointer of the member, relative to the row, the column or the document (`/then/fee`, `/when/tier`, `/type`, `/hitPolicy`)
        from:
          description: The canonical value in `base`, or null when the member is absent there. A money literal in a `then` cell or an output default is `Money`; other cells are their canonical text
        to:
          description: The canonical value in `{version}`, or null when the member is absent there
        nonAscii:
          type: boolean
          description: True when either value holds a character outside printable ASCII or an escaped character such as `\u200B`, so a look-alike is visible to the approver
    ColumnChanges:
      type: object
      required: [added, removed, changed, reordered]
      properties:
        added:
          type: array
          items: { type: string }
          description: Column names only in `{version}`, in its order
        removed:
          type: array
          items: { type: string }
          description: Column names only in `base`, in its order
        changed:
          type: array
          items:
            type: object
            required: [name, fields]
            properties:
              name: { type: string }
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/FieldChange'
        reordered:
          type: boolean
          description: True when the columns both versions have are in a different order
    RowChange:
      type: object
      required: [ruleId, change]
      properties:
        ruleId: { type: string }
        change:
          type: string
          enum: [ADDED, REMOVED, CHANGED, MOVED]
        position:
          type: integer
          minimum: 1
          description: 1-based place in `{version}`; absent on `REMOVED`
        basePosition:
          type: integer
          minimum: 1
          description: 1-based place in `base`; absent on `ADDED`
        moved:
          type: boolean
          description: On `CHANGED` only; true when the row also moved
        fields:
          type: array
          description: On `CHANGED` only, in canonical member order
          items:
            $ref: '#/components/schemas/FieldChange'
    VersionDiff:
      type: object
      required: [ruleSet, version, base, canonicalHash, baseCanonicalHash, sourceHashChanged, effectiveFrom,
        header, inputs, outputs, rows, unchangedCount]
      properties:
        ruleSet: { type: string }
        version: { type: integer, minimum: 1 }
        base: { type: integer, minimum: 1 }
        canonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        baseCanonicalHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        sourceHashChanged:
          type: boolean
          description: True when the source documents differ, even if the canonical models are equal
        effectiveFrom:
          type: object
          required: [from, to]
          description: Version metadata reported beside the content diff
          properties:
            from: { type: [string, 'null'], format: date-time }
            to: { type: [string, 'null'], format: date-time }
        header:
          type: array
          description: Changed document members other than the columns and rules (hit policy, aggregate, time zone, money rounding, expression language, description), in canonical order; empty when none changed
          items:
            $ref: '#/components/schemas/FieldChange'
        inputs:
          $ref: '#/components/schemas/ColumnChanges'
        outputs:
          $ref: '#/components/schemas/ColumnChanges'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowChange'
        unchangedCount:
          type: integer
          minimum: 0
          description: Rows in both versions with the same cells and not moved
    Violation:
      type: object
      required: [ruleId, column, message]
      properties:
        ruleId:
          type: [string, 'null']
          description: The rule (row) the problem is in, or null for a problem outside the rules
        column:
          type: [string, 'null']
          description: The input or output name (column) the problem is in, or null when it concerns the row or the document
        message:
          type: string
          description: The problem, in English, without the rule id and column
    EvaluateRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: object
          description: Input values by name; money as `Money`
          additionalProperties: true
    DecisionResult:
      type: object
      required: [decisionId, ruleSet, version, evaluatedAt, outcome, matchedRuleIds, outputs]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        evaluatedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [MATCHED, NO_MATCH]
          description: A failed evaluation is answered with a Problem instead, carrying decisionId and matchedRuleIds
        matched:
          type: boolean
          description: False for a no-match, where every output is null and matchedRuleIds is empty
        matchedRuleIds:
          type: array
          items: { type: string }
        outputs:
          type: object
          additionalProperties: true
    LoggedDecision:
      type: object
      required: [decisionId, ruleSet, version, hitPolicy, outcome, inputs, matchedRuleIds, evaluatedAt, durationMicros]
      properties:
        decisionId: { type: string }
        ruleSet: { type: string }
        version: { type: integer }
        hitPolicy: { type: string, enum: [FIRST, UNIQUE, COLLECT] }
        outcome:
          type: string
          enum: [OK, UNIQUE_HIT_VIOLATION, EVALUATION_ERROR]
          description: OK with an empty matchedRuleIds is a no-match
        errorCode:
          type: [string, 'null']
          description: |
            Why a decision failed: `EVALUATION_ERROR`, `UNIQUE_HIT_VIOLATION`, or
            `MASKING_KEY_MISSING` when the rule set masks an input and the tenant has no masking
            key, or `MASKED_INPUT_IN_OUTPUT` when an output reads an input masked by the tenant
            default (the decision was refused and no input was logged)
        inputs:
          type: object
          additionalProperties: true
          description: |
            The declared inputs as logged. A masked input with a value is a string
            `hmac:<keyId>:<64 hex digits>`; money is `Money`
        outputs:
          type: [object, 'null']
          additionalProperties: true
        matchedRuleIds:
          type: array
          items: { type: string }
        callerId: { type: [string, 'null'] }
        correlationId: { type: [string, 'null'] }
        evaluatedAt: { type: string, format: date-time }
        durationMicros: { type: integer, format: int64 }
    MaskedInputSearch:
      type: object
      additionalProperties: false
      required: [ruleSet, input, value, from, to]
      properties:
        ruleSet: { type: string }
        input: { type: string, description: The masked input's name }
        value:
          description: The plain value as it was passed to evaluation; a string, number, boolean or `Money`
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
    DecisionSearchResult:
      type: object
      required: [data, truncated]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LoggedDecision'
        truncated:
          type: boolean
          description: True when more decisions match than the limit
    Problem:
      type: object
      required: [type, title, status, code, detail, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [INPUT_INVALID, QUERY_INVALID, UNAUTHENTICATED, PERMISSION_DENIED, TENANT_NOT_ALLOWED,
            SELF_APPROVAL_FORBIDDEN, RULE_SET_NOT_FOUND, VERSION_NOT_FOUND, NO_EFFECTIVE_VERSION, DECISION_NOT_FOUND,
            VERSION_CONFLICT, INVALID_STATE, IDEMPOTENCY_IN_FLIGHT, RULE_SET_EXISTS, VALIDATION_FAILED,
            IDEMPOTENCY_KEY_REUSE_MISMATCH, EVALUATION_ERROR, UNIQUE_HIT_VIOLATION, PAYLOAD_TOO_LARGE,
            PRECONDITION_REQUIRED, INTERNAL_ERROR, SCHEMA_NOT_READY,
            DRAFT_AUTHORING_DISABLED, RATE_LIMITED]
        detail: { type: string }
        correlationId: { type: string }
        violations:
          type: array
          description: |
            Present on `VALIDATION_FAILED` only, with at least one entry. Every cell problem of the
            document is listed, in document order (rule by rule; conditions, then outputs, each as
            written), up to 100 entries, so a screen can mark each cell
            at once; `violationsTruncated` says whether more were found. A problem in the
            document's structure (a missing key, an unknown property) stops reading and is the only
            entry.
          maxItems: 100
          items:
            $ref: '#/components/schemas/Violation'
          example:
            - { ruleId: R3, column: fee, message: 'output fee is money and needs a currency: write 30000 followed by its ISO 4217 currency code' }
        violationsTruncated:
          type: boolean
          description: Present on `VALIDATION_FAILED`; true when the document has more than the 100 problems listed
        decisionId:
          type: string
          description: Present on `EVALUATION_ERROR` and `UNIQUE_HIT_VIOLATION`; the failed decision is logged
        matchedRuleIds:
          type: array
          items: { type: string }
          description: On `UNIQUE_HIT_VIOLATION`, every matched rule (two or more); empty on `EVALUATION_ERROR`
