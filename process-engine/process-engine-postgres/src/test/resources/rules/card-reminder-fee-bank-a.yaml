# Reminder fee for an overdue card fee, as bank-a prices it.
schemaVersion: 1
ruleSet: card-reminder-fee
description: Reminder fee for an overdue card fee
hitPolicy: first

inputs:
  - { name: tier, type: string }

outputs:
  - { name: fee, type: money }

rules:
  - id: R1                  # Gold customers are not charged
    when: { tier: "== 'GOLD'" }
    then: { fee: "0 VND" }
  - id: R2
    when: {}
    then: { fee: "20000 VND" }
