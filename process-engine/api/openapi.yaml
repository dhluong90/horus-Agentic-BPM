openapi: 3.1.0
info:
  title: HORUS Process Engine REST API
  version: 0.2.0
  description: |
    REST API of the Process Engine, served by the host application under `/api/bpm/processes/v1`.
    Preview: this file covers importing a BPMN document, reading and listing definitions, starting, listing,
    reading and cancelling instances, listing, reading, claiming, unclaiming, reassigning, delegating and completing user tasks, the live token
    counts per node and the BPMN export of a version. From 0.2.0
    it also covers the definition lifecycle with four eyes: an import is a `DRAFT`; a person requests
    approval, optionally with an effective date; a second person approves it and it becomes the effective version
    on that date, retiring the previous one; a reject sends it back to `DRAFT` with a reason. The requester can
    never approve (`403 SELF_APPROVAL_FORBIDDEN`), and an older version is never approved over a newer active one
    (`409 VERSION_SUPERSEDED`). An approval names the hash of the content the approver reviewed
    (`expectedDefinitionHash`, PD-139): without it the answer is `400 CONTENT_HASH_REQUIRED`, and when the stored
    content is not the content reviewed it is `409 CONTENT_CHANGED` with the current hash. It also covers the graph
    diff between two stored versions, and migration plans with their dry run; executing a plan follows in a later
    release. It also covers incidents: an operator lists them, retries a failed step, or proposes a resolution that a
    second person approves (PD-126). The pending approvals queue lists the versions that wait for a second person, with the
    hash a reviewer sends back. The remaining endpoints of process-engine/docs/DESIGN.md section 6.2 follow with the
    features that implement them.

    Every body is read and written with the engine's own JSON mapper, so the host's `spring.jackson.*` settings
    never change an engine payload (PRE-045): keys are camelCase and times are ISO 8601 strings in UTC.

    The tenant is never part of a request: it comes from the host's authenticated context (`EngineAccess`). Money is
    `{currency, amount}` with the amount in minor units. Errors are RFC 9457 `application/problem+json`; clients
    branch on `code`. Request bodies are read bounded: a BPMN document above `definitions.max-bytes` (1 MB) or a
    JSON body above 256 KB is `413 PAYLOAD_TOO_LARGE` before it is read. Lists are keyset pages
    `{data, nextCursor, hasNext}`; pass `nextCursor` back unchanged as `cursor`. Cursors are signed for the tenant and
    the list that issued them and name the key that signed them (`horus.bpm.processes.cursor.keys`, AUD-13), so an
    edited, forged, other-tenant or removed-key cursor, or one issued before key ids existed, is `400 QUERY_INVALID`.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
servers:
  - url: /api/bpm/processes/v1
security:
  - hostAuth: []
tags:
  - name: signals
    description: Broadcast a signal within the tenant
  - name: definitions
    description: Import, list and read BPMN process definitions
  - name: lifecycle
    description: Request, approve, reject and retire definition versions, with four eyes
  - name: instances
    description: Start, list, read and cancel process instances
  - name: tasks
    description: List, read, claim, unclaim, reassign, delegate and complete user tasks
  - name: async-steps
    description: Report the result of a remote step whose adapter handed the call off
  - name: messages
    description: Deliver a message to the process instance that waits for it, or start the process it names
  - name: agent-replays
    description: Replay recorded agent answers against a candidate guardrail or output schema
  - name: migrations
    description: Plan moving running instances to another version, check it with a dry run, and run it with a second person's approval
  - name: incidents
    description: List incidents, retry a failed step, and resolve one with a second person's approval
  - name: calendars
    description: Read the tenant's business calendars, propose a change, and approve or reject it as a second person
  - name: step-catalogue
    description: List the steps, rule sets, calendars and roles the host registered, for the modeller
paths:
  /approvals:
    get:
      tags: [lifecycle]
      operationId: listPendingApprovals
      summary: List the proposals waiting for a second person (definition versions, migration plans, calendar changes), oldest first
      description: |
        The pending approvals queue of the caller's tenant (#31, `PRE-190`): every definition version in
        `PENDING_APPROVAL` across all keys, including one that is not the latest version of its key, and, since #473,
        every migration plan whose execution is `PROPOSED` and every calendar change that is `PENDING`. `kind` says which
        (`DEFINITION`, `MIGRATION_PLAN`, `CALENDAR_CHANGE`), `id` is the id of the version, plan or change. Migration
        plans are listed only for a caller holding `processes:migration:manage`; calendar changes only for a caller holding
        `processes:calendar:manage` (AUD-07); definition versions for any caller holding `processes:read`, with
        `PERMISSION_REQUIRED` where the caller may not decide.
        A proposer never has `approve` (`SELF_APPROVAL_FORBIDDEN`). Permission
        `processes:read`; the answer shows what the caller may do, it does not need `processes:approve`. Ordered by
        `(requestedAt, id)`, keyset-paged with a signed cursor bound to the tenant and this list; at most
        `query.max-page-size` (200) per page, 50 by default. A cursor from another list, another tenant or an edited
        one is `400 QUERY_INVALID`.

        Each item has what a reviewer needs to open it and to approve exactly the content that was reviewed
        (`PRE-177`, PD-139): the `contentHash` to send back (a definition: `expectedDefinitionHash`, equal to
        `definitionHash`; a migration plan: `expectedPlanHash` on `:approve`, the plan hash; a calendar change:
        `expectedChangeHash` on `:approve`, the hash of the key, the base version and the proposed calendar) and the
        `lockVersion` to send as `If-Match` (for a calendar change, the version it was proposed against). Items never
        carry the definition, the source, a calendar's hours or a variable. `reason` is what the proposer wrote.

        `allowedActions` is what the caller may send now, in the order `approve`, `reject`, `withdraw`. `withdraw` is offered to the requester of a definition version. `deniedActions` gives, for
        `approve` and `reject` only, why the caller may not send one, as a code: `PERMISSION_REQUIRED` (no
        `processes:approve`) or `SELF_APPROVAL_FORBIDDEN` (the caller requested the version, or made it under
        `lifecycle.approver-must-differ-from: makers`; a maker may still reject). An action in `allowedActions` has no
        entry. The commands check again and stay the authority. Writes nothing.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of pending versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingApprovalPage' }
              example:
                data:
                  - kind: DEFINITION
                    id: 01KB2R6Q3C0000000000000001
                    key: kyc-onboarding
                    name: KYC onboarding
                    version: 2
                    sourceVersion: null
                    definitionHash: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
                    contentHash: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
                    reason: null
                    lockVersion: 1
                    requestedBy: alice
                    requestedByName: Nguyễn Thị Alice
                    requestedAt: '2027-04-05T03:30:00Z'
                    allowedActions: []
                    deniedActions: { approve: SELF_APPROVAL_FORBIDDEN, reject: SELF_APPROVAL_FORBIDDEN }
                nextCursor: null
                hasNext: false
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions:
    post:
      tags: [definitions]
      operationId: importDefinition
      summary: Import a BPMN 2.0 document as the next version of its process key
      description: |
        Reads the executable subset (none start and end events, local `serviceTask`, remote `serviceTask`
        (`horus:mode="remote"`, optional `horus:timeout`, run as an Async Wait-State), `businessRuleTask`,
        `userTask` with `horus:resultVariable`, `exclusiveGateway` with conditions and a default flow, and an
        intermediate timer catch event with `timeDuration` or `timeDate`) from a UTF-8
        document. DTDs and entities are refused (`BPMN_UNSAFE_XML`), a CMMN root element is
        `422 CMMN_UNSUPPORTED` before any other check (`PRE-107`), every element or behaviour attribute outside
        the subset is named with its id, line and stage in `unsupportedElements` of `BPMN_UNSUPPORTED_ELEMENT`
        (`PRE-108`, PD-141: the same field and item shape as the Rule Engine), and a condition in another
        expression language is listed there too. Vendor attributes and extensions are kept in the stored source and
        listed as `warnings`, in a refusal and in the `201` answer (`PRE-204`). The version is `DRAFT`, or `ACTIVE` only with dev auto-approval. A
        document identical to the latest version of its key returns that version, also with `201`. A draft is never
        the effective version: instances keep starting on the active one until the draft is approved. An `agentTask`
        whose guardrail rule set breaks the guardrail contract (missing in the tenant or without a version in effect,
        hit policy other than `first` or `unique`, no `allow: boolean` output, `reasons` other than a string, or an
        input the output schema does not declare) is `422 GUARDRAIL_CONTRACT_INVALID`, with `problems` naming the
        step and the failed check; nothing is written. A `serviceTask` whose `horus:mode` is neither `local` nor
        `remote` (`MODE_INVALID`), or a local one with `horus:timeout` (`TIMEOUT_INVALID`), is `422
        VALIDATION_FAILED` with the step id and line (`PRE-072`). The handler or adapter a service step names need
        not be registered yet, so a pipeline can import a draft before the host registers it; the names are checked
        at request-approval and approval, and at import only when dev auto-approval activates the version.
        Permission `processes:deploy`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/xml:
            schema: { type: string }
          text/xml:
            schema: { type: string }
          application/bpmn+xml:
            schema: { type: string }
      responses:
        '201':
          description: The stored version
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    get:
      tags: [definitions]
      operationId: listDefinitions
      summary: List the definition keys of the tenant
      description: |
        One item per key, ordered by key: the latest version and its status, the version a start uses now, and the
        time of the last change. Stopped after `query.statement-timeout` (two seconds) as `503 QUERY_TIMEOUT`, with no
        partial page. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummaryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:
    get:
      tags: [definitions]
      operationId: getDefinitionVersion
      summary: Read one version of a definition
      description: |
        Status, hashes, approval and lifecycle fields of the version. With `include=source` the answer also carries
        `sourceDocument`, the original imported text exactly as it was posted (PRE-039); the same integrity check as a
        run applies first, so a stored source that no longer gives its recorded hashes is
        `500 DEFINITION_INTEGRITY_FAILED` (PRE-048) and any other `include` value is `400 INPUT_INVALID`. The `ETag` is the definition hash, quoted; with `include=source` it is the definition hash followed by `-source`, quoted, because the body differs and a cache must not mix the two; the lifecycle commands take the `lockVersion` field as
        `If-Match`. Another tenant's version is `404 DEFINITION_NOT_FOUND`. Permission `processes:read`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: include
          in: query
          required: false
          description: "`source` adds `sourceDocument`, the original imported text"
          schema: { type: string, enum: [source] }
      responses:
        '200':
          description: The version
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/history:
    get:
      tags: [lifecycle]
      operationId: getDefinitionHistory
      summary: Lifecycle history of a definition version, oldest first
      description: Append-only; one entry per import, request, approval, reject and retirement. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
      responses:
        '200':
          description: The history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DefinitionHistoryEntry' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:request-approval:
    post:
      tags: [lifecycle]
      operationId: requestDefinitionApproval
      summary: Request approval of a draft
      description: |
        `DRAFT` to `PENDING_APPROVAL`; the caller is recorded as requester and can never approve this version.
        `effectiveFrom` is when the version should take effect once approved; omitted means at approval; a time in
        the past is `400 INPUT_INVALID`. A version that is not a draft is `409 INVALID_STATE`. Publishes
        `processes.definition.publish-requested.v1`. The guardrail contract of every `agentTask` is checked again
        against the rule set version in effect now (`422 GUARDRAIL_CONTRACT_INVALID`, nothing written). Every
        handler and adapter a service step names must be registered in this host: otherwise `422
        VALIDATION_FAILED` with one problem per step naming `step -> name` (`HANDLER_NOT_REGISTERED`,
        `ADAPTER_NOT_REGISTERED`), and the version stays `DRAFT` (`PRE-072`). Every `role:` an escalation level names must
        be in the tenant's role list when the host registers a `RoleCatalogue` (`ESCALATION_ROLE_UNKNOWN`, naming the
        step and the role; `PRE-180`); a host without one is not checked. A declared form must still be usable:
        a registered key or schema path, a schema and hints in the task-form subset, and a link that is relative
        or on an origin of `tasks.form-link-origins` (`FORM_NOT_REGISTERED`, `FORM_SCHEMA_INVALID`,
        `FORM_HINTS_INVALID`, `FORM_LINK_NOT_ALLOWED`; `PRE-219`). Permission `processes:author` or
        `processes:deploy`. The answer lists in `warnings` each agent step field that declares no `mask`
        (`UNCLASSIFIED_FIELD`, PD-146, `PRE-205`); the warnings never block the request.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - $ref: '#/components/parameters/IfMatchDefinition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                effectiveFrom: { type: [string, 'null'], format: date-time }
            example: { effectiveFrom: '2027-04-01T00:00:00+07:00' }
      responses:
        '200': { $ref: '#/components/responses/Definition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:approve:
    post:
      tags: [lifecycle]
      operationId: approveDefinition
      summary: Approve a pending version as a second person
      description: |
        `PENDING_APPROVAL` to `ACTIVE`. The requester, and under the default `horus.bpm.lifecycle.approver-must-differ-from:
        makers` also the importer, is refused with `403 SELF_APPROVAL_FORBIDDEN` and nothing is written. A newer version of the key already active is `409 VERSION_SUPERSEDED`, and the version stays
        pending. The version is the effective one from its `effectiveFrom` (or now); at that time every older active
        version of the key is retired, once, with `processes.definition.retired.v1` and `supersededBy`. Running
        instances keep their version. Publishes `processes.definition.approved.v1`. The guardrail contract of every
        `agentTask` is checked again, as at import (`422 GUARDRAIL_CONTRACT_INVALID`; the version stays pending).
        The handlers and adapters of service steps are checked again as at request-approval (`422
        VALIDATION_FAILED`; the version stays pending). Permission `processes:approve`.

        The approval is bound to the content the approver reviewed (PRE-177, PD-139). `expectedDefinitionHash` is the
        `definitionHash` of the version as the approver saw it. While `horus.bpm.processes.approval.require-content-hash`
        is `true` (the default; `false` is accepted on the `dev` profile only) an approval without it is
        `400 CONTENT_HASH_REQUIRED` and nothing is read. When the stored content is not the content reviewed the
        answer is `409 CONTENT_CHANGED` with `currentDefinitionHash` and `currentLockVersion`, and nothing is written,
        published or recorded; the check runs after the status, four-eyes and lock-version checks. The approval's
        history row and `processes.definition.approved.v1` record `reviewedDefinitionHash`. A change list between two
        versions that was cut off at its limit carries no hash that may be approved: the diff then has
        `approvableHash: null` and no `definitionHash` on either side, and an approval naming a hash is
        `409 CHANGE_SET_TRUNCATED` when the change list from the effective version to this one is cut off; nothing is
        written.

        A change set of more than 1,000 changed values is read page by page (`limit` and `cursor` on the diff,
        PRE-201). The last page carries `changeSetHash`, the hash of the whole set; sending it as
        `expectedChangeSetHash` next to `expectedDefinitionHash` makes the version approvable outside `dev` (PRE-202).
        Without it the answer stays `409 CHANGE_SET_TRUNCATED`; with a hash that is not the hash of the change set
        now (the version or the effective version changed after the review) it is `409 CONTENT_CHANGED` with
        `currentChangeSetHash`. For a change set within 1,000 values the field is optional and checked when sent.
        The history row and the event record `reviewedChangeSetHash`.

        Every `role:` an escalation level names must be in the tenant's role list when the host registers a
        `RoleCatalogue`; an unknown one is `422 VALIDATION_FAILED` with a problem `ESCALATION_ROLE_UNKNOWN` naming the
        step and the role, and nothing is written (PRE-180). A host without a catalogue is not checked.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - $ref: '#/components/parameters/IfMatchDefinition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedDefinitionHash:
                  type: [string, 'null']
                  pattern: '^[0-9a-f]{64}$'
                  description: >-
                    The `definitionHash` of the version the approver reviewed; required while
                    `approval.require-content-hash` is on. Not 64 lower-case hexadecimal characters is
                    `400 INPUT_INVALID`
                expectedChangeSetHash:
                  type: [string, 'null']
                  pattern: '^[0-9a-f]{64}$'
                  description: >-
                    The `changeSetHash` on the last page of the diff the approver read; required when the change set
                    has more than 1,000 changed values (PRE-202). Not 64 lower-case hexadecimal characters is
                    `400 INPUT_INVALID`
                comment: { type: [string, 'null'], maxLength: 2000 }
            example:
              expectedDefinitionHash: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
              comment: Reviewed with the credit committee, memo CC-118
      responses:
        '200': { $ref: '#/components/responses/Definition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:reject:
    post:
      tags: [lifecycle]
      operationId: rejectDefinition
      summary: Send a pending version back to draft with a reason
      description: |
        `PENDING_APPROVAL` to `DRAFT`; the reason is stored as `decisionComment` and in the history. A missing or
        blank reason is `400 INPUT_INVALID`. The requester cannot reject their own request
        (`403 SELF_APPROVAL_FORBIDDEN`; the detail points to `:withdraw`). Publishes `processes.definition.rejected.v1`. Permission
        `processes:approve`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - $ref: '#/components/parameters/IfMatchDefinition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
            example: { reason: missing fraud check }
      responses:
        '200': { $ref: '#/components/responses/Definition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:withdraw:
    post:
      tags: [lifecycle]
      operationId: withdrawDefinition
      summary: The requester takes a pending version back to draft
      description: |
        `PENDING_APPROVAL` to `DRAFT`, only by the identity that requested approval (permission `processes:author` or
        `processes:deploy`); anyone else is `403 PERMISSION_DENIED`, a version that is not pending is `409 INVALID_STATE`.
        Unlike `:reject` it records no rejection: the history row is `WITHDRAWN`, `decisionComment` stays empty and the
        request is cleared. `If-Match` (the `lockVersion`) is required; a stale one is `409 VERSION_CONFLICT`. A replay
        of the same `Idempotency-Key` returns the first answer and writes nothing. Publishes
        `processes.definition.withdrawn.v1` (PRE-052).
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - $ref: '#/components/parameters/IfMatchDefinition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
            example: { reason: wrong form attached }
      responses:
        '200': { $ref: '#/components/responses/Definition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}:retire:
    post:
      tags: [lifecycle]
      operationId: retireDefinition
      summary: Retire an active version or withdraw a draft
      description: |
        `ACTIVE` (permission `processes:approve`, `reason` required) or `DRAFT` (permission `processes:author`) to
        `RETIRED`. A pending or retired version is `409 INVALID_STATE`, and so is an active version that a newer
        version in effect already supersedes: its effective-date job retires it, and the detail names the newer
        version. Retiring stops new starts only; running
        instances keep their version. The mode is `horus.bpm.lifecycle.retire-approval: single` and is recorded on the
        history row and the event. Retiring the last version in effect of the key needs `confirmNoVersionInEffect:
        true` under `horus.bpm.lifecycle.retire-last-version: confirm` (the default), and is always refused under
        `refuse`: `409 LAST_VERSION_IN_EFFECT`, naming what stops working. Publishes
        `processes.definition.retired.v1` with `reason`, `approvalMode` and `noVersionInEffect`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - $ref: '#/components/parameters/IfMatchDefinition'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 2000 }
                confirmNoVersionInEffect: { type: boolean, default: false }
            example: { reason: fraud check bypass found, confirmNoVersionInEffect: true }
      responses:
        '200': { $ref: '#/components/responses/Definition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/node-stats:
    get:
      tags: [definitions]
      operationId: getNodeStats
      summary: Live tokens or hourly figures per node of one definition version
      description: |
        Counts the live tokens (`ACTIVE`, `WAITING_USER`, `WAITING_ASYNC`, `WAITING_TIMER`, `WAITING_EVENT`, `WAITING_CHILD`) at each
        node of the version, in the caller's tenant only, from the live token index and never from history
        (PRE-028). A node without live tokens is absent. Each replica caches an answer for `stats.live-cache-ttl`
        (5 seconds), or `stats.live-cache-ttl-large` (15 seconds) when the version had more than
        `stats.live-cache-large-threshold` (100,000) live tokens; a cached answer keeps its `asOf`. A version that
        does not exist in the caller's tenant is `404 DEFINITION_NOT_FOUND`, also when it exists in another tenant.
        `mode=window` returns counts and typical durations per node over whole hours, read from the hourly rollup of
        the caller's tenant and never from history (PRE-029): entered, completed, failed, incidents, SLA breaches, the
        mean, and the median and 95th percentile within 19 percent. The range `from` to `to` (default: the 24 hours
        before now) is widened to whole hours and may be at most `query.max-range` (31 days), otherwise
        `400 QUERY_INVALID`. The answer names the rollup watermark (`asOf`) and how far behind it is (`lagSeconds`),
        which is at most about ten minutes while the rollup runs. A node with no activity in the window is absent.
        Open incidents per node follow with the incident table. Permission `processes:read`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: mode
          in: query
          required: false
          description: Any other value is `400 INPUT_INVALID`
          schema: { type: string, enum: [live, window], default: live }
        - name: from
          in: query
          required: false
          description: Start of the window, `mode=window` only; widened down to the hour. Default 24 hours before `to`
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: End of the window, `mode=window` only; widened up to the hour. Default now
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The live counts
          headers:
            ETag:
              description: The `asOf` time in epoch milliseconds, quoted; unchanged while the answer is cached
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NodeCounts'
                  - $ref: '#/components/schemas/NodeWindowStats'
              examples:
                live:
                  value:
                    definitionKey: kyc-onboarding
                    version: 2
                    mode: live
                    asOf: '2026-11-20T09:30:00Z'
                    nodes:
                      approve: { WAITING_USER: 40 }
                      assess-documents: { WAITING_ASYNC: 7 }
                window:
                  value:
                    definitionKey: kyc-onboarding
                    version: 2
                    mode: window
                    from: '2026-11-20T10:00:00Z'
                    to: '2026-11-20T11:00:00Z'
                    asOf: '2026-11-20T10:50:00Z'
                    lagSeconds: 600
                    nodes:
                      approve: { entered: 1200, completed: 1200, failed: 0, incidents: 0, slaBreaches: 0, meanMs: 5400000, p50Ms: 4800000, p95Ms: 9900000 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/diff:
    get:
      tags: [definitions]
      operationId: getDefinitionDiff
      summary: Steps and links added, removed and changed between two versions
      description: |
        Compares two stored versions of one key in the caller's tenant (PRE-025, PRE-176), computed by the engine
        from the stored, hash-checked definitions of any lifecycle status, so an approver can compare a pending
        version with the effective one before signing. A document sent by the client is never compared. Steps are
        matched by BPMN id and compared on their canonical form, the form that is hashed and approved; a changed
        value is listed with its JSON Pointer `path` inside the step and its old and new value. Links are matched by
        `(from, to, kind)`, where `kind` is `next`, `branch[i]` (the i-th conditional branch of an exclusive gateway,
        from 0), `default` or `fork`. Every element carries its BPMN id and readable name. Layout is never part of
        the diff and no XML is returned. Every list is sorted, so the same two versions always give the same body.
        At most 1,000 changed values are listed, with `truncated: true` beyond. `approvableHash` is the target's
        `definitionHash`, the value an approval names after this review (PD-139); a truncated diff is not a complete
        review, so it has `approvableHash: null` and omits `definitionHash` on both sides.

        `base` defaults to the effective version of the key; without one the answer is `404 NO_EFFECTIVE_VERSION`.

        With `limit` or `cursor` the whole change set is read, page by page (PRE-201, #426): a window of at most
        `limit` changes (500; 200 when absent) of one ordered sequence (steps added, steps removed, changed values,
        links added, links removed), each change on exactly one page and none cut off, `truncated` always false. The
        answer has `page` (`offset`, `total`, `nextCursor`). Both definition hashes, `approvableHash` and
        `changeSetHash` are present on the last page only, so an approver gets them by reading every page in order:
        each cursor carries a digest of everything before it, and a cursor this change set did not issue is
        `400 QUERY_INVALID`. `changeSetHash` covers both definition hashes and every change of the whole set; send it
        as `expectedChangeSetHash` when approving (PRE-202). Without `limit` and `cursor` the read is as before, cut off
        at 1,000 changed values with no approvable hash.

        A version that does not exist in the caller's tenant is `404 DEFINITION_NOT_FOUND`, also when it exists in
        another tenant. Read-only. Permission `processes:read`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
          example: kyc-onboarding
        - name: version
          in: path
          required: true
          description: The version compared to
          schema: { type: integer, minimum: 1 }
          example: 2
        - name: base
          in: query
          required: false
          description: The version compared from; the effective version when absent
          schema: { type: integer, minimum: 1 }
          example: 1
        - name: limit
          in: query
          required: false
          description: Changes per page, 1 to 500; with it or `cursor` the read is paged (PRE-201)
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          required: false
          description: The `page.nextCursor` of the previous page; absent for the first page
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: An `ETag` of an earlier answer; when it still matches, the answer is `304` without a body
          schema: { type: string }
      responses:
        '200':
          description: The diff
          headers:
            ETag:
              description: Derived from the definition hashes of both versions, quoted
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphDiff' }
              example:
                definitionKey: kyc-onboarding
                base: { version: 1, status: ACTIVE, definitionHash: 3f1c0b9e5d7a4b2c8e6f0a1d2c3b4a5968778695a4b3c2d1e0f9a8b7c6d5e4f3 }
                target: { version: 2, status: PENDING_APPROVAL, definitionHash: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b }
                identical: false
                nodesAdded: [{ id: fraud-check, name: Fraud check, type: serviceTask }]
                nodesRemoved: []
                nodesChanged: [{ id: approve, name: Approve, type: userTask, path: /assignee/role, from: ops, to: credit-officer }]
                edgesAdded:
                  - { id: verify__fraud, from: verify-docs, fromName: Verify documents, to: fraud-check, toName: Fraud check, kind: next }
                  - { id: fraud__approve, from: fraud-check, fromName: Fraud check, to: approve, toName: Approve, kind: next }
                edgesRemoved:
                  - { id: verify__approve, from: verify-docs, fromName: Verify documents, to: approve, toName: Approve, kind: next }
                truncated: false
        '304':
          description: The `If-None-Match` value still matches; no body
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/layout:
    get:
      tags: [definitions]
      operationId: getDefinitionLayout
      summary: Read the diagram layout of a version
      description: |
        The latest layout revision of a version of any status in the caller's tenant, or revision `revision` when it
        is named (PRE-026). The layout is stored apart from the definition and never part of its hash. The `ETag` is
        the revision, quoted; a version that has no layout answers `204` with `ETag: "0"`, so the first save sends
        `If-Match: "0"` and a client draws the version with automatic layout. A revision that does not exist is
        `404 LAYOUT_NOT_FOUND`; another tenant's version is `404 DEFINITION_NOT_FOUND`. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - name: revision
          in: query
          required: false
          description: A revision number, from 1. Absent means the latest. Anything else is `400 QUERY_INVALID`.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The revision with its layout document
          headers:
            ETag: { schema: { type: string }, description: 'The revision, quoted' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutRevision' }
        '204':
          description: The version has no saved layout
          headers:
            ETag: { schema: { type: string, example: '"0"' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    put:
      tags: [definitions]
      operationId: saveDefinitionLayout
      summary: Save a new layout revision
      description: |
        Appends a revision to the layout of a version of any status (PRE-026, ADR-0013). It needs no approval and it
        never writes the definition: the version's status, `definitionHash` and `lockVersion` are unchanged. It is
        allowed while `authoring.cockpit-drafts` is `false`, because a layout is not a draft. The body is the layout
        document (`definition-layout.v1`, at most 256 KB). It may list a subset of the steps. A step id that is not in
        the definition, or a document that breaks the schema, is `422 LAYOUT_INVALID` with each problem in `paths`
        (never a value) and nothing is written. `If-Match` is the revision the client saw, quoted, `"0"` when none:
        a stale value, or a save that lost a race, is `409 VERSION_CONFLICT`; missing is `428 PRECONDITION_REQUIRED`.
        A repeat with the same `Idempotency-Key` returns the first answer. The revision records who saved it and
        when; revisions are never changed or deleted. Publishes `processes.definition.layout-saved.v1`. Another
        tenant's version is `404 DEFINITION_NOT_FOUND`. Permission `processes:author`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - name: If-Match
          in: header
          required: true
          description: The latest revision the client saw, quoted; `"0"` for a version without a layout.
          schema: { type: string, example: '"3"' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionLayout' }
            example:
              schemaVersion: 1
              direction: LR
              nodes:
                start: { x: 40, y: 120 }
                verify-docs: { x: 200, y: 100, width: 140, height: 80 }
      responses:
        '200':
          description: The saved revision
          headers:
            ETag: { schema: { type: string }, description: 'The new revision, quoted' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutRevision' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/layout/revisions:
    get:
      tags: [definitions]
      operationId: listDefinitionLayoutRevisions
      summary: List the layout revisions of a version
      description: |
        Every revision with its author and time, oldest first, without the layout documents; read one with
        `GET .../layout?revision=n`. Keyset-paged by revision: pass `nextAfter` as `after`. Another tenant's version is
        `404 DEFINITION_NOT_FOUND`. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/DefinitionKey'
        - $ref: '#/components/parameters/DefinitionVersionNumber'
        - name: after
          in: query
          required: false
          description: List the revisions after this one; 0 when absent.
          schema: { type: integer, minimum: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of revisions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutRevisionPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /definitions/{key}/versions/{version}/export:
    get:
      tags: [definitions]
      operationId: exportDefinition
      summary: Export a definition version as BPMN 2.0 XML
      description: |
        Writes the version of the caller's tenant in the executable subset with the `horus` extension attributes and
        a generated BPMNDI layout, so it opens in BPMN modellers. Importing the document gives the same
        `definitionHash` (PRE-034), which is also the `ETag`. The stored source is read again and must still give
        the recorded hash (`500 DEFINITION_INTEGRITY_FAILED` otherwise). Read-only. A version of another tenant is
        `404 DEFINITION_NOT_FOUND`, the same answer as a missing one. Permission `processes:read`.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
          example: card-fee-review
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          example: 1
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [bpmn] }
      responses:
        '200':
          description: The BPMN document
          headers:
            ETag:
              description: The `definitionHash` of the version, quoted
              schema: { type: string }
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="card-fee-review-v1.bpmn"' }
          content:
            application/bpmn+xml:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /instances:
    get:
      tags: [instances]
      operationId: listInstances
      summary: List the instances of the tenant, newest first
      description: |
        Filters: `status` (one or more, comma separated; `RUNNING` when absent), `definitionKey`, and a start-time
        range `startedFrom` (inclusive) to `startedTo` (exclusive) of at most `query.max-range` (31 days). With only
        one bound the other is that range away; with neither the list is not limited in time. Ordered by `startedAt`
        then `id`, both descending. Items carry no variables, tokens or tasks; read one instance for those.
        The read runs in its own read-only transaction and is stopped after `query.statement-timeout` (two seconds),
        answered `503 QUERY_TIMEOUT` with no partial page; narrow the filter or try again. A page with `nextCursor` has
        more items; a page without it is complete.
        Permission `processes:read`.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, example: 'RUNNING,COMPLETED' }
        - name: definitionKey
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
        - name: startedFrom
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: startedTo
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of instances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceSummaryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      tags: [instances]
      operationId: startInstance
      summary: Start an instance on the effective version of a process key
      description: |
        Runs every synchronous step up to the first user task or the end in one transaction, local service
        handlers included; a remote step parks on the async wait-state and its call runs later with no transaction
        open (`PRE-070`). A step that fails rolls everything back (`422 STEP_FAILED`, with `nodeId` and `reason`).
        A local handler that throws rolls back everything it and the earlier steps wrote and is `500 INTERNAL` with
        a `correlationId` only, never the exception text (`PRE-071`). A request needs a `businessKey` or
        an `Idempotency-Key` (`428 PRECONDITION_REQUIRED` without either), so a retry can never start a second
        instance. An instance that already exists for the business key is returned with `200`; a new one with
        `201`; a replay of the same `Idempotency-Key` returns the first answer. For an existing instance a caller
        with `processes:read` gets the whole instance; a caller with `processes:start` only gets `id`, `status` and
        `created: false`, never its variables, tokens or tasks (`PRE-356`). Variables a task form marks
        `"mask": true` are `***` in every answer that carries an instance (`PRE-357`). Permission `processes:start`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartRequest' }
            example:
              definitionKey: card-fee-review
              businessKey: APP-1002
              variables: { applicationId: APP-1002, customerId: C-002 }
      responses:
        '200':
          description: >-
            An instance with the business key already exists: the whole instance for a caller with
            `processes:read`, otherwise only its `id`, `status` and `created: false`
          headers:
            ETag:
              description: The instance's `lockVersion`, quoted; absent in the short answer.
              schema: { type: string }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ProcessInstance' }
                  - { $ref: '#/components/schemas/ExistingInstanceSummary' }
        '201':
          $ref: '#/components/responses/Instance'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /instances/{id}:
    get:
      tags: [instances]
      operationId: getInstance
      summary: Read an instance with its execution tree and tasks
      description: |
        A variable that a task form of the definition marks `"mask": true` is returned as `***` (`PRE-357`). The
        other variables are returned as they are. Permission `processes:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /instances/{id}/activities:
    get:
      tags: [instances]
      operationId: getInstanceActivities
      summary: Read what happened at each step of one instance
      description: |
        Per step the instance entered: when it was first entered and last left, the duration between them (null until
        it completes), the attempts (its entries, or its distinct attempts when a remote step retried), the last
        identity that acted on it (null for engine steps) and its open incident; then the history entries in time
        order, at most `limit`, with `hasMore`. History is read only between the instance's `startedAt` and `endedAt`
        (no upper bound while it runs), so PostgreSQL scans only the monthly partitions the instance lived in
        (PRE-027, ADR-0015). No variable or input value is returned, so a masked input never appears. The `ETag`
        is a hash of the body; a matching `If-None-Match` gets `304` with no body. Another tenant's instance is
        `404 INSTANCE_NOT_FOUND`. Permission `processes:read`. Writes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - name: limit
          in: query
          required: false
          description: Most history entries to return, 1 to `query.max-page-size`; 200 when absent
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The activities
          headers:
            ETag:
              description: A hash of the body, quoted; send it as `If-None-Match`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceActivities' }
        '304':
          description: Unchanged since the `ETag` sent in `If-None-Match`; no body
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /instances/{id}:cancel:
    post:
      tags: [instances]
      operationId: cancelInstance
      summary: Cancel a running instance
      description: |
        Cancels every live token and open task of the instance in one transaction, writes the `INSTANCE_ENDED`
        history entry and hands `processes.instance.cancelled.v1` to the host publisher, both carrying the actor and
        the reason. Only a `RUNNING` instance can be cancelled (`409 INVALID_STATE`). A `COMPENSATING` instance is
        refused the same way, with a detail that says a compensation is running: an undo is never abandoned half way,
        so an operator resolves its incidents first (PRE-076). Permission `processes:cancel`, which
        `processes:start` does not grant (PD-103). Cancel makes no adapter call and runs no compensation; compensation
        on cancel is planned for 1.2.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - name: If-Match
          in: header
          required: true
          description: |
            The instance's `lockVersion` (its `ETag`), quoted. Missing is `428 PRECONDITION_REQUIRED`; stale is
            `409 VERSION_CONFLICT`.
          schema: { type: string, example: '"2"' }
        - name: Idempotency-Key
          in: header
          required: true
          description: Required; missing is `428 PRECONDITION_REQUIRED`. See the IdempotencyKey parameter.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Required; at most `lifecycle.reason-max-length` (2,000) characters. Missing or blank is `400 INPUT_INVALID`
            example: { reason: Customer withdrew the card application }
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /instances/{id}:start-ad-hoc-activity:
    post:
      tags: [instances]
      operationId: startAdHocActivity
      summary: Start an enabled activity of an ad-hoc sub-process
      description: |
        An ad-hoc sub-process has activities with no sequence flow between them; the host starts each one. The
        activity must stand in the open sub-process named by `scopeTokenId` (a `SCOPE` token of the instance on the
        ad-hoc node). With `ordering` Sequential no other activity of it may be running; with Parallel any number may.
        An activity that is not enabled is refused with `422 STEP_FAILED` and the code `ACTIVITY_NOT_ENABLED` (or
        `ACTIVITY_NOT_FOUND`). When an activity ends the `completionCondition` is asked; true ends the sub-process
        and the flow goes on. Only a `RUNNING` instance (`409 INVALID_STATE`). Permission `processes:task:manage`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - name: If-Match
          in: header
          required: true
          description: The instance's `lockVersion` (its `ETag`), quoted. Missing is `428 PRECONDITION_REQUIRED`; stale is `409 VERSION_CONFLICT`.
          schema: { type: string, example: '"2"' }
        - name: Idempotency-Key
          in: header
          required: true
          description: Required; missing is `428 PRECONDITION_REQUIRED`. See the IdempotencyKey parameter.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopeTokenId, activityId]
              properties:
                scopeTokenId: { type: string, description: The scope token of the open ad-hoc sub-process }
                activityId: { type: string, description: The id of the activity to start }
            example: { scopeTokenId: 01JD0000000000000000000001, activityId: check-id }
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /signals:
    post:
      tags: [signals]
      operationId: broadcastSignal
      summary: Broadcast a signal to the waiting instances of the tenant
      description: |
        Wakes every instance of the caller's tenant that waits at an intermediate signal catch event of this name,
        and starts the effective version of every definition of the tenant whose start event is a signal start event
        of this name. A signal never reaches another tenant: the tenant is the authenticated one and a tenant in the
        body is never read. The answer is `202`: the call writes the signal and one wake-up job for each waiter in one
        transaction and locks no waiting instance; each waiter continues when its job fires, in a transaction of its
        own. The signal carries no data into the instances. A waiter is woken at most once. An instance that throws
        a signal with an intermediate signal throw event or a signal end event does the same in its own transaction
        and records `SIGNAL_THROWN` with the number of waiters in its history. Needs an `Idempotency-Key` (`428
        PRECONDITION_REQUIRED` without one); a replay of the key returns the first answer and wakes nobody again.
        A signal start event whose process also holds a message catch event gives the new instance no business key to
        correlate under: that start is refused with `422 STEP_FAILED`, reason `CORRELATION_KEY_REQUIRED`, and the whole
        broadcast rolls back. Permission `processes:signal:broadcast`.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$'
                  description: The signal name, as written in the definitions
            example: { name: rate-card-updated }
      responses:
        '202':
          description: The signal is written and its waiters are woken by jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignalBroadcast' }
              example:
                signalId: 01JD7Q3V8K2M5N9P0R4S6T8WXY
                name: rate-card-updated
                waiters: 3
                startedInstances: []
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /async-steps/{jobId}:complete:
    post:
      tags: [async-steps]
      operationId: completeAsyncStep
      summary: Report the result of a remote step attempt
      description: |
        For a remote `serviceTask` whose `ServiceAdapter` answered `Accepted`: the remote side, or the host service
        that receives its callback, reports the result of the attempt it was given. Recorded in one transaction, and
        only while the attempt is current: the job is `CLAIMED` under that attempt and its lease (step timeout plus
        `jobs.lease-margin`) has not ended (ADR-0008). The caller presents the attempt id and the attempt's
        `completionToken` (`AdapterCall.completionToken`); the attempt id is derived from public ids and is not a
        credential, and a token that does not match the attempt is `403 PERMISSION_DENIED` with nothing written. A
        repeat of an accepted result answers `DUPLICATE` and writes nothing. A result after the lease ended or after another attempt took
        the step over answers `DISCARDED` and changes nothing; for a cancelled instance it also records
        `LATE_RESULT_DISCARDED`, once per job however often it is repeated. A failed result makes the job due again after `jobs.retry-backoff` times the attempt,
        with a new attempt id, until `jobs.max-attempts`; a business error or a failure with `retryable: false` fails
        the job; `retryable` and the reporting caller are recorded in history. Permission `processes:step:complete`,
        plus one of the roles `horus.bpm.processes.adapters.completer-roles` lists for the step's adapter, otherwise
        `403 PERMISSION_DENIED`. The tenant comes from the caller, and a job of another tenant is
        `404 ASYNC_STEP_NOT_FOUND` with nothing written. The remote call itself is deduplicated by the job id
        (`AdapterCall.idempotencyKey`), which a retry keeps; the attempt id changes on every attempt.

        The result is checked in the same transaction, whichever path reports it: a result reported here passes the
        same output-schema and guardrail checks as one the engine's own executor records. An agent step's result that
        breaks its output schema is never accepted: while `runners.async-agent.schema-retries` (default 1) are not
        used up, the attempt is given back for a fresh one and the answer is `ACCEPTED`, because the step is not
        decided yet. After that, and for a result its guardrail refuses or whose guardrail cannot be evaluated, the
        answer is `REFUSED`: the refusal is recorded and the step goes to a four-eyes review task for the step's
        reviewer or its job fails. `REFUSED` is always final. Remote `serviceTask` results have no such check.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The job id the adapter received (`AdapterCall.jobId`)
          schema: { type: string, minLength: 1, maxLength: 26 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AsyncStepResult' }
            examples:
              completed:
                value: { attemptId: 4S2Q8M0Z7XK1D9V3B6N5R2T8WA, completionToken: q3V9tYc0mB7xKpL2sWfN8rUeHjD4aZ6oG1iE5vQyT0k, status: COMPLETED, output: { score: 705, band: A } }
              failed:
                value: { attemptId: 4S2Q8M0Z7XK1D9V3B6N5R2T8WA, completionToken: q3V9tYc0mB7xKpL2sWfN8rUeHjD4aZ6oG1iE5vQyT0k, status: FAILED, errorCode: BUREAU_UNAVAILABLE, retryable: true }
      responses:
        '200':
          description: What the engine did with the result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncStepCompletion' }
              example: { jobId: 01JD3K7Q9X2M4N6P8R0S2T4V6W, attemptId: 4S2Q8M0Z7XK1D9V3B6N5R2T8WA, outcome: ACCEPTED }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /messages:correlate:
    post:
      tags: [messages]
      operationId: correlateMessage
      summary: Deliver a message to the instance that waits for it
      description: |
        The host's consumer, or a partner, calls this once for each message it receives; the engine never listens
        (#491). The tenant comes from the caller and is never read from the body, so a message cannot reach an instance
        of another tenant. A message goes to exactly one place. When `correlationKey` is given and exactly one token
        waits for `messageName` and that key (a message catch event or a receive task), the token continues, the
        message fields named by the step's `horus:output` become variables, and the answer is `DELIVERED`. When
        nothing waits for the key and exactly one effective definition has a message start event of that name, a new
        instance starts with `payload` as its variables and `correlationKey` as its business key (a second message with
        the same key returns the existing instance), and the answer is `STARTED`. When that start event is a parallel
        multiple one, the message is held and the answer is `WAITING` until every other definition of the start has
        arrived; the last one starts the instance. A held arrival is deleted after `parallel-start.arrival-ttl`, and a
        definition holds at most `parallel-start.max-arrivals-per-definition` of them: a message with a new key past
        that is `429 START_ARRIVALS_FULL` with a `Retry-After` header, the seconds until a held arrival expires (`PRE-360`). When two or more tokens wait for the
        same name and key, or two definitions start on the name, the answer is `409 MESSAGE_CORRELATION_AMBIGUOUS` and
        nothing runs. When nothing waits and nothing starts, the answer is `422 MESSAGE_NOT_CORRELATED` and nothing is
        stored: a message is not buffered. `Idempotency-Key` is required; a replay with the same key and request returns
        the first answer, `DELIVERED`, `STARTED` or `WAITING`, and delivers nothing twice. Permission `processes:message:correlate`.
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCorrelation' }
            examples:
              payment:
                value: { messageName: payment-received, correlationKey: ORD-20481, payload: { reference: TT-77120, amount: '1250000' } }
      responses:
        '200':
          description: Where the message went
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDelivery' }
              example: { outcome: DELIVERED, instanceId: 01JD3K7Q9X2M4N6P8R0S2T4V6W, nodeId: wait-for-payment }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: List the caller's tasks by assignment, due time and missed deadline
      description: |
        `assignment` is one or more of `mine` (declared to the caller or claimed by them), `candidate` (open tasks of
        the caller's roles and groups) and `any` (every task of the tenant; needs `processes:task:manage`), comma
        separated; `mine,candidate` when absent. `status` is one or more of `OPEN` and `CLAIMED`; both when absent.
        `role` and `group` narrow `candidate` and `any` to one role or group; with `mine` alone they are
        `400 QUERY_INVALID`. `dueBefore` keeps tasks due before that time; `slaBreached=true` keeps tasks whose due
        time has passed on the engine clock. Ordered by `dueAt`, then `id`; tasks without a due time follow, by `id`.
        Every range is read through its own index and stops after one page, so a long queue never slows the list.
        Items carry no variables and no review context; read one task for those, masked. Permission
        `processes:task:work`.

        Each role and group of the caller is a queue the list reads. A caller whose roles and groups together exceed
        `query.max-roles` (100 by default, at most 1,000) and who names no `role` or `group` gets
        `400 ROLE_FAN_OUT_EXCEEDED`, which gives the cap and the number of queues (#408, `PRE-216`); naming one `role`
        or `group` narrows the list to one queue.

        Conditional read (`PRE-218`): the `ETag` is a hash of the body, so it changes whenever an item, the page, the
        cursor or the caller's own view (`allowedActions`, permissions, tenant) changes; a matching `If-None-Match`
        gets `304` with no body, after the permission and tenant checks, so a refused caller never gets `304` and a
        tag from one tenant never matches another tenant's list.
      parameters:
        - name: assignment
          in: query
          required: false
          schema: { type: string, example: 'mine,candidate' }
        - name: status
          in: query
          required: false
          schema: { type: string, example: 'OPEN' }
        - name: role
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: group
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: dueBefore
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: slaBreached
          in: query
          required: false
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of tasks
          headers:
            ETag:
              description: A hash of the body, quoted; send it as `If-None-Match`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
              example:
                data:
                  - id: 01JD2R7Q4M8S3N6V0B5C9X1Z2A
                    instanceId: 01JD2R7Q0D3F6H9K2M5P8R1T4V
                    definitionKey: loan-origination
                    definitionVersion: 2
                    businessKey: LN-2027-000123
                    nodeId: credit-review
                    name: Credit review
                    assignee: 'role:credit-officer'
                    status: OPEN
                    lockVersion: 0
                    createdAt: '2026-12-31T08:00:00Z'
                    dueAt: '2027-01-04T03:00:00Z'
                    slaState: BREACHED
                    overdueBy: PT2H5M
                nextCursor: eyJhZnRlciI6Ii4uLiJ9
                hasNext: true
        '304':
          description: Unchanged since the `ETag` sent in `If-None-Match`; no body
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: Read a user task with the actions the caller may take
      description: |
        The task, its instance and step, its assignment, claim and completion, and `allowedActions`: what this caller
        may do now (`claim`, `unclaim`, `complete`, and for a holder of `processes:task:manage` `reassign` on an open task or
        `delegate` on a claimed one), from the task status, the caller's assignment, permissions and four eyes. The
        `ETag` is the task's `lockVersion`, quoted, to send as `If-Match`. Permission `processes:task:work`, and the
        caller is an assignee (user, role or group), the claimer, or holds `processes:task:manage`; anyone else gets
        `404 TASK_NOT_FOUND`, as for a task that does not exist (`PRE-358`).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}/form:
    get:
      tags: [tasks]
      operationId: getTaskForm
      summary: Read the form a task is completed through
      description: |
        The form the task's step declares in the definition (PRE-031), resolved for this task: the JSON Schema of the
        result (types `string`, `integer`, `number`, `boolean`, `enum`, `format: date` or `date-time`, and the money
        object `{currency, amount}`; one root `if`/`then`/`else` for a field required only in some cases), the display
        hints (`order`, `widgets`, `labels` per locale, `readOnly`, and since `PRE-393` `options`, `units`, `formats`), and `data`, the values of the instance variables
        the schema declares. A field the schema marks `"mask": true` carries the placeholder `***` in `data` whenever
        the variable exists: the clear value never leaves the engine through a form (PRE-220). The caller must be an
        assignee, the claimer or hold `processes:task:manage`, otherwise `404 TASK_NOT_FOUND` (`PRE-358`). A step that declares a
        link to the host's own screen answers `link` instead of `form`, with `{taskId}` and `{instanceId}` replaced;
        such a task is completed by the host's screen with `:complete` as any other. A step that declares no form is
        `404 FORM_NOT_DECLARED`, and so is a registered form the host no longer provides. The `ETag` is the task's
        `lockVersion`, quoted, to send as `If-Match` on `:complete`. Writes nothing. Permission `processes:task:work`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The resolved form, or the link
          headers:
            ETag:
              description: The task's `lockVersion`, quoted; send it as `If-Match`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskForm' }
              examples:
                form:
                  summary: A credit review declared with a form
                  value:
                    schemaVersion: 1
                    taskId: 01JD8Q4K3V9N2M5X7B1C6R0TEA
                    lockVersion: 1
                    form:
                      schema:
                        type: object
                        required: [decision]
                        properties:
                          decision: { enum: [APPROVE, REJECT] }
                          reason: { type: string, maxLength: 500 }
                          idNumber: { type: string, mask: true }
                        if: { required: [decision], properties: { decision: { const: REJECT } } }
                        then: { required: [reason] }
                      hints:
                        order: [decision, reason]
                        labels: { reason: { en: Reason, vi: Lý do } }
                      data: { idNumber: '***' }
                link:
                  summary: A task completed in the host's own screen
                  value:
                    schemaVersion: 1
                    taskId: 01JD8Q4K3V9N2M5X7B1C6R0TEB
                    lockVersion: 0
                    link: /loans/review/01JD8Q4K3V9N2M5X7B1C6R0TEB
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:claim:
    post:
      tags: [tasks]
      operationId: claimTask
      summary: Claim an open user task
      description: |
        `OPEN` to `CLAIMED` by the caller, who must be the assigned user, hold the assigned role or belong to the
        assigned group (`403 TASK_NOT_ASSIGNED`). On a four-eyes task the identity that started the instance or
        completed an earlier task of it is refused (`403 SELF_APPROVAL_FORBIDDEN`, PRE-007). A task that is not
        open is `409 INVALID_STATE`. Writes a `TASK_CLAIMED` history entry and hands `processes.task.claimed.v1` to
        the host publisher in the same transaction. Permission `processes:task:work`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TaskIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:unclaim:
    post:
      tags: [tasks]
      operationId: unclaimTask
      summary: Hand a claimed task back to its candidates
      description: |
        `CLAIMED` to `OPEN`; only the claimant may unclaim (`403 TASK_NOT_ASSIGNED`). A task that is not claimed is
        `409 INVALID_STATE`. Writes a `TASK_UNCLAIMED` history entry and hands `processes.task.unclaimed.v1` to the
        host publisher in the same transaction. Permission `processes:task:work`.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TaskIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:reassign:
    post:
      tags: [tasks]
      operationId: reassignTask
      summary: Assign an open task to a named user
      description: |
        `OPEN` to CLAIMED by the named user (PD-110). Permission `processes:task:manage`; `processes:task:work` is not needed. The
        body carries the `assignee` (a user id) and a required `reason` of 1 to 500 characters. The target must hold
        the task's role or belong to its group, as the host's user directory answers; a task assigned to one user can
        go to anyone. On a four-eyes task the identity that started the instance or completed an earlier task of it
        is refused, and so is the user who already holds the task. Each refusal is `409 ASSIGNEE_NOT_ALLOWED`, with
        `reason` and, for a missing role or group, `required` (`PRE-206`), and
        writes nothing. A task in another state, a completed one included, is `409 INVALID_STATE`; a stale `If-Match`
        is `409 VERSION_CONFLICT`; another tenant's task is `404 TASK_NOT_FOUND`. Writes a `TASK_REASSIGNED`
        history entry with the actor, the previous and new holder and the reason, and hands
        `processes.task.reassigned.v1` to the host publisher in the same transaction. A replay with the same
        `Idempotency-Key` returns the first answer.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TaskIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskHandOver' }
            example: { assignee: minh, reason: An is on leave until Monday }
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:delegate:
    post:
      tags: [tasks]
      operationId: delegateTask
      summary: Hand a claimed task to another user
      description: |
        `CLAIMED` to CLAIMED by the named user, who replaces the claimant (PD-110). Permission `processes:task:manage`; `processes:task:work` is not needed. The
        body carries the `assignee` (a user id) and a required `reason` of 1 to 500 characters. The target must hold
        the task's role or belong to its group, as the host's user directory answers; a task assigned to one user can
        go to anyone. On a four-eyes task the identity that started the instance or completed an earlier task of it
        is refused, and so is the user who already holds the task. Each refusal is `409 ASSIGNEE_NOT_ALLOWED`, with
        `reason` and, for a missing role or group, `required` (`PRE-206`), and
        writes nothing. A task in another state, a completed one included, is `409 INVALID_STATE`; a stale `If-Match`
        is `409 VERSION_CONFLICT`; another tenant's task is `404 TASK_NOT_FOUND`. Writes a `TASK_DELEGATED`
        history entry with the actor, the previous and new holder and the reason, and hands
        `processes.task.delegated.v1` to the host publisher in the same transaction. A replay with the same
        `Idempotency-Key` returns the first answer.
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/TaskIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskHandOver' }
            example: { assignee: minh, reason: An is on leave until Monday }
      responses:
        '200':
          $ref: '#/components/responses/Task'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Complete a task the caller has claimed
      description: |
        The caller must hold `processes:task:work` and have claimed the task: an `OPEN` task is
        `409 INVALID_STATE` (claim it first), a task claimed by someone else is `403 TASK_NOT_ASSIGNED`. The caller
        must still be the assigned user, hold the assigned role or belong to the assigned group. On a four-eyes task
        the identity that started the instance or completed an earlier task of it is refused
        (`403 SELF_APPROVAL_FORBIDDEN`, PRE-007). The review task of a refused async result is always four-eyes,
        and the identity that reported the refused result is refused as well. Its result must meet the step's
        output schema (`422 FORM_VALIDATION_FAILED` with `violations`; nothing is written and the task stays
        claimed). A task whose step declares a form (`GET /tasks/{id}/form`) is completed through it: a `result` that
        breaks the form's schema is `422 FORM_VALIDATION_FAILED` with `violations` and `errors`, one JSON Pointer per
        failing field such as `/reason`, and nothing is written (PRE-031). A task declared with a link is not checked
        here; the host's screen validates it. A stale `If-Match` is `409 VERSION_CONFLICT` and writes nothing
        (PRE-003). The result is stored in the task's result variable. The following synchronous steps run in the
        same transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - name: If-Match
          in: header
          required: true
          description: |
            The task's `lockVersion` (the `ETag` of `GET /tasks/{id}`, or the task in the instance view; not the
            instance `ETag`), quoted. Missing is `428 PRECONDITION_REQUIRED`; stale is `409 VERSION_CONFLICT`.
          schema: { type: string, example: '"1"' }
        - name: Idempotency-Key
          in: header
          required: true
          description: Required on completion; missing is `428 PRECONDITION_REQUIRED`. See the IdempotencyKey parameter.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  additionalProperties: true
                reason:
                  type: string
                  maxLength: 2000
                  description: >-
                    Why the reviewer answered as they did. On the review task of a refused agent answer it is
                    recorded with the reviewer's answer in the `HUMAN_OVERRIDE` history entry; ignored on other
                    tasks. Longer than `lifecycle.reason-max-length` is `400 INPUT_INVALID`.
            example: { result: { riskScore: 85, recommendation: REJECT }, reason: Salary slips do not match the declared income }
      responses:
        '200':
          $ref: '#/components/responses/Instance'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /agent-replays:
    post:
      tags: [agent-replays]
      operationId: startAgentReplay
      summary: Replay an agent step's recorded answers against a candidate guardrail
      description: |
        Tests a changed guardrail, and optionally a changed output schema, against the answers an agent step recorded
        over a period, before it goes live (PD-128). The run re-checks each recorded answer (output schema, then the
        candidate rule set version, usually a draft) at the answer's recorded time, so `today()` is the day it was
        checked. It never calls a model or any adapter, writes no history or decision row, and moves no instance.
        Prompt or model changes are replayed by a host harness outside the engine, because masked inputs are kept only
        as keyed hashes.

        The run is created at once (`202`) and replayed by the job poller in pages of `replay.page-size` (500); read
        it with `GET /agent-replays/{id}`. The period is whole UTC days, `from` and `to` inclusive, at most
        `query.max-range` (31 days), otherwise `400 QUERY_INVALID`. More recorded answers than `replay.max-cases`
        (50,000) is `422 REPLAY_TOO_LARGE` with `cases` and `limit`. A candidate that breaks the guardrail contract
        (output `allow: boolean`, hit policy `first` or `unique`, inputs the output schema declares) is
        `422 GUARDRAIL_CONTRACT_INVALID` and no run is created; a candidate the caller's tenant does not have is
        `404 RULE_SET_NOT_FOUND`. Permission `processes:agent:replay`. Runs and reports are deleted
        `replay.retention` (30 days) after they were created; they are not audit records.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentReplayRequest' }
            example: { definitionKey: kyc-onboarding, nodeId: assess-documents, from: '2026-11-01', to: '2026-11-30', candidate: { ruleSet: kyc-document-guardrails, version: 3 } }
      responses:
        '202':
          description: The queued run
          headers:
            Location: { schema: { type: string }, description: The run's address }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReplayRun' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /agent-replays/{id}:
    get:
      tags: [agent-replays]
      operationId: getAgentReplay
      summary: Read a replay run and its summary
      description: |
        The run's status (`QUEUED`, `RUNNING`, `COMPLETED`, `FAILED`) and its counts so far: cases unchanged, newly
        allowed, newly refused, newly routed to review, newly allowed cases a reviewer had corrected, cases that could
        not be replayed, and cases with masked fields. Permission `processes:agent:replay`; another tenant's run is
        `404 REPLAY_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ReplayId'
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReplayRun' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /agent-replays/{id}/cases:
    get:
      tags: [agent-replays]
      operationId: listAgentReplayCases
      summary: Read a replay report, one line per recorded answer
      description: |
        Lines in recorded order: the attempt id (the key of the model call), the instance, the recorded and the
        candidate outcome, the change, the matched rule ids, the candidate's code and the `OVERRIDDEN_BY_REVIEWER`
        flag. Never an output value. `limit` 1 to 500, 50 when absent. Permission `processes:agent:replay`.
      parameters:
        - $ref: '#/components/parameters/ReplayId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentReplayCasePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /agent-replays/{id}/cases/{attemptId}/answer:
    get:
      tags: [agent-replays]
      operationId: getAgentReplayCaseAnswer
      summary: Open one case's recorded answer as history keeps it
      description: |
        The recorded `output` and `inputs` of one case: output fields the schema masks are `***`, and masked inputs
        are their keyed hashes (`hmac:<keyId>:<hex>`). Permission `processes:agent:replay`; a case the run does not
        have, or another tenant's run, is `404 REPLAY_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ReplayId'
        - name: attemptId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 26 }
      responses:
        '200':
          description: The recorded answer
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, instanceId, output, inputs]
                properties:
                  attemptId: { type: string }
                  instanceId: { type: string }
                  output: { type: object, additionalProperties: true }
                  inputs: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations:
    post:
      tags: [migrations]
      operationId: createMigrationPlan
      summary: Plan moving the running instances of one version to another
      description: |
        Creates a plan to move the running instances of `sourceVersion` to `targetVersion` of the same key in the
        caller's tenant. Steps are matched by identical id, unless the plan says otherwise (PRE-207, PRE-208):
        `mappings` move the tokens, open tasks and pending jobs of a renamed step to its new id, and `cancellations`
        cancel the work of a removed step with a reason and continue the token at a named step of the target. A body
        with any other field is `400 INPUT_INVALID`. Creating a plan moves nothing. It writes the plan, one
        history row and `processes.migration.planned.v1` in one transaction.

        Instructions that cannot be carried out are `422 MIGRATION_PLAN_INVALID` with each problem in `paths`, and
        nothing is written (PRE-209): a mapping to a step of another type or to a step the target lacks, a step
        mapped or cancelled twice, a cancelled step the target still has, a cancellation without a `reason` (1 to
        `lifecycle.reason-max-length` characters) or without a `moveTo` that the target has, and more than 200
        mappings or 200 cancellations. A removed step that no instruction handles is not refused here: the dry run
        lists it as a conflict.

        The plan records the approval its execution needs, fixed when it is created (PRE-174): `four-eyes`, so a
        second holder of `processes:migration:manage`, never the proposer, approves the execution. `single` is
        recorded only when the host sets `migration.approval=single`, which start-up accepts only on the `dev`
        profile alone. `POST /migrations/{id}:execute` proposes the execution.

        The target must be `ACTIVE` and the source `ACTIVE` or `RETIRED`, otherwise `409 INVALID_STATE`; the same
        version twice is `400 INPUT_INVALID`; a version the caller's tenant does not have is
        `404 DEFINITION_NOT_FOUND` (PRE-175). Permission `processes:migration:manage`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrationPlanRequest' }
            example:
              definitionKey: loan-origination
              sourceVersion: 1
              targetVersion: 2
              mappings: [{ from: credit-review, to: credit-assessment }]
              cancellations:
                - { step: legacy-manual-check, moveTo: credit-assessment, reason: Check merged into credit assessment }
      responses:
        '201':
          description: The plan
          headers:
            Location: { schema: { type: string }, description: The plan's address }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPlan' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}:
    get:
      tags: [migrations]
      operationId: getMigrationPlan
      summary: Read a migration plan
      description: |
        The plan with its status and the approval its execution needs. Permission `processes:migration:manage` or
        `processes:read`; another tenant's plan is `404 MIGRATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationPlan' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}:validate:
    post:
      tags: [migrations]
      operationId: validateMigrationPlan
      summary: Dry run of a migration plan
      description: |
        Reports what would happen if the plan's running instances moved now (PRE-014). It only reads: no instance,
        token, history or plan row changes, so it needs no approval and takes no idempotency key.

        Every step of the source version that holds live tokens is mapped onto the target: by the plan's `mappings`
        (`MAPPED`), by its `cancellations` (`CANCELLED`), or by identical id: `SAME_ID`, `STEP_NOT_IN_TARGET` (the
        target has no step with that id) or `STEP_TYPE_CHANGED` (it has one of another type). Each step that is not
        handled is a conflict with the number of running instances waiting there and their ids. A target that is no
        longer active is the conflict `TARGET_NOT_ACTIVE`. A cancelled step whose remote call is in flight is the
        conflict `STEP_IN_FLIGHT`: it does not make the plan invalid, and the instance stays on the source version
        until a later run (PRE-208). `impact` counts the instances each kind of instruction touches (PRE-207). The
        plan is `valid` only without conflicts other than `STEP_IN_FLIGHT`. `movable` counts and lists the instances that would move. Each id list holds
        at most `migration.dry-run-sample-size` (100) ids in id order, with `truncated: true` when there are more.

        `planHash` and `validUntil` (`migration.dry-run-validity`, one hour, after `checkedAt`) bind a later
        execution to this check (PD-114). Another tenant's plan is `404 MIGRATION_NOT_FOUND` (PRE-175). Permission
        `processes:migration:manage`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
      responses:
        '200':
          description: The dry-run report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationDryRun' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}:execute:
    post:
      tags: [migrations]
      operationId: proposeMigrationExecution
      summary: Propose moving the running instances, with a reason
      description: |
        Proposes the execution of a plan (PRE-195, PD-114, PD-131). The engine runs the dry run of the plan itself
        and the plan must have no conflict, otherwise `409 DRY_RUN_REQUIRED`; a plan that is not `PLANNED` or
        `REJECTED` (or a proposal whose dry run has expired) is `409 INVALID_STATE`. The proposal moves nothing: a
        second holder of `processes:migration:manage`, never the proposer, approves it with `:approve`. Only the
        approval lets the runner move instances. With `migration.approval=single` (accepted on the `dev` profile
        only) the proposal is approved by the proposer at once and recorded as `single`. Writes the proposal, one
        history row and `processes.migration.proposed.v1` in one transaction. A repeat with the same
        `Idempotency-Key` returns the first answer. Another tenant's plan is `404 MIGRATION_NOT_FOUND`. Permission
        `processes:migration:manage`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
            example: { reason: 'Retire the legacy committee step, ticket CHG-2041' }
      responses:
        '202':
          description: The proposal, `PROPOSED` (or `APPROVED` in the single mode)
          headers:
            ETag: { schema: { type: string }, description: 'The proposal lockVersion, quoted' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationExecution' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}:approve:
    post:
      tags: [migrations]
      operationId: approveMigrationExecution
      summary: Approve a proposed execution as a second person
      description: |
        The proposer is refused with `403 SELF_APPROVAL_FORBIDDEN` and nothing is written (PRE-195). The engine runs
        the dry run again: the proposal's dry run must be no older than `migration.dry-run-validity` and the plan must
        still have no conflict, otherwise `409 DRY_RUN_REQUIRED`. `If-Match` is the proposal's `lockVersion`; stale is
        `409 VERSION_CONFLICT`, missing `428 PRECONDITION_REQUIRED`. The plan becomes `APPROVED`; the runner moves the
        instances in batches of `migration.batch-size`, and `GET /migrations/{id}/execution` shows the progress.
        Publishes `processes.migration.approved.v1` with both people. Permission `processes:migration:manage`.

        The body `{"expectedPlanHash": "<64 hex>"}` (PD-139, #473, AUD-02) names the plan the approver reviewed, the
        `contentHash` of its item in `GET /approvals`. Without it the answer is `400 CONTENT_HASH_REQUIRED`; another
        value is `409 CONTENT_CHANGED`; nothing is written either way. Only the `dev` profile may relax this with
        `horus.bpm.processes.approval.require-content-hash=false`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
        - name: If-Match
          in: header
          required: true
          description: The proposal's `lockVersion`, quoted.
          schema: { type: string, example: '"1"' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedPlanHash]
              properties:
                expectedPlanHash: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: The execution, `APPROVED`
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationExecution' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}:reject:
    post:
      tags: [migrations]
      operationId: rejectMigrationExecution
      summary: Reject a proposed execution
      description: |
        A second holder rejects the proposal with a reason; the plan becomes `REJECTED` and may be proposed again.
        The proposer is refused with `403 SELF_APPROVAL_FORBIDDEN`. `If-Match` is the proposal's `lockVersion`.
        Publishes `processes.migration.rejected.v1`. Permission `processes:migration:manage`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
        - name: If-Match
          in: header
          required: true
          description: The proposal's `lockVersion`, quoted.
          schema: { type: string, example: '"1"' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: The execution, `REJECTED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationExecution' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}/execution:
    get:
      tags: [migrations]
      operationId: getMigrationExecution
      summary: Progress of a migration
      description: |
        The proposal, the approval and the progress of the plan: how many instances were moved, failed or skipped
        (PRE-015, PRE-196). The counts are exact. `RUNNING` shows a runner at work; `COMPLETED_WITH_FAILURES` means
        every failed instance has an incident. The `ETag` is the proposal's `lockVersion`. Permission
        `processes:migration:manage` or `processes:read`; another tenant's plan is `404 MIGRATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
      responses:
        '200':
          description: The execution
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationExecution' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /migrations/{id}/instances:
    get:
      tags: [migrations]
      operationId: listMigrationInstances
      summary: What happened to each instance
      description: |
        The per-instance outcomes in instance id order, one bounded page; pass `nextAfter` as `after`. `outcome` keeps
        one of `MIGRATED`, `FAILED` and `SKIPPED`. A failure carries its `code`, a detail built from codes and step ids
        only, and the id of its incident. Permission `processes:migration:manage` or `processes:read`; another
        tenant's plan is `404 MIGRATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/MigrationId'
        - name: outcome
          in: query
          required: false
          schema: { type: string, enum: [MIGRATED, FAILED, SKIPPED] }
        - name: after
          in: query
          required: false
          description: List the instances after this id.
          schema: { type: string, minLength: 1, maxLength: 26 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of outcomes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationOutcomePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List the incidents of one status, newest first
      description: |
        The incidents of the caller's tenant only (PRE-080), newest first on `(createdAt, id)`, keyset-paged with a
        signed cursor bound to the tenant and the status; at most `query.max-page-size` (200) per page. Each item has
        the error code, a cause built from codes only, the retry count, the step, the instance and `allowedActions`
        computed for the caller (empty without `processes:incident:manage`). Read only. Permission `processes:read`.

        Conditional read (`PRE-218`): the `ETag` is a hash of the body, so it changes whenever an item, the page, the
        cursor or the caller's own view (`allowedActions`, permissions, tenant) changes; a matching `If-None-Match`
        gets `304` with no body, after the permission and tenant checks, so a refused caller never gets `304` and a
        tag from one tenant never matches another tenant's list.
      parameters:
        - name: status
          in: query
          required: false
          description: '`OPEN` when absent. Another value is `400 QUERY_INVALID`.'
          schema: { type: string, enum: [OPEN, RESOLUTION_PENDING, RESOLVED], default: OPEN }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: One page of incidents
          headers:
            ETag:
              description: A hash of the body, quoted; send it as `If-None-Match`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentPage' }
        '304':
          description: Unchanged since the `ETag` sent in `If-None-Match`; no body
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents/{id}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Read one incident with the actions the caller may take
      description: |
        Another tenant's incident is `404 INCIDENT_NOT_FOUND`. A pending resolution shows the proposed output as
        history keeps it: an agent step's output masked by its output schema. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents/{id}:retry:
    post:
      tags: [incidents]
      operationId: retryIncident
      summary: Run the failed step again
      description: |
        PRE-077. In one transaction under the instance's row lock the step's job is due now with one more attempt
        and keeps its job id, so the remote side deduplicates the call; the next claim has a new attempt id, and an
        agent's result passes the result check again. A local step whose handler returned a business error runs its
        handler again in this transaction. History records `INCIDENT_RETRIED` with the actor and the reason, and
        `processes.incident.retried.v1` is published. The incident stays `OPEN` with `retrying: true` until the step
        is accepted (`RESOLVED`, `RETRY_SUCCEEDED`, `processes.incident.resolved.v1`) or fails again, which keeps the
        same incident open with the new cause. A repeat with the same key replays the first answer and writes nothing.

        An undo of a compensation walk that failed (`COMPENSATION_FAILED`, PRE-074) runs again under the same job id
        with a new attempt id; its success resolves the incident and the walk goes on.

        Refusals write nothing: a stale `If-Match` is `409 VERSION_CONFLICT`; an incident that is not `OPEN`, one
        being retried, an agent step whose memory failed before any call, or a manual undo
        (`COMPENSATION_MANUAL_REQUIRED`, which is resolved instead) is `409 INVALID_STATE`. One person's
        action: it runs the same step again and decides nothing. Permission `processes:incident:manage`.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IncidentIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentReason' }
            example: { reason: Core banking back after maintenance }
      responses:
        '202': { $ref: '#/components/responses/Incident' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents/{id}:resolve:
    post:
      tags: [incidents]
      operationId: resolveIncident
      summary: Propose the output the waiting step completes with
      description: |
        PRE-078, PD-126. `output` is checked against the step's output schema now; a violation is
        `422 OUTPUT_INVALID` with each failing path in `paths`, never a value, and nothing is written. The guardrail
        is not run, because a person supplied the answer. Under `horus.bpm.processes.incidents.resolve-approval:
        four-eyes` (the default) the incident becomes `RESOLUTION_PENDING` with the proposal and its proposer, and
        nothing moves until a second holder of `processes:incident:manage` approves; `single` is accepted on the
        `dev` profile only and applies the resolution at once. History records `INCIDENT_RESOLUTION_PROPOSED` with the
        proposer, the reason and the output, and `processes.incident.resolution-proposed.v1` is published. For an
        undo incident (`COMPENSATION_FAILED`, `COMPENSATION_MANUAL_REQUIRED`, PRE-074, PRE-075) the output records how
        the undo was done by hand, for example a reversal reference; the approval marks the undo done and the
        compensation walk goes on. Permission `processes:incident:manage`.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IncidentIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output, reason]
              properties:
                output:
                  type: object
                  additionalProperties: true
                  description: The step's result, a JSON object; money as `{currency, amount}`
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Required; at most `lifecycle.reason-max-length` (2,000) characters, else `400 INPUT_INVALID`
            example:
              output: { approvedLimit: { amount: '30000000', currency: VND } }
              reason: Limit raised by credit committee, memo CC-118
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents/{id}:approve-resolution:
    post:
      tags: [incidents]
      operationId: approveIncidentResolution
      summary: Approve a proposed resolution as a second person
      description: |
        PRE-078. The waiting step completes with the proposed output and the token moves on, in one transaction under
        the instance's row lock. The incident is `RESOLVED` with `COMPLETED_MANUALLY`; history records
        `INCIDENT_RESOLVED` with the proposer, the approver, the reason and the output, and
        `processes.incident.resolved.v1` carries `resolution`, `resolvedBy` and `proposedBy`. The proposer is refused
        with `403 SELF_APPROVAL_FORBIDDEN` and nothing is written. No pending resolution is `409 INVALID_STATE`.
        Permission `processes:incident:manage`.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IncidentIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: [string, 'null'], maxLength: 2000 }
            example: { comment: Checked against memo CC-118 }
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /incidents/{id}:reject-resolution:
    post:
      tags: [incidents]
      operationId: rejectIncidentResolution
      summary: Reject a proposed resolution as a second person
      description: |
        PRE-078. The proposal is dropped and the incident is `OPEN` again; the token stays on the step. History
        records `INCIDENT_RESOLUTION_REJECTED` with the reason and `processes.incident.resolution-rejected.v1` is
        published. The proposer is refused with `403 SELF_APPROVAL_FORBIDDEN`. Permission
        `processes:incident:manage`.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IncidentIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentReason' }
            example: { reason: 'Memo CC-118 approves 25,000,000 VND, not 30,000,000' }
      responses:
        '200': { $ref: '#/components/responses/Incident' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /step-catalogue:
    get:
      tags: [step-catalogue]
      operationId: getStepCatalogue
      summary: List what the host registered for the modeller
      description: |
        PRE-032 (#103). The service handlers (local and remote, with input schema and whether they are compensable),
        the agent adapters, the rule sets with a version in effect (and, among them, those that meet the guardrail
        contract), the calendars of the caller's tenant and the roles the host lists, and nothing else: a step the host
        did not register is not offered and cannot be imported. Names and schemas only, never a configuration value, an
        endpoint or a credential. The tenant comes from the authenticated context. The `ETag` is a hash of the body;
        send it as `If-None-Match` for `304`. Permission `processes:author`.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The catalogue of the caller's tenant
          headers:
            ETag:
              description: A hash of the body, quoted
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StepCatalogue' }
              example:
                handlers:
                  - name: cardProfiles.load
                    mode: local
                    inputSchema: {}
                    compensable: false
                  - name: kyc.verifyDocuments
                    mode: remote
                    inputSchema: { type: object, required: [customerId], properties: { customerId: { type: string } } }
                    compensable: true
                agents:
                  - name: doc-assessor
                    inputSchema: {}
                ruleSets:
                  decision:
                    - name: card-fee
                      version: 3
                      hitPolicy: FIRST
                      inputs: { tier: string }
                      outputs: { fee: integer }
                  guardrail: []
                calendars: [vn-banking-hours]
                roles: [card-officer, credit-officer]
        '304':
          description: The catalogue has not changed since the `ETag` sent
          headers:
            ETag:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendars:
    get:
      tags: [calendars]
      operationId: listCalendars
      summary: List the tenant's business calendars by key
      description: |
        PRE-181. The calendars of the caller's tenant only, by key, keyset-paged with a signed cursor bound to the
        tenant; at most `query.max-page-size` (200) per page. Each item is a summary without working hours or
        holidays: read one calendar for those. Read only. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of calendar summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendars/{key}:
    get:
      tags: [calendars]
      operationId: getCalendar
      summary: Read one calendar in force
      description: |
        PRE-181. The calendar as the last approved change left it. The `ETag` is its version, quoted: send it as
        `If-Match` when proposing a change. Another tenant's calendar is `404 CALENDAR_NOT_FOUND`. Permission
        `processes:read`.
      parameters:
        - $ref: '#/components/parameters/CalendarKey'
      responses:
        '200':
          description: The calendar
          headers:
            ETag:
              description: The calendar's version, quoted; send it as `If-Match` with a proposal
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendars/{key}/changes:
    post:
      tags: [calendars]
      operationId: proposeCalendarChange
      summary: Propose a new calendar or a change of one
      description: |
        PRE-114, PRE-181, PRE-182. Proposes the whole calendar as it should be (`calendar`) with a `reason`. `If-Match`
        is the version the change is made against: `"0"` for a new calendar. Under four eyes (the default, PD-131)
        the change is `PENDING` and applies only when a second holder of `processes:calendar:manage` approves it, and
        then only to deadlines set after that; due times already set never move. Under `calendar.approval=single`,
        which start-up accepts only on the `dev` profile alone, the proposal applies at once and is recorded as
        `SINGLE`. Every proposal and decision is kept with the people, the time and the old and new value.

        A repeat with the same `Idempotency-Key` and the same request returns the first answer, status and body, and
        writes nothing: no second change, no second event. The same key with another request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH`. A calendar that is not at the `If-Match` version is
        `409 VERSION_CONFLICT`. A key or a calendar that is not valid is `400 INPUT_INVALID`. Permission
        `processes:calendar:manage`.
      parameters:
        - $ref: '#/components/parameters/CalendarKey'
        - $ref: '#/components/parameters/CalendarIfMatch'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarProposal' }
            example:
              reason: Tet holiday 2027 added
              calendar:
                zone: Asia/Ho_Chi_Minh
                week:
                  MONDAY: ['08:00-17:00']
                  TUESDAY: ['08:00-17:00']
                  WEDNESDAY: ['08:00-17:00']
                  THURSDAY: ['08:00-17:00']
                  FRIDAY: ['08:00-17:00']
                holidays: { '2027-02-08': Tet }
      responses:
        '201':
          description: The change
          headers:
            Location: { schema: { type: string }, description: The change's address }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendar-changes:
    get:
      tags: [calendars]
      operationId: listCalendarChanges
      summary: List the calendar changes of one status, newest first
      description: |
        PRE-181. The changes of the caller's tenant only, newest first on `(proposedAt, id)`, keyset-paged with a
        signed cursor bound to the tenant and the status; at most `query.max-page-size` (200) per page. Read only.
        Permission `processes:read`.
      parameters:
        - name: status
          in: query
          required: false
          description: '`PENDING` when absent. Another value is `400 QUERY_INVALID`.'
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarChangePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendar-changes/{id}:
    get:
      tags: [calendars]
      operationId: getCalendarChange
      summary: Read one calendar change with its old and new value
      description: |
        PRE-181. Another tenant's change is `404 CALENDAR_NOT_FOUND`. Permission `processes:read`.
      parameters:
        - $ref: '#/components/parameters/CalendarChangeId'
      responses:
        '200':
          description: The change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarChange' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendar-changes/{id}:approve:
    post:
      tags: [calendars]
      operationId: approveCalendarChange
      summary: Approve a pending change as a second person and apply it
      description: |
        PRE-114, PRE-182. In one transaction under the calendar's row lock the calendar moves to its next version, the
        decision is recorded and `processes.calendar.changed.v1` is published. The approver is never the proposer
        (`403 SELF_APPROVAL_FORBIDDEN`, and the table refuses it too). A change that is no longer `PENDING` is
        `409 INVALID_STATE`; a calendar that changed since the proposal is `409 VERSION_CONFLICT` and the change stays
        `PENDING`. A change needs no `If-Match`: it cannot be edited, and the calendar version it was proposed against
        is checked under the lock. The body member `expectedChangeHash` (PD-139, #473, AUD-02) names the change the
        approver reviewed, the `contentHash` of its item in `GET /approvals`: without it the answer is
        `400 CONTENT_HASH_REQUIRED`, another value is `409 CONTENT_CHANGED`, and nothing is written either way (only the
        `dev` profile may relax this with `horus.bpm.processes.approval.require-content-hash=false`). A repeat with the same `Idempotency-Key` returns the first answer and writes
        nothing. Permission `processes:calendar:manage`.
      parameters:
        - $ref: '#/components/parameters/CalendarChangeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarDecision' }
            example: { comment: Checked against the State Bank notice }
      responses:
        '200':
          description: The approved change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /calendar-changes/{id}:reject:
    post:
      tags: [calendars]
      operationId: rejectCalendarChange
      summary: Reject a pending change; the calendar stays as it is
      description: |
        PRE-114, PRE-182. A holder of `processes:calendar:manage` rejects with a `comment` that says why; the proposer
        may withdraw their own. The calendar and its version do not change. A change that is no longer `PENDING` is
        `409 INVALID_STATE`. A repeat with the same `Idempotency-Key` returns the first answer and writes nothing.
      parameters:
        - $ref: '#/components/parameters/CalendarChangeId'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalendarDecision' }
            example: { comment: The date is not a bank holiday }
      responses:
        '200':
          description: The rejected change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    hostAuth:
      type: http
      scheme: bearer
      description: The host's own authentication. The engine reads the caller and tenant from the host's security context.
  parameters:
    CalendarKey:
      name: key
      in: path
      required: true
      schema: { type: string, maxLength: 100, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
    CalendarChangeId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 26 }
    CalendarIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The version of the calendar the change is made against, quoted: the `ETag` of `GET /calendars/{key}`, or `"0"`
        for a calendar that does not exist yet. Missing is `428 PRECONDITION_REQUIRED`; stale is
        `409 VERSION_CONFLICT`.
      schema: { type: string, example: '"1"' }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 26 }
    IncidentIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The incident's `lockVersion` (its `ETag`), quoted. Missing is `428 PRECONDITION_REQUIRED`; stale is
        `409 VERSION_CONFLICT`.
      schema: { type: string, example: '"0"' }
    DefinitionKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
    DefinitionVersionNumber:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IfMatchDefinition:
      name: If-Match
      in: header
      required: true
      description: |
        The version's `lockVersion`, quoted: the `lockVersion` field of the version, or the `ETag` of a lifecycle
        command's answer. Missing is `428 PRECONDITION_REQUIRED`; stale is `409 VERSION_CONFLICT`.
      schema: { type: string, example: '"1"' }
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    TaskIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The task's `lockVersion` (the `ETag` of `GET /tasks/{id}`), quoted. Missing is `428 PRECONDITION_REQUIRED`;
        stale is `409 VERSION_CONFLICT`.
      schema: { type: string, example: '"0"' }
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required; missing is `428 PRECONDITION_REQUIRED`. See the IdempotencyKey parameter.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page, 1 to `query.max-page-size` (200); 50 when absent. Outside the range is `400 QUERY_INVALID`.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    MigrationId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 26 }
    ReplayId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 26 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` of the previous page, unchanged; absent for the first page.
      schema: { type: string, maxLength: 400 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A replay with the same request returns the original result and changes nothing; a concurrent request with
        the same key waits for the first and then replays its answer. The same key with a different request is
        `422 IDEMPOTENCY_KEY_REUSE_MISMATCH`; a request that finds the key still pending is
        `409 IDEMPOTENCY_IN_FLIGHT` with `Retry-After: 1`. Remembered for `idempotency-retention` (24 hours).
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    Incident:
      description: The incident after the call
      headers:
        ETag:
          description: The incident's `lockVersion`, quoted; send it as `If-Match`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Incident' }
    Definition:
      description: The definition version after the call
      headers:
        ETag:
          description: The version's `lockVersion`, quoted
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DefinitionVersion' }
    Task:
      description: The task after the call
      headers:
        ETag:
          description: The task's `lockVersion`, quoted; send it as `If-Match`
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Task' }
    Instance:
      description: The instance after the call
      headers:
        ETag:
          description: The instance's `lockVersion`, quoted. Task completion uses the task's own `lockVersion`.
          schema: { type: string }
        Location:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProcessInstance' }
    Problem:
      description: >-
        RFC 9457 problem; see the wiki pages Common Error Codes and Process Engine API. `400` is `INPUT_INVALID`,
        `QUERY_INVALID` (a list limit, cursor or range), `ROLE_FAN_OUT_EXCEEDED` (a task list over more role and group
        queues than `query.max-roles`; `PRE-216`) or `CONTENT_HASH_REQUIRED` (an approval that names no reviewed
        content). `404` is `NO_EFFECTIVE_VERSION`, `DEFINITION_NOT_FOUND`, `INSTANCE_NOT_FOUND`, `TASK_NOT_FOUND`,
        `INCIDENT_NOT_FOUND`, `ASYNC_STEP_NOT_FOUND`, `CALENDAR_NOT_FOUND` or `MIGRATION_NOT_FOUND`; another tenant's resource is always not found. `401 UNAUTHENTICATED`
        carries a `WWW-Authenticate` challenge. `403` is `PERMISSION_DENIED` (missing engine permission),
        `TASK_NOT_ASSIGNED`, `SELF_APPROVAL_FORBIDDEN` (four-eyes) or `TENANT_NOT_ALLOWED` (a tenant other than
        the caller's, or a decision step whose caller tenant is not the instance tenant). `404` is
        `NO_EFFECTIVE_VERSION`, `INSTANCE_NOT_FOUND`, `TASK_NOT_FOUND` or `DEFINITION_NOT_FOUND`. `409` is
        `VERSION_CONFLICT`, `CONTENT_CHANGED`, `CHANGE_SET_TRUNCATED`, `VERSION_SUPERSEDED`, `LAST_VERSION_IN_EFFECT`, `INVALID_STATE`, `ASSIGNEE_NOT_ALLOWED` (the person a task would be handed to may not work it) or `IDEMPOTENCY_IN_FLIGHT`. `413` is `PAYLOAD_TOO_LARGE`. `429` is `START_ARRIVALS_FULL`, with a `Retry-After` header. `422` is
        `VALIDATION_FAILED`, `GUARDRAIL_CONTRACT_INVALID`, `BPMN_UNSUPPORTED_ELEMENT`, `CMMN_UNSUPPORTED`, `BPMN_UNSAFE_XML`, `DEFINITION_TOO_LARGE`,
        `IDEMPOTENCY_KEY_REUSE_MISMATCH`, `STEP_FAILED`, `FORM_VALIDATION_FAILED` or `OUTPUT_INVALID`. `428` is `PRECONDITION_REQUIRED`. `503` is `QUERY_TIMEOUT` (a list read stopped by `query.statement-timeout`, `PRE-394`). `500` is `INTERNAL`,
        `DEFINITION_INTEGRITY_FAILED` or `EVENT_LISTENER_FAILED` (a host event listener threw, so the change was rolled
        back), with a correlation id only.
      headers:
        WWW-Authenticate:
          description: Sent with every `401`
          schema: { type: string }
        Retry-After:
          description: Seconds to wait; sent with `409 IDEMPOTENCY_IN_FLIGHT`
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    CalendarWeek:
      type: object
      description: Working hours per weekday as local ranges; a weekday that is absent is not a working day.
      propertyNames: { enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
      additionalProperties:
        type: array
        maxItems: 8
        items: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]-([0-2][0-9]:[0-5][0-9]|24:00)$', example: '08:00-17:00' }
    WorkingCalendar:
      type: object
      required: [zone, week, holidays]
      description: A time zone, working hours per weekday and holidays. Every computation uses the zone, never the host's.
      properties:
        zone: { type: string, example: Asia/Ho_Chi_Minh }
        week: { $ref: '#/components/schemas/CalendarWeek' }
        holidays:
          type: object
          description: Local dates that are not working days, each with a description of at most 200 characters; at most 2,000.
          additionalProperties: { type: string, maxLength: 200 }
    Calendar:
      type: object
      required: [key, version, calendar, updatedBy, approvedBy, updatedAt]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1, description: 1 after creation, one more after each approved change }
        calendar: { $ref: '#/components/schemas/WorkingCalendar' }
        updatedBy: { type: string, description: Who proposed the change in force }
        approvedBy: { type: string, description: Who approved it; the proposer only under `calendar.approval=single` }
        updatedAt: { type: string, format: date-time }
    CalendarSummary:
      type: object
      required: [key, version, zone, updatedBy, approvedBy, updatedAt]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1 }
        zone: { type: string }
        updatedBy: { type: string }
        approvedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    CalendarPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CalendarSummary' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    CalendarProposal:
      type: object
      required: [calendar, reason]
      additionalProperties: false
      properties:
        calendar: { $ref: '#/components/schemas/WorkingCalendar' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CalendarDecision:
      type: object
      additionalProperties: false
      properties:
        comment: { type: string, maxLength: 500, description: Optional on approval; required, with a reason, on rejection }
        expectedChangeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            On approval only (PD-139, #473, AUD-02): the `contentHash` of the change as `GET /approvals` showed it.
            Required: a missing value is `400 CONTENT_HASH_REQUIRED` and another value is `409 CONTENT_CHANGED`; nothing
            is written. Ignored on rejection.
    CalendarChange:
      type: object
      required: [id, calendarKey, status, approval, baseVersion, previous, proposed, reason, proposedBy, proposedAt,
        decidedBy, decidedAt, comment]
      properties:
        id: { type: string }
        calendarKey: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approval: { type: string, enum: [FOUR_EYES, SINGLE], description: '`SINGLE` only when the dev profile let the proposer apply it alone' }
        baseVersion: { type: integer, minimum: 0, description: The calendar version the proposal was made against, 0 for a new calendar }
        previous:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WorkingCalendar'
        proposed: { $ref: '#/components/schemas/WorkingCalendar' }
        reason: { type: string }
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        comment: { type: [string, 'null'] }
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The hash of the key, the base version and the proposed calendar, to send back as `expectedChangeHash` on approval (PD-139, #473); the value of the item in `GET /approvals`
    CalendarChangePage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CalendarChange' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    IncidentReason:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Required; at most `lifecycle.reason-max-length` (2,000) characters, else `400 INPUT_INVALID`
    Incident:
      type: object
      required: [id, instanceId, nodeId, tokenId, errorCode, causeSummary, retryCount, status, lockVersion, retrying,
        createdAt, resolvedAt, resolution, resolvedBy, pendingResolution, allowedActions]
      properties:
        id: { type: string }
        instanceId: { type: string }
        nodeId: { type: string }
        tokenId: { type: [string, 'null'] }
        errorCode: { type: string, description: 'For example `ADAPTER_TIMEOUT`, `AGENT_TIMEOUT` or `UNHANDLED_BUSINESS_ERROR`; a step that calls a process (#92) raises `CHILD_FAILED` or `CHILD_CANCELLED` when its child ended without completing, `NO_EFFECTIVE_VERSION` when the called definition has no effective or pinned version in the tenant, `CALL_DEPTH_EXCEEDED` when the call would sit deeper than `calls.max-depth`, and `OUTPUT_VARIABLE_MISSING` when the child did not set a declared output; a looped step (#496) raises `MULTI_INSTANCE_LIMIT` when its collection, cardinality or loop maximum is over `multi-instance.max`, and `MULTI_INSTANCE_COLLECTION_INVALID` when its collection is not a list; an undo of a compensation walk that failed is `COMPENSATION_FAILED` and a manual undo `COMPENSATION_MANUAL_REQUIRED` (#67): their `nodeId` is the step being undone, their `tokenId` the scope token walked, and their resolution marks the undo done by hand' }
        causeSummary: { type: string, description: Built from codes and numbers only, never from a handler's detail }
        retryCount: { type: integer, minimum: 0 }
        status: { type: string, enum: [OPEN, RESOLUTION_PENDING, RESOLVED] }
        lockVersion: { type: integer, minimum: 0 }
        retrying: { type: boolean, description: A retry is in flight; neither a retry nor a resolution is offered }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolution:
          type: [string, 'null']
          enum: [RETRY_SUCCEEDED, COMPLETED_MANUALLY, INSTANCE_CANCELLED, null]
        resolvedBy: { type: [string, 'null'] }
        pendingResolution:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PendingResolution'
        allowedActions:
          type: array
          description: Computed for the caller; empty without `processes:incident:manage`
          items: { type: string, enum: [retry, resolve, approve-resolution, reject-resolution] }
    PendingResolution:
      type: object
      required: [proposedBy, proposedAt, reason, output, approvalMode]
      properties:
        proposedBy: { type: string }
        proposedAt: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
        output:
          type: object
          additionalProperties: true
          description: As history keeps it; an agent step's output is masked by its output schema
        approvalMode: { type: [string, 'null'], enum: [four-eyes, single, null] }
    IncidentPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    AsyncStepResult:
      type: object
      required: [attemptId, completionToken, status]
      properties:
        attemptId:
          type: string
          maxLength: 26
          description: The attempt id the adapter received (`AdapterCall.attemptId`); a correlation id, not a credential
        completionToken:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: |
            The completion token the adapter received (`AdapterCall.completionToken`): 256 random bits, base64url, new
            for every attempt. The engine stores only its SHA-256; never log it
        status:
          type: string
          enum: [COMPLETED, FAILED, BUSINESS_ERROR]
        output:
          type: object
          additionalProperties: true
          description: For `COMPLETED`; stored in the step's result variable
        errorCode:
          type: string
          maxLength: 100
          description: Required for `FAILED` and `BUSINESS_ERROR`; recorded in history
        retryable:
          type: boolean
          default: true
          description: For `FAILED`; `false` fails the job without a retry
    MessageCorrelation:
      type: object
      required: [messageName]
      properties:
        messageName: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z][A-Za-z0-9_.:-]*$' }
        correlationKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Required for a message that a waiting step receives; optional for a message that starts a process
        payload:
          type: object
          additionalProperties: true
          description: Only the fields a step names with `horus:output` are kept; a start message keeps all of them as variables
    MessageDelivery:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [DELIVERED, STARTED, WAITING] }
        instanceId: { type: string, description: The instance that received it or that it started; absent for WAITING }
        nodeId: { type: string, description: The step that received the message; absent for STARTED and WAITING }
    AsyncStepCompletion:
      type: object
      required: [jobId, attemptId, outcome]
      properties:
        jobId: { type: string }
        attemptId: { type: string }
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, DISCARDED, REFUSED]
          description: |
            `ACCEPTED`: recorded. `DUPLICATE`: the attempt was already completed; nothing written. `DISCARDED`: the
            attempt is no longer current; nothing changed in the process. `REFUSED`, always final: the result broke the
            step's output schema after its schema retries, its guardrail refused it, or the guardrail could not be
            evaluated; nothing of it was accepted, the refusal is recorded in the history, and the step went to review
            or its job failed. A schema violation that still has a retry is `ACCEPTED` (a failed attempt, retried).
    Money:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount:
          type: integer
          description: Minor units
    SignalBroadcast:
      type: object
      required: [signalId, name, waiters, startedInstances]
      properties:
        signalId: { type: string, minLength: 26, maxLength: 26 }
        name: { type: string }
        waiters:
          type: integer
          minimum: 0
          description: How many waiting subscriptions of the tenant this broadcast will wake
        startedInstances:
          type: array
          items: { type: string, minLength: 26, maxLength: 26 }
          description: The instances a signal start event of this name started
    StartRequest:
      type: object
      required: [definitionKey]
      properties:
        definitionKey: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
        businessKey: { type: string, minLength: 1, maxLength: 200 }
        variables:
          type: object
          additionalProperties: true
          description: At most 256 KB of JSON. Floating-point numbers are read as decimals; money is a Money object.
    TaskForm:
      type: object
      description: The resolved form of a task, `task-form.v1.schema.json`. Exactly one of `form` and `link`.
      required: [schemaVersion, taskId, lockVersion]
      properties:
        schemaVersion: { type: integer, const: 1 }
        taskId: { type: string }
        lockVersion: { type: integer, format: int64, description: The value to send as `If-Match` }
        form:
          type: object
          required: [schema, hints, data]
          properties:
            schema:
              type: object
              additionalProperties: true
              description: JSON Schema 2020-12 of the result, in the task-form subset
            hints:
              type: object
              properties:
                order: { type: array, items: { type: string } }
                widgets:
                  type: object
                  additionalProperties:
                    type: string
                    enum: [text, textarea, select, radio, checkbox, date, datetime, money, readonly]
                labels:
                  type: object
                  description: Per field, per locale
                  additionalProperties:
                    type: object
                    additionalProperties: { type: string, maxLength: 200 }
                readOnly: { type: array, items: { type: string } }
                options:
                  type: object
                  description: |
                    PRE-393. Per enum field, per value: `{label: {locale: text}, consequence?: {locale: text}}`.
                    Display only; the value sent on completion is the enum value.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: object
                      required: [label]
                      properties:
                        label: { type: object, additionalProperties: { type: string, maxLength: 200 } }
                        consequence: { type: object, additionalProperties: { type: string, maxLength: 300 } }
                units:
                  type: object
                  description: PRE-393. Per field, a suffix per locale such as `months`
                  additionalProperties:
                    type: object
                    additionalProperties: { type: string, maxLength: 30 }
                formats:
                  type: object
                  description: |
                    PRE-393. Per field, display of a number or amount: `grouping` (locale-aware thousands), and
                    at most one of `currency` (fixed ISO 4217 code) and `currencyFrom` (a declared field holding it).
                  additionalProperties:
                    type: object
                    properties:
                      grouping: { type: boolean }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      currencyFrom: { type: string }
              additionalProperties: true
            data:
              type: object
              additionalProperties: true
              description: Prefilled values; a field the schema marks `mask` is `***`
        link:
          type: string
          maxLength: 2000
          description: The host's own screen, relative or on an origin of `tasks.form-link-origins`
      oneOf:
        - required: [form]
        - required: [link]
    Task:
      type: object
      required: [id, instanceId, definitionKey, definitionVersion, nodeId, assignee, fourEyes, status, lockVersion,
        createdAt, allowedActions]
      properties:
        id: { type: string }
        instanceId: { type: string }
        definitionKey: { type: string }
        definitionVersion: { type: integer }
        businessKey: { type: [string, 'null'] }
        nodeId: { type: string }
        name: { type: [string, 'null'] }
        assignee: { type: string, description: 'user:<id>, role:<role> or group:<group>' }
        fourEyes: { type: boolean }
        status: { type: string, enum: [OPEN, CLAIMED, COMPLETED, CANCELLED] }
        lockVersion: { type: integer, description: The value to send as If-Match }
        claimedBy: { type: [string, 'null'] }
        claimedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        dueAt:
          type: [string, 'null']
          format: date-time
          description: When the task is due, counted in working time from its creation; fixed then, never moved
        completedBy: { type: [string, 'null'] }
        completedAt: { type: [string, 'null'], format: date-time }
        allowedActions:
          type: array
          description: What this caller may do now; computed per caller, never stored
          items: { type: string, enum: [claim, unclaim, complete, reassign, delegate] }
        review:
          $ref: '#/components/schemas/ReviewContext'
    TaskHandOver:
      type: object
      required: [assignee, reason]
      additionalProperties: false
      properties:
        assignee: { type: string, minLength: 1, maxLength: 200, description: The user id the task is handed to }
        reason: { type: string, minLength: 1, maxLength: 500, description: Why; recorded in the history and the event }
    TaskSummary:
      type: object
      required: [id, instanceId, definitionKey, definitionVersion, nodeId, assignee, status, lockVersion, createdAt, slaState]
      properties:
        id: { type: string }
        instanceId: { type: string }
        definitionKey: { type: string }
        definitionVersion: { type: integer }
        businessKey: { type: [string, 'null'] }
        nodeId: { type: string }
        name: { type: [string, 'null'] }
        assignee: { type: string, description: 'user:<id>, role:<role> or group:<group>' }
        status: { type: string, enum: [OPEN, CLAIMED] }
        lockVersion: { type: integer }
        claimedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        slaState:
          type: string
          enum: [NONE, ON_TIME, DUE_SOON, BREACHED]
          description: >-
            Computed by the engine at query time (PD-111). `NONE` without a due time; `BREACHED` once `dueAt` has
            passed; `DUE_SOON` within `query.due-soon-window` (one hour by default) before it; else `ON_TIME`.
        overdueBy:
          type: [string, 'null']
          format: duration
          description: Clock time since `dueAt` as an ISO 8601 duration in whole minutes (for example `PT2H5M`); null unless `BREACHED`.
          example: PT2H5M
    TaskSummaryPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    ReviewContext:
      type: object
      description: >-
        Present only on the four-eyes review task of an agent step whose answer was refused. Why it was refused, the
        inputs the agent saw, and the answer masked by the output schema's masking policy: a value is kept only where
        the schema declares the field and does not mark it `mask: true`, other values are `***`, and strings, lists
        and nesting are bounded.
      required: [code, reasons, ruleIds, inputs, output, outputFields]
      properties:
        code:
          type: string
          description: '`GUARDRAIL_VIOLATION`, `GUARDRAIL_EVALUATION_ERROR` or `AGENT_SCHEMA_INVALID`'
        reasons: { type: array, items: { type: string } }
        ruleIds: { type: array, items: { type: string }, description: The matched guardrail rules }
        guardrailDecisionId: { type: string, description: 'The guardrail decision in the Rule Engine log, when one was logged' }
        inputs: { type: object, additionalProperties: true, description: 'The bounded inputs the agent received; an input the step marks mask="true" is its keyed fingerprint (hmac:<keyId>:<hex>) or ***, never the plain value' }
        output: { type: object, additionalProperties: true, description: The refused answer, masked }
        outputFields: { type: integer, description: Number of top-level fields in the answer }
        attemptId: { type: string, description: The refused attempt }
        reportedBy: { type: string, description: 'Who reported the refused answer: the engine replica, or the caller of the completion API. Never the reviewer (four eyes)' }
        fieldTitles:
          type: object
          description: >-
            Titles the definition declares for the step's fields, so a screen shows `Risk score` or `Điểm rủi ro`
            instead of the API name (#386, `PRE-217`). Per side, a field name maps to a language tag and its title;
            the language list is open. A field with no title is shown by its name in words. Labels only: nothing
            reads them. Absent when the step declares none.
          properties:
            inputs: { $ref: '#/components/schemas/FieldTitleMap' }
            outputs: { $ref: '#/components/schemas/FieldTitleMap' }
          additionalProperties: false
    FieldTitleMap:
      type: object
      maxProperties: 100
      additionalProperties:
        type: object
        maxProperties: 10
        additionalProperties: { type: string, minLength: 1, maxLength: 120 }
        example: { en: Risk score, vi: Điểm rủi ro }
    StepCatalogue:
      type: object
      required: [handlers, agents, ruleSets, calendars, roles]
      properties:
        handlers:
          type: array
          items:
            type: object
            required: [name, mode, inputSchema, compensable]
            properties:
              name: { type: string, description: 'The name a step uses in `horus:handler`' }
              mode: { type: string, enum: [local, remote] }
              inputSchema: { type: object, additionalProperties: true, description: 'JSON Schema of the input; empty when the host declared none' }
              compensable: { type: boolean }
        agents:
          type: array
          items:
            type: object
            required: [name, inputSchema]
            properties:
              name: { type: string, description: 'The name a step uses in `horus:agent`' }
              inputSchema: { type: object, additionalProperties: true }
        ruleSets:
          type: object
          required: [decision, guardrail]
          properties:
            decision:
              type: array
              description: Rule sets with a version in effect, usable as decision steps
              items: { $ref: '#/components/schemas/CatalogueRuleSet' }
            guardrail:
              type: array
              description: The decision rule sets that also meet the guardrail contract (hit policy first or unique, output allow boolean)
              items: { $ref: '#/components/schemas/CatalogueRuleSet' }
        calendars: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string }, description: 'Empty when the host lists no roles' }
    CatalogueRuleSet:
      type: object
      required: [name, version, hitPolicy, inputs, outputs]
      properties:
        name: { type: string }
        version: { type: integer, minimum: 1 }
        hitPolicy: { type: string, description: "FIRST, UNIQUE or COLLECT" }
        inputs: { type: object, additionalProperties: { type: string }, description: Each declared input and its type }
        outputs: { type: object, additionalProperties: { type: string }, description: Each declared output and its type }
    DefinitionSummary:
      type: object
      required: [key, latestVersion, latestStatus, lastChangedAt]
      properties:
        key: { type: string }
        name: { type: [string, 'null'], description: Name of the latest version }
        latestVersion: { type: integer, minimum: 1 }
        latestStatus: { type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, RETIRED] }
        effectiveVersion:
          type: [integer, 'null']
          description: The version a start uses now, or null when the key has no active version
        lastChangedAt: { type: string, format: date-time }
    PendingApproval:
      type: object
      required: [kind, id, key, version, sourceVersion, definitionHash, contentHash, lockVersion, requestedBy,
        requestedByName, requestedAt, reason, allowedActions, deniedActions]
      properties:
        kind:
          type: string
          enum: [DEFINITION, MIGRATION_PLAN, CALENDAR_CHANGE]
        id:
          type: [string, 'null']
          description: The id of the definition version, the migration plan or the calendar change
        key: { type: string, description: The definition key, or the calendar key of a calendar change }
        name: { type: [string, 'null'] }
        version:
          type: integer
          minimum: 1
          description: The definition version; for a migration plan the version it moves to; for a calendar change the version the calendar takes when approved
        sourceVersion:
          type: [integer, 'null']
          description: For a migration plan the version the instances run on, otherwise null
        definitionHash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The value the reviewer sends back as `expectedDefinitionHash` (`PRE-177`, PD-139); null for a migration plan and a calendar change
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The hash of what the reviewer was shown, to send back with the approval (PD-139); a mismatch is `409 CONTENT_CHANGED`
        reason:
          type: [string, 'null']
          description: What the proposer wrote for a migration plan or a calendar change; null for a definition version
        lockVersion: { type: integer, format: int64, description: The value to send as `If-Match` }
        requestedBy: { type: string, description: The requester's user id, which the four-eyes checks compare }
        requestedByName:
          type: string
          description: |
            The requester as a screen shows them, from the host's `DisplayNames` in the caller's language (#442,
            `PRE-206`); the user id when the host knows no name. A label only.
        requestedAt: { type: string, format: date-time }
        allowedActions:
          type: array
          items: { type: string, enum: [approve, reject, withdraw] }
        deniedActions:
          type: object
          description: For `approve` and `reject` the caller may not send, the reason as a code
          properties:
            approve: { $ref: '#/components/schemas/PendingDenial' }
            reject: { $ref: '#/components/schemas/PendingDenial' }
          additionalProperties: false
    PendingDenial:
      type: string
      enum: [PERMISSION_REQUIRED, SELF_APPROVAL_FORBIDDEN]
    PendingApprovalPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PendingApproval' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    DefinitionSummaryPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DefinitionSummary' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    ExistingInstanceSummary:
      type: object
      description: What a caller without `processes:read` learns of an instance that already has the business key
      required: [id, status, created]
      additionalProperties: false
      properties:
        id: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, CANCELLED, COMPENSATING, FAILED] }
        created: { type: boolean, enum: [false] }
    InstanceSummary:
      type: object
      required: [id, definitionKey, definitionVersion, status, lockVersion, startedAt]
      properties:
        id: { type: string }
        definitionKey: { type: string }
        definitionVersion: { type: integer }
        businessKey: { type: [string, 'null'] }
        status: { type: string, enum: [RUNNING, COMPLETED, CANCELLED, COMPENSATING, FAILED] }
        lockVersion: { type: integer }
        startedBy: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    InstanceSummaryPage:
      type: object
      required: [data, nextCursor, hasNext]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/InstanceSummary' }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    DefinitionVersion:
      type: object
      required: [id, key, version, status, definitionHash, sourceFormat, sourceHash, nodeCount, createdBy, createdAt]
      properties:
        id: { type: string }
        key: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, RETIRED] }
        name: { type: [string, 'null'] }
        definitionHash:
          type: string
          description: SHA-256 of the RFC 8785 form of the canonical v1 profile; checked before every compile
        sourceFormat: { type: string, enum: [BPMN_XML, JSON, YAML] }
        sourceHash:
          type: string
          description: SHA-256 of the stored source document; checked before every compile
        sourceDocument:
          type: string
          description: The original imported text, byte for byte; only with `include=source` (PRE-039)
        nodeCount: { type: integer }
        approvedBy:
          type: [string, 'null']
          description: The approver; `system:dev-auto-approve` for a dev-profile auto-approval
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        source: { type: [string, 'null'], enum: [IMPORT, STARTUP, AUTHORED, BPMN, null] }
        lockVersion: { type: integer, description: Send as If-Match on the lifecycle commands }
        effectiveFrom:
          type: [string, 'null']
          format: date-time
          description: When the version is (or will be) the effective one; on a pending version, the requested date
        requestedBy: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
        decisionComment: { type: [string, 'null'], description: The approval comment or the last rejection reason }
        retiredBy:
          type: [string, 'null']
          description: '`system:effective-date` when a newer version took effect'
        retiredAt: { type: [string, 'null'], format: date-time }
        supersededBy: { type: [integer, 'null'], description: The version that superseded this one }
        alsoImported:
          type: array
          description: |
            In the answer to an import of a collaboration (#497): the other executable pools of the file, each a
            definition of its own. The answer itself is the first one. Absent for a file of one process.
          items:
            type: object
            required: [key, version]
            properties:
              key: { type: string }
              version: { type: integer }
        warnings:
          type: array
          description: |
            Present on `GET /definitions/{key}/versions/{version}` and `:request-approval` (PD-146, #438, `PRE-205`):
            one `UNCLASSIFIED_FIELD` per agent step input or output schema property that declares neither
            `mask` true nor false. A reminder only: it never blocks the request or the approval. Empty when every
            field is classified or while `horus.bpm.processes.classification.warn-unclassified` is `false`. The engine
            never infers sensitivity from a name or a value. In the answer to an import, when the file has vendor
            attributes or extension elements, each is also listed as `FOREIGN_EXTENSION_IGNORED` with the namespace in
            `message` and the line: they were kept in the stored source and not read, the same items as `warnings` of
            a refusal (PD-141).
          items:
            anyOf:
              - { $ref: '#/components/schemas/UnclassifiedFieldWarning' }
              - { $ref: '#/components/schemas/DefinitionProblemItem' }
    UnclassifiedFieldWarning:
      type: object
      required: [code, step, field, direction, message]
      additionalProperties: false
      properties:
        code: { type: string, enum: [UNCLASSIFIED_FIELD] }
        step: { type: string, description: The id of the agent step }
        field:
          type: string
          description: The input name, or the output property path such as `summary` or `applicant.name`
        direction: { type: string, enum: [INPUT, OUTPUT] }
        message: { type: string, description: The reminder in English, naming the step and the field, never a value }
      example:
        code: UNCLASSIFIED_FIELD
        step: assess-documents
        field: requestedAmount
        direction: INPUT
        message: 'Input requestedAmount of step assess-documents is not classified: it declares neither mask true nor mask false. This does not block approval.'
    DefinitionHistoryEntry:
      type: object
      required: [action, toStatus, actor, occurredAt]
      properties:
        action: { type: string, enum: [IMPORTED, REQUESTED, APPROVED, REJECTED, RETIRED] }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: string }
        actor: { type: string }
        comment: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    ProcessInstance:
      type: object
      required: [id, definitionKey, definitionVersion, status, variables, tokens, tasks, lockVersion, startedAt]
      properties:
        id: { type: string }
        definitionKey: { type: string }
        definitionVersion: { type: integer }
        businessKey: { type: [string, 'null'] }
        status: { type: string, enum: [RUNNING, COMPLETED, CANCELLED, COMPENSATING, FAILED] }
        variables: { type: object, additionalProperties: true }
        tokens:
          type: array
          items:
            type: object
            required: [id, kind, nodeId, status]
            properties:
              id: { type: string }
              kind: { type: string, enum: [SCOPE, MI_BODY, FLOW] }
              scopeTokenId: { type: [string, 'null'] }
              nodeId: { type: string }
              status:
                type: string
                enum: [ACTIVE, WAITING_USER, WAITING_ASYNC, WAITING_TIMER, WAITING_EVENT, WAITING_SCOPE, WAITING_CHILD,
                  JOINED, COMPLETED, CANCELLED, COMPENSATED]
        tasks:
          type: array
          items:
            type: object
            required: [id, nodeId, assignee, status, lockVersion]
            properties:
              id: { type: string }
              nodeId: { type: string }
              name: { type: [string, 'null'] }
              assignee: { type: string, description: 'user:<id>, role:<role> or group:<group>' }
              status: { type: string, enum: [OPEN, CLAIMED, COMPLETED, CANCELLED] }
              lockVersion: { type: integer, description: The value to send as If-Match to claim, unclaim or complete }
              claimedBy: { type: [string, 'null'] }
              claimedAt: { type: [string, 'null'], format: date-time }
              completedBy: { type: [string, 'null'] }
        lockVersion: { type: integer }
        startedBy: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
    InstanceActivities:
      type: object
      required: [instanceId, startedAt, endedAt, nodes, entries, compensations, hasMore]
      properties:
        instanceId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        nodes:
          type: array
          description: One item per step the instance entered, in the order it first entered them
          items:
            type: object
            required: [nodeId, state, enteredAt, completedAt, durationMs, attempts, actor, incident, cause]
            properties:
              nodeId: { type: string }
              state:
                type: string
                enum: [ACTIVE, COMPLETED, CANCELLED, TERMINATED, INCIDENT]
                description: >-
                  `ACTIVE`: entered and not left since; `COMPLETED`: its last closing event is a completion (also a step
                  of a normally ended instance with no closing row); `CANCELLED`: interrupted by an event, that is a
                  boundary event, a rival catch of an event-based gateway or an interrupting event sub-process, or
                  cancelled before causes were recorded; `TERMINATED`: ended by a terminate end event, an ad-hoc
                  cancel, an instance cancel or an undo, or still open when its instance ended cancelled or failed with
                  no closing row; `INCIDENT`: holds an open incident. `CANCELLED` and `TERMINATED` were added after the
                  first three values, so a client must tolerate a value it does not know. A compensated step keeps its
                  state; the undo is in `compensations`.
              cause:
                type: [string, 'null']
                description: >-
                  Why a `CANCELLED` or `TERMINATED` step was cut off, as recorded when it happened: `BOUNDARY`,
                  `EVENT_GATEWAY`, `INTERRUPTING_EVENT_SUBPROCESS`, `MULTIPLE_EVENT`, `MULTI_INSTANCE_COMPLETED`
                  (state `CANCELLED`); `TERMINATE_END`, `ADHOC_CANCEL`, `INSTANCE_CANCELLED`, `COMPENSATION`,
                  `TRANSACTION_CANCEL` (state `TERMINATED`). Null for any other step, for a step cancelled before
                  causes were recorded, and for a step left open when the instance ended. A client must tolerate a
                  value it does not know.
              enteredAt: { type: [string, 'null'], format: date-time, description: First entry }
              completedAt: { type: [string, 'null'], format: date-time, description: Last completion }
              durationMs:
                type: [integer, 'null']
                minimum: 0
                description: From the first entry to the last completion, computed by the engine; null until it completes
              attempts: { type: integer, minimum: 0 }
              actor: { type: [string, 'null'], description: 'The last identity that acted on the step; null for engine steps' }
              incident:
                type: [object, 'null']
                required: [code, openedAt]
                properties:
                  code: { type: string, description: 'The error code, for example AGENT_TIMEOUT' }
                  openedAt: { type: string, format: date-time }
        entries:
          type: array
          description: History entries in time order, at most `limit`
          items:
            type: object
            required: [id, type, nodeId, actor, occurredAt]
            properties:
              id: { type: string }
              type: { type: string, description: 'For example INSTANCE_STARTED, NODE_ENTERED, NODE_COMPLETED, TASK_COMPLETED, INCIDENT_RAISED, INSTANCE_ENDED' }
              nodeId: { type: [string, 'null'] }
              actor: { type: [string, 'null'] }
              occurredAt: { type: string, format: date-time }
              kind:
                type: string
                enum: [STEP, COMPENSATION]
                description: '`COMPENSATION` for an entry of an undo: its start, one undo step, or its end (#80, PRE-203)'
              compensates: { type: string, description: 'Undo steps only: the step this undo undoes' }
              attemptId: { type: string, description: 'The attempt of the entry; for an undo step, the forward attempt it undoes' }
              scopeTokenId: { type: string, description: 'Entries of an undo: the token of the saga scope' }
              scope: { type: string, description: 'Entries of an undo: the BPMN id of the saga scope, for example disburse' }
              attempt: { type: integer, minimum: 1, description: 'Undo steps that ran: the attempt number of the undo job' }
              errorCode: { type: string, description: 'Undo steps that failed: the error code' }
              handler: { type: string, description: 'Undo steps: the name of the undo handler' }
              cause: { type: string, description: 'The start of an undo: the error code that caused it' }
              waiters: { type: integer, minimum: 0, description: 'A `SIGNAL_THROWN` entry: how many waiting subscriptions of the tenant the broadcast woke (#492)' }
              message:
                type: object
                description: >-
                  Message steps only (`MESSAGE_WAITING`, `MESSAGE_RECEIVED`, `MESSAGE_SENT`, #491): the message name, the
                  correlation key as the host's `InputMasker` made it (a keyed fingerprint or `***`, never the plain key)
                  and the delivery result
                required: [name, result]
                properties:
                  name: { type: string }
                  correlationKey: { type: string, description: The masked key; absent when the step has none }
                  result: { type: string, enum: [WAITING, DELIVERED, HANDED_OVER] }
              instances:
                type: object
                description: >-
                  Entries of a loop or multi-instance step (`MI_STARTED`, `MI_INSTANCE_STARTED`, `MI_INSTANCE_COMPLETED`,
                  `MI_INSTANCE_CANCELLED`, `MI_COMPLETED`, `MI_REFUSED`, #496): the counters when the entry was written, so the
                  cockpit reads "3 of 5 done" and never counts
                properties:
                  loopCounter: { type: integer, minimum: 1, description: 'The repetition the entry is about, counted from 1; absent for an entry about the whole step' }
                  nrOfInstances: { type: integer, minimum: 0, description: 'How many repetitions the step has; absent for a standard loop, which has no fixed number' }
                  nrOfActiveInstances: { type: integer, minimum: 0 }
                  nrOfCompletedInstances: { type: integer, minimum: 0 }
              flows: { type: array, items: { type: string }, description: 'A gateway that chose its flows (`NODE_COMPLETED`): the ids of the sequence flows it took (#494)' }
              reason: { type: string, enum: [conditions, default], description: '`conditions`: every flow taken had no condition or a true one; `default`: none had, so the default flow was taken' }
              waitingFor: { type: array, items: { type: string }, description: 'An inclusive join that waits (`TOKEN_JOINED`): the ids of the steps a token can still arrive from; empty when it fires (#494)' }
              event:
                type: object
                description: >-
                  `BOUNDARY_FIRED` and `EVENT_GATEWAY_RESOLVED` entries only (#490, #495): what fired a boundary event, or
                  which catch event of an event-based gateway won and which were cancelled. Names, codes and condition
                  text; never a variable value
                properties:
                  trigger: { type: string, enum: [TIMER, MESSAGE, SIGNAL, CONDITION, ERROR, ESCALATION], description: '`BOUNDARY_FIRED`: what fired it' }
                  name: { type: string, description: '`BOUNDARY_FIRED`: the message name, the signal name, the condition text or the error or escalation code; absent for a timer' }
                  interrupting: { type: boolean, description: '`BOUNDARY_FIRED`: whether it cancelled the step it sits on' }
                  gateway: { type: string, description: '`EVENT_GATEWAY_RESOLVED`: the id of the gateway' }
                  winner: { type: string, description: '`EVENT_GATEWAY_RESOLVED`: the id of the catch event that fired first' }
                  cancelled:
                    type: array
                    items: { type: string }
                    description: '`EVENT_GATEWAY_RESOLVED`: the ids of the catch events that were cancelled'
              resultVariable: { type: string, description: 'The `NODE_COMPLETED` of a script step: the variable it set, as recorded when it ran (#518). Absent for other entries' }
              submission:
                type: object
                additionalProperties: true
                description: >-
                  The `TASK_COMPLETED` of a task that has a form (#663, `PRE-390`): the values the user submitted, as
                  validated and stored in the same transaction. Every field the form schema marks `mask: true` is the
                  marker object `{"masked": true}`, so an audit tells a masked value from a real one; the plain value is
                  never stored and never returned. A field the form does not declare is not stored (see `unrecordedFields`). It does not change when the case's
                  variables change later. Absent for a task completed before this was recorded, for a task without a
                  form, for a link task and for every other entry
              unrecordedFields:
                type: array
                items: { type: string }
                description: >-
                  The `TASK_COMPLETED` of a task whose submission held fields the form does not declare (#663): their
                  paths, for example `note` or `address.floor`, at most 50. Their values are not stored. Absent when
                  there were none
        compensations:
          type: array
          description: >-
            One item per saga scope whose undo started, in the order they started, never cut by `limit` (#80,
            PRE-203). The cockpit shows `state` as it is and never infers it from the entries
          items:
            type: object
            required: [scopeTokenId, scope, state, startedAt, endedAt, cause, failingStep, stepsUndone, blockedStep, incidentId, incidentCode]
            properties:
              scopeTokenId: { type: string }
              scope: { type: [string, 'null'], description: BPMN id of the saga scope }
              state:
                type: string
                enum: [IN_PROGRESS, UNDONE, NOT_FULLY_UNDONE]
                description: '`UNDONE`: every step undone and the scope ended; `NOT_FULLY_UNDONE`: an undo step failed for good or waits for a person and the walk is paused'
              startedAt: { type: string, format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
              cause: { type: [string, 'null'], description: The error code of the forward step that failed }
              failingStep: { type: [string, 'null'], description: The forward step whose failure started the undo }
              stepsUndone: { type: integer, minimum: 0 }
              blockedStep: { type: [string, 'null'], description: 'The step whose undo failed or waits for a person; null unless NOT_FULLY_UNDONE' }
              incidentId: { type: [string, 'null'], description: The open incident of that step, to link to }
              incidentCode: { type: [string, 'null'] }
        hasMore: { type: boolean, description: The instance has more entries than `entries` holds }
    NodeCounts:
      type: object
      required: [definitionKey, version, mode, asOf, nodes]
      properties:
        definitionKey: { type: string }
        version: { type: integer, minimum: 1 }
        mode: { type: string, enum: [live] }
        asOf: { type: string, format: date-time, description: When the counts were read }
        nodes:
          type: object
          description: Node id to token status to count
          additionalProperties:
            type: object
            additionalProperties: { type: integer, minimum: 1 }
    NodeWindowStats:
      type: object
      required: [definitionKey, version, mode, from, to, nodes]
      properties:
        definitionKey: { type: string }
        version: { type: integer, minimum: 1 }
        mode: { type: string, enum: [window] }
        from: { type: string, format: date-time, description: Start of the first hour covered }
        to: { type: string, format: date-time, description: End of the last hour covered }
        asOf:
          type: [string, 'null']
          format: date-time
          description: The rollup watermark; history before it is counted. Null before the first rollup run
        lagSeconds:
          type: [integer, 'null']
          minimum: 0
          description: Seconds between the watermark and now. Null before the first rollup run
        nodes:
          type: object
          description: Node id to its figures
          additionalProperties:
            type: object
            required: [entered, completed, failed, incidents, slaBreaches]
            properties:
              entered: { type: integer, minimum: 0 }
              completed: { type: integer, minimum: 0 }
              failed: { type: integer, minimum: 0 }
              incidents: { type: integer, minimum: 0 }
              slaBreaches: { type: integer, minimum: 0 }
              meanMs: { type: [integer, 'null'], description: Mean completed duration; null without a completion }
              p50Ms: { type: [integer, 'null'], description: Median within 19 percent; null without a completion }
              p95Ms: { type: [integer, 'null'], description: 95th percentile within 19 percent; null without a completion }
    AgentReplayRequest:
      type: object
      required: [definitionKey, nodeId, from, to, candidate]
      properties:
        definitionKey: { type: string }
        nodeId: { type: string, description: The agent step }
        from: { type: string, format: date, description: First UTC day, inclusive }
        to: { type: string, format: date, description: Last UTC day, inclusive }
        candidate:
          type: object
          required: [ruleSet, version]
          properties:
            ruleSet: { type: string }
            version: { type: integer, minimum: 1, description: Any status, usually a draft }
            outputSchema:
              type: object
              additionalProperties: true
              description: A candidate output schema; without one each answer is checked against its recorded schema
    AgentReplayRun:
      type: object
      required: [id, status, definitionKey, nodeId, from, to, candidate, summary, createdBy, createdAt, expiresAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
        definitionKey: { type: string }
        nodeId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        candidate:
          type: object
          properties:
            ruleSet: { type: string }
            version: { type: integer }
            outputSchema: { type: boolean, description: Whether a candidate output schema replaces the recorded ones }
        summary:
          type: object
          properties:
            cases: { type: integer }
            unchanged: { type: integer }
            newlyAllowed: { type: integer }
            newlyRefused: { type: integer }
            newlyRoutedToReview: { type: integer }
            overriddenByReviewer: { type: integer, description: Newly allowed cases whose answer a reviewer corrected }
            notReplayed: { type: integer, description: Cases not replayed for another reason, such as GUARD_SPEC_INVALID; masked-input cases are counted apart }
            withMaskedFields: { type: integer, description: Cases with a masked field, left out of the check }
            maskedInputRequired: { type: integer, description: Cases not replayed because the candidate guardrail or schema needs the value of a masked field (MASKED_INPUT_REQUIRED) }
        failureCode: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
    AgentReplayCase:
      type: object
      required: [attemptId, instanceId, recordedAt, recordedOutcome, candidateOutcome, change, recordedRuleIds, candidateRuleIds, flags, maskedFields]
      properties:
        attemptId: { type: string }
        instanceId: { type: string }
        recordedAt: { type: string, format: date-time }
        recordedOutcome: { type: string, enum: [ALLOWED, REVIEW, REFUSED] }
        candidateOutcome: { type: string, enum: [ALLOWED, REVIEW, REFUSED, NOT_REPLAYED] }
        change: { type: string, enum: [UNCHANGED, NEWLY_ALLOWED, NEWLY_REFUSED, NEWLY_ROUTED_TO_REVIEW, NOT_REPLAYED] }
        recordedRuleIds: { type: array, items: { type: string } }
        candidateRuleIds: { type: array, items: { type: string } }
        code: { type: [string, 'null'], description: 'The candidate refusal code; when not replayed, GUARD_SPEC_INVALID, or MASKED_INPUT_REQUIRED when the candidate guardrail or schema needs a field history keeps only masked' }
        flags: { type: array, items: { type: string, enum: [OVERRIDDEN_BY_REVIEWER] } }
        maskedFields: { type: integer }
    AgentReplayCasePage:
      type: object
      required: [data, hasNext]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AgentReplayCase' } }
        nextCursor: { type: [string, 'null'] }
        hasNext: { type: boolean }
    UnsupportedElement:
      type: object
      required: [element, elementId, line, stage, message]
      description: >-
        One element of an imported file that the engine refuses by name. The same schema is in the Rule Engine
        OpenAPI file (PD-141)
      properties:
        element: { type: string, description: 'The element name, for example `boundaryEvent`' }
        elementId:
          type: [string, 'null']
          maxLength: 200
          description: The element's `id`; control characters are removed and it is cut at 200 characters
        line: { type: integer, minimum: 1 }
        stage:
          type: string
          enum: [S0, S1, S2, S3, not planned]
          description: >-
            The stage of the coverage table that adds the element, or `not planned`. For an intermediate throw
            event it comes from its event definition: a signal or message throw is `S2`, an escalation throw `S1`
        message: { type: string, description: 'Plain English; the wording may change, the element and the stage are the contract' }
    DefinitionProblemItem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        element: { type: [string, 'null'] }
        elementId: { type: [string, 'null'], description: 'At most 200 characters, control characters removed' }
        line: { type: integer }
        stage:
          type: string
          enum: [S1, S2, S3, not planned, S0]
          description: >-
            Present on a refusal of a standard: the stage of the coverage table that adds the element, or
            `not planned`; `S0` is an element of the current stage that this release has not finished
    GraphDiff:
      type: object
      required: [definitionKey, base, target, approvableHash, identical, nodesAdded, nodesRemoved, nodesChanged, edgesAdded, edgesRemoved, truncated]
      properties:
        definitionKey: { type: string }
        approvableHash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The target's definitionHash, which an approval names after this review; null when truncated (PD-139)
        base: { $ref: '#/components/schemas/GraphDiffSide' }
        target: { $ref: '#/components/schemas/GraphDiffSide' }
        identical: { type: boolean, description: True when both versions have the same steps, values and links }
        nodesAdded:
          type: array
          description: Steps only the target has, sorted by id
          items: { $ref: '#/components/schemas/GraphDiffNode' }
        nodesRemoved:
          type: array
          description: Steps only the base has, sorted by id
          items: { $ref: '#/components/schemas/GraphDiffNode' }
        nodesChanged:
          type: array
          description: One entry per changed value of a step both versions have, sorted by id then path
          items:
            type: object
            required: [id, name, type, path, from, to]
            properties:
              id: { type: string, description: BPMN id of the step }
              name: { type: [string, 'null'], description: Readable name in the target }
              type: { type: [string, 'null'], description: Step type in the target }
              path: { type: string, description: JSON Pointer inside the step's canonical form, for example /assignee/role }
              from: { description: The value in the base, or null when the base has none }
              to: { description: The value in the target, or null when the target has none }
        edgesAdded:
          type: array
          description: Links only the target has, sorted by from, to and kind
          items: { $ref: '#/components/schemas/GraphDiffEdge' }
        edgesRemoved:
          type: array
          description: Links only the base has, sorted by from, to and kind
          items: { $ref: '#/components/schemas/GraphDiffEdge' }
        truncated: { type: boolean, description: True when more than 1,000 changed values were found; always false on a page }
        changeSetHash:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: On the last page of a paged read, the hash of the whole change set, for `expectedChangeSetHash` (PRE-202); null before it
        page:
          type: object
          description: Present on a paged read only (PRE-201)
          required: [offset, total, nextCursor]
          properties:
            offset: { type: integer, minimum: 0, description: Position of the first change of this page in the whole set }
            total: { type: integer, minimum: 0, description: Changes in the whole set }
            nextCursor: { type: [string, 'null'], description: Null on the last page }
    GraphDiffSide:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PENDING_APPROVAL, ACTIVE, RETIRED] }
        definitionHash: { type: string, pattern: '^[0-9a-f]{64}$', description: Omitted when the diff is truncated, and on every page of a paged read but the last }
    GraphDiffNode:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, description: BPMN id of the step }
        name: { type: [string, 'null'] }
        type: { type: string, description: 'Step type in the canonical form, for example userTask' }
    GraphDiffEdge:
      type: object
      required: [id, from, fromName, to, toName, kind]
      properties:
        id: { type: [string, 'null'], description: BPMN id of the sequence flow in its version }
        from: { type: string }
        fromName: { type: [string, 'null'] }
        to: { type: string }
        toName: { type: [string, 'null'] }
        kind: { type: string, pattern: '^(next|default|fork|branch\[[0-9]+\])$' }
    MigrationStepMapping:
      type: object
      description: A renamed step (PRE-207); both steps must be of the same type
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string, maxLength: 100, description: The step id in the source version }
        to: { type: string, maxLength: 100, description: The step id in the target version }
    MigrationStepCancellation:
      type: object
      description: A removed step (PRE-208); its work is cancelled and the token continues at `moveTo`
      required: [step, moveTo, reason]
      additionalProperties: false
      properties:
        step: { type: string, maxLength: 100, description: The step id in the source version, which the target no longer has }
        moveTo: { type: string, maxLength: 100, description: The step id in the target version where the token continues }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Why; at most `lifecycle.reason-max-length` characters; written to the append-only history' }
    MigrationPlanRequest:
      type: object
      required: [definitionKey, sourceVersion, targetVersion]
      additionalProperties: false
      properties:
        definitionKey: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', maxLength: 200 }
        sourceVersion: { type: integer, minimum: 1, description: The version the instances run on }
        targetVersion: { type: integer, minimum: 1, description: The active version they would move to }
        mappings: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MigrationStepMapping' } }
        cancellations: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/MigrationStepCancellation' } }
    MigrationApproval:
      type: object
      required: [mode, secondPersonRequired]
      properties:
        mode: { type: string, enum: [four-eyes, single], description: '`single` only on the dev profile' }
        secondPersonRequired: { type: boolean }
    MigrationPlan:
      type: object
      required: [id, definitionKey, sourceVersion, targetVersion, status, planHash, approval, createdBy, createdAt, mappings, cancellations]
      properties:
        id: { type: string }
        definitionKey: { type: string }
        sourceVersion: { type: integer, minimum: 1 }
        targetVersion: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [PLANNED, PROPOSED, REJECTED, APPROVED, RUNNING, COMPLETED, COMPLETED_WITH_FAILURES]
        planHash: { type: string, pattern: '^[0-9a-f]{64}$', description: The plan's hash, over both versions and the step instructions }
        approval: { $ref: '#/components/schemas/MigrationApproval' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        mappings: { type: array, items: { $ref: '#/components/schemas/MigrationStepMapping' } }
        cancellations: { type: array, items: { $ref: '#/components/schemas/MigrationStepCancellation' } }
    MigrationInstanceSample:
      type: object
      required: [count, instanceIds, truncated]
      properties:
        count: { type: integer, minimum: 0 }
        instanceIds: { type: array, maxItems: 500, items: { type: string } }
        truncated: { type: boolean }
    MigrationDryRun:
      type: object
      required: [migrationId, planHash, definitionKey, sourceVersion, targetVersion, valid, checkedAt, validUntil, approval, instances, nodes, conflicts, movable, impact]
      properties:
        migrationId: { type: string }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        definitionKey: { type: string }
        sourceVersion: { type: integer, minimum: 1 }
        targetVersion: { type: integer, minimum: 1 }
        valid: { type: boolean }
        checkedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        approval: { $ref: '#/components/schemas/MigrationApproval' }
        instances:
          type: object
          required: [running, movable, blocked]
          properties:
            running: { type: integer, minimum: 0 }
            movable: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
        nodes:
          type: array
          description: Each step of the source version with live tokens, sorted by id
          items:
            type: object
            required: [nodeId, name, type, liveTokens, mapping, targetNodeId, targetType]
            properties:
              nodeId: { type: string }
              name: { type: [string, 'null'] }
              type: { type: [string, 'null'] }
              liveTokens: { type: integer, minimum: 1 }
              mapping: { type: string, enum: [SAME_ID, MAPPED, CANCELLED, STEP_NOT_IN_TARGET, STEP_TYPE_CHANGED] }
              targetNodeId: { type: [string, 'null'] }
              targetType: { type: [string, 'null'] }
        conflicts:
          type: array
          description: What blocks the plan, sorted by code and step id
          items:
            type: object
            required: [code, nodeId, name, instances]
            properties:
              code: { type: string, enum: [STEP_NOT_IN_TARGET, STEP_TYPE_CHANGED, TARGET_NOT_ACTIVE, STEP_IN_FLIGHT] }
              nodeId: { type: [string, 'null'] }
              name: { type: [string, 'null'] }
              instances: { $ref: '#/components/schemas/MigrationInstanceSample' }
        movable: { $ref: '#/components/schemas/MigrationInstanceSample' }
        impact:
          type: object
          description: How many running instances each kind of step instruction touches (PRE-207, PRE-208)
          required: [mapped, cancelled, inFlight, unmapped]
          properties:
            mapped: { type: integer, minimum: 0, description: Instances with a token at a mapped step }
            cancelled: { type: integer, minimum: 0, description: Instances whose work at a cancelled step will be cancelled }
            inFlight: { type: integer, minimum: 0, description: Instances left on the source version because a call is in flight }
            unmapped: { type: integer, minimum: 0, description: Instances at a step no instruction handles; the plan is invalid while there are any }
    DefinitionLayout:
      type: object
      description: >-
        The layout document, `definition-layout.v1` (api/schema/definition-layout.v1.schema.json): box positions, link
        waypoints and lanes of one version. Step ids must exist in the definition.
      required: [schemaVersion, nodes]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer, enum: [1] }
        direction: { type: string, enum: [LR, TB] }
        nodes:
          type: object
          maxProperties: 500
          additionalProperties:
            type: object
            required: [x, y]
            additionalProperties: false
            properties:
              x: { type: number, minimum: -100000, maximum: 100000 }
              y: { type: number, minimum: -100000, maximum: 100000 }
              width: { type: number, exclusiveMinimum: 0, maximum: 2000 }
              height: { type: number, exclusiveMinimum: 0, maximum: 2000 }
        edges:
          type: object
          maxProperties: 2000
          description: 'Waypoints keyed by `from->to`'
          additionalProperties:
            type: array
            maxItems: 50
            items:
              type: object
              required: [x, y]
              additionalProperties: false
              properties:
                x: { type: number, minimum: -100000, maximum: 100000 }
                y: { type: number, minimum: -100000, maximum: 100000 }
        lanes:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, label, nodes]
            additionalProperties: false
            properties:
              id: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
              label: { type: string, maxLength: 200 }
              nodes: { type: array, uniqueItems: true, items: { type: string } }
    LayoutRevision:
      type: object
      required: [revision, layoutHash, definitionHash, source, createdBy, createdAt]
      properties:
        revision: { type: integer, minimum: 1 }
        layout:
          description: The layout document; absent in a revision list.
          allOf: [{ $ref: '#/components/schemas/DefinitionLayout' }]
        layoutHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        definitionHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The hash of the definition the layout was drawn for; it never changes with a save.
        source: { type: string, enum: [IMPORT, BPMN, COCKPIT, API] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    LayoutRevisionPage:
      type: object
      required: [items, nextAfter]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LayoutRevision' } }
        nextAfter: { type: [integer, 'null'], description: 'Pass as `after` for the next page; null on the last page' }
    MigrationExecution:
      type: object
      required: [migrationId, status, approval, lockVersion, progress]
      properties:
        migrationId: { type: string }
        status:
          type: string
          enum: [PLANNED, PROPOSED, REJECTED, APPROVED, RUNNING, COMPLETED, COMPLETED_WITH_FAILURES]
        approval: { $ref: '#/components/schemas/MigrationApproval' }
        lockVersion: { type: integer, minimum: 0, description: 'The `ETag`; send it in `If-Match` to approve or reject' }
        proposedBy: { type: [string, 'null'] }
        proposedAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'], description: 'The proposer in the single mode' }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectedBy: { type: [string, 'null'] }
        rejectedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }
        progress:
          type: object
          required: [total, migrated, failed, skipped]
          properties:
            total: { type: integer, minimum: 0, description: 'Running instances of the source version when the execution was proposed or approved' }
            migrated: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0, description: 'Each has an incident' }
            skipped: { type: integer, minimum: 0, description: 'Ended or moved on before the runner reached them' }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
    MigrationOutcome:
      type: object
      required: [instanceId, outcome, code, detail, occurredAt]
      properties:
        instanceId: { type: string }
        outcome: { type: string, enum: [MIGRATED, FAILED, SKIPPED] }
        code:
          type: string
          description: '`MOVED`; for a failure `STEP_NOT_IN_TARGET`, `STEP_TYPE_CHANGED` or `LOCK_CONFLICT`; for a skip `NOT_RUNNING`, `NOT_ON_SOURCE`, `INSTANCE_GONE` or `STEP_IN_FLIGHT`'
        detail: { type: string, maxLength: 500 }
        incidentId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
    MigrationOutcomePage:
      type: object
      required: [items, nextAfter]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MigrationOutcome' } }
        nextAfter: { type: [string, 'null'] }
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [INPUT_INVALID, QUERY_INVALID, QUERY_TIMEOUT, ROLE_FAN_OUT_EXCEEDED, UNAUTHENTICATED, PERMISSION_DENIED, TASK_NOT_ASSIGNED,
            SELF_APPROVAL_FORBIDDEN, TENANT_NOT_ALLOWED, NO_EFFECTIVE_VERSION, DEFINITION_NOT_FOUND, INSTANCE_NOT_FOUND, ASYNC_STEP_NOT_FOUND,
            TASK_NOT_FOUND, FORM_NOT_DECLARED, INVALID_STATE, VERSION_CONFLICT, VERSION_SUPERSEDED, LAST_VERSION_IN_EFFECT,
            IDEMPOTENCY_IN_FLIGHT, PAYLOAD_TOO_LARGE, START_ARRIVALS_FULL, VALIDATION_FAILED, GUARDRAIL_CONTRACT_INVALID, BPMN_UNSUPPORTED_ELEMENT,
            CMMN_UNSUPPORTED, BPMN_UNSAFE_XML, DEFINITION_TOO_LARGE, IDEMPOTENCY_KEY_REUSE_MISMATCH, STEP_FAILED, FORM_VALIDATION_FAILED,
            PRECONDITION_REQUIRED, DEFINITION_INTEGRITY_FAILED, EVENT_LISTENER_FAILED, REPLAY_NOT_FOUND, RULE_SET_NOT_FOUND,
            REPLAY_TOO_LARGE, MIGRATION_NOT_FOUND, CONTENT_HASH_REQUIRED, CONTENT_CHANGED, CHANGE_SET_TRUNCATED,
            INCIDENT_NOT_FOUND, DRY_RUN_REQUIRED, MIGRATION_PLAN_INVALID, LAYOUT_INVALID, LAYOUT_NOT_FOUND, CALENDAR_NOT_FOUND, ASSIGNEE_NOT_ALLOWED,
            OUTPUT_INVALID, MESSAGE_NOT_CORRELATED, MESSAGE_CORRELATION_AMBIGUOUS, INTERNAL]
        detail: { type: string }
        correlationId: { type: string }
        problems:
          type: array
          description: Present on `VALIDATION_FAILED` and `GUARDRAIL_CONTRACT_INVALID`, at most 100 entries
          items: { $ref: '#/components/schemas/DefinitionProblemItem' }
        unsupportedElements:
          type: array
          description: >-
            Present on `BPMN_UNSUPPORTED_ELEMENT`, in document order, at most 100 entries. The same field and item
            shape as the Rule Engine's refusals of a standard (PD-141)
          items: { $ref: '#/components/schemas/UnsupportedElement' }
        violationsTruncated:
          type: boolean
          description: Present, and true, on `BPMN_UNSUPPORTED_ELEMENT` when more than 100 elements were found
        warnings:
          type: array
          description: >-
            Present on `BPMN_UNSUPPORTED_ELEMENT` when the file also has vendor attributes or extensions, listed as
            `FOREIGN_EXTENSION_IGNORED` with the namespace in `message` and the line; the stored source keeps them
          items: { $ref: '#/components/schemas/DefinitionProblemItem' }
        namespace: { type: string, description: 'Present on `CMMN_UNSUPPORTED`, the namespace of the root element' }
        line: { type: integer, description: 'Present on `CMMN_UNSUPPORTED`, the line of the root element' }
        nodeId: { type: string, description: Present on `STEP_FAILED` }
        cases: { type: integer, description: 'Present on `REPLAY_TOO_LARGE`, the recorded answers in the period' }
        limit: { type: integer, description: 'Present on `REPLAY_TOO_LARGE`, `replay.max-cases`' }
        cap: { type: integer, description: 'Present on `ROLE_FAN_OUT_EXCEEDED`, `query.max-roles`' }
        provided: { type: integer, description: 'Present on `ROLE_FAN_OUT_EXCEEDED`, the role and group queues the list would read' }
        violations:
          type: array
          description: >-
            Present on `FORM_VALIDATION_FAILED`: each failing path and rule, for example `$.riskScore: expected
            integer`, never a value
          items: { type: string }
        errors:
          type: array
          description: >-
            Present on `FORM_VALIDATION_FAILED`: the same failures as `violations`, in the same order, each with the
            JSON Pointer of the failing field (`/reason`; the empty pointer is the whole result) and the rule, never
            a value
          items:
            type: object
            required: [pointer, rule]
            properties:
              pointer: { type: string }
              rule: { type: string }
        currentDefinitionHash: { type: string, description: 'Present on `CONTENT_CHANGED`, the hash of the content stored now' }
        currentLockVersion: { type: integer, description: 'Present on `CONTENT_CHANGED`, the lock version stored now' }
        currentChangeSetHash: { type: string, description: 'Present on `CONTENT_CHANGED` when the change set was not the one reviewed (PRE-202), the hash of the change set now' }
        paths:
          type: array
          description: 'Present on `OUTPUT_INVALID`, `LAYOUT_INVALID` and `MIGRATION_PLAN_INVALID`: each failing path and rule, for example `$.approvedLimit: required` or `$.nodes.ghost-step names a step that is not in the definition`, never a value'
          items: { type: string }
        definitionKey: { type: string, description: Present on `LAST_VERSION_IN_EFFECT` }
        version: { type: integer, description: Present on `LAST_VERSION_IN_EFFECT` }
        setting:
          type: string
          enum: [confirm, refuse]
          description: Present on `LAST_VERSION_IN_EFFECT`, the `lifecycle.retire-last-version` value in force
        nextEffectiveFrom:
          type: [string, 'null']
          format: date-time
          description: Present on `LAST_VERSION_IN_EFFECT`; when the next approved version takes effect, or null
        reason:
          type: string
          description: >-
            Present on `STEP_FAILED`, for example `DECISION_NO_MATCH`, `STEP_LIMIT`,
            `NO_PATH` (an exclusive gateway with no true condition and no default flow) or `CONDITION_ERROR`
            (a condition that compares values of different types or currencies). A handler's business error is
            not a `STEP_FAILED`: the step waits with an incident `UNHANDLED_BUSINESS_ERROR`. On
            `ASSIGNEE_NOT_ALLOWED` (#442, `PRE-206`), which rule refused the target: `ALREADY_ASSIGNED`,
            `FOUR_EYES_PARTICIPANT`, `RESERVED_IDENTITY`, `MISSING_ROLE` or `MISSING_GROUP`; new reasons may be added
        required:
          type: string
          description: >-
            Present on `ASSIGNEE_NOT_ALLOWED` with `MISSING_ROLE` or `MISSING_GROUP`: the role or group the target
            lacks, as `role:<id>` or `group:<id>`; `GET /api/bpm/display-names` gives its readable name
